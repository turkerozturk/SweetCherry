ctbImport.explanation=All records listed below will be copied. Roots are appended after existing roots, with the original hierarchy and shared groups preserved. New IDs are allocated; content, properties and timestamps are preserved. Bookmarks are appended. The source file is not changed. Confirm only if you want to add this data.
