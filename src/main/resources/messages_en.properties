# Move an occurrence to a chosen parent
node.moveTo.title=Move to
node.moveTo.parent=New parent node ID
node.moveTo.help=Move this node and its subtree to the end of the chosen parent’s children. Enter 0 for the database root. Real and shared node IDs are both supported. If it already has this parent, nothing changes.
node.moveTo.cancel=Cancel
node.moveTo.submit=Move
node.moveTo.loading=Checking the tree…
node.moveTo.invalid=Enter a valid node ID (0 or a positive whole number).
node.moveTo.missing=The source or target node no longer exists. Check the ID or reload the page.
node.moveTo.cycle=A node cannot be moved into itself or one of its descendants. Choose another parent.
node.moveTo.stale=The tree or selected database has changed. Close and reopen this window; reload the page if necessary.
node.moveTo.denied=Moving is not permitted. Check your sign-in and whether the selected database is writable.
node.moveTo.failed=The move could not be confirmed. Reload the page and check the node’s position before trying again.
