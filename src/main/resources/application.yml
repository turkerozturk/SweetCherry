# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
#  Setting up an SSL in a Spring Boot application without using a keytool and keystore
# https://www.youtube.com/watch?v=B4FxG2Diio0
# SSL HTTPS
server:
  tomcat:
    max-http-form-post-size: 32MB # Rich-text image data is submitted together with the XML.
  # Varsayilan hesaplar gelistirme/yerel kullanim icindir. Bu nedenle iki HTTP connector da
  # varsayilan olarak yalnizca bu bilgisayardan erisilebilir. Uzak erisim bilincli olarak
  # yapilandirilacaksa guvenli kimlik bilgileri ve HTTPS ile birlikte degistirilmelidir.
  address: 127.0.0.1
  port: 8443 # Unprivileged default; native HTTPS still requires explicit SSL configuration.
 # ssl:
 #   certificate: "classpath:ssl-self-signed-certificate/certificate.crt"
 #   certificate-private-key: "classpath:ssl-self-signed-certificate/private.key"
  shutdown: graceful
  # Proxy HTTPS is handled by an explicitly trusted peer, not arbitrary Forwarded headers.
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        # Leave secure unset: Tomcat marks HTTPS cookies Secure and still permits local HTTP.
  http:
    port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never
    whitelabel:
      enabled: false

