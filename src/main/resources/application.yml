# https://shredzone.org/maven/commons-suncalc/examples.html
# LOCATION
astronomy:
  enabled: true # Offline widget; configured location below is an example, not automatic GPS.
  latitude: 51.4779 # Greenwich Royal Observatory, example location.
  longitude: -0.0015
  timezone: Europe/London
  # Legacy zonalOffset is no longer used; timezone includes daylight-saving rules.

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# EMAIL
# https://www.baeldung.com/spring-email
# https://dev.to/vatana7/how-to-send-email-in-springboot-springboot-tutorial-4jjm
# https://www.baeldung.com/spring-value-annotation
# https://stackoverflow.com/questions/34529216/boolean-values-in-spring-application-properties-file
# https://stackoverflow.com/questions/13585259/evaluating-spring-value-annotation-as-primitive-boolean

spring:
  mail: # EMAIL
    host: smtp.gmail.com
    port: 587
    username: username@gmail.com
    password: password
    properties:
      mail.transport.protocol: smtp
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
    debug: true
  lifecycle:
    timeout-per-shutdown-phase: 25s
  http:
    encoding:
      charset: UTF-8
  jpa: # DATABASE
    properties:
      hibernate:
        globally_quoted_identifiers: true # Tablo/kolon adlarini secilen dialect'e gore alintilar.
        globally_quoted_identifiers_skip_column_definitions: true # BLOB gibi columnDefinition tiplerini alintilamaz.
        boot:
          allow_jdbc_metadata_access: false # Hibernate 6 icin JDBC metadata erisimini kapatir; tenant secilmeden acilabilsin.
        temp:
          use_jdbc_metadata_defaults: false # DIKKATE AL: Eski Hibernate ayari; geriye donuk hatirlatma icin tutuluyor.
    hibernate:
      ddl-auto: none #https://www.baeldung.com/spring-data-jpa-run-app-without-db
  properties:
    hibernate:
      format_sql: true
  datasource: # PLEASE LOOK AT THE "allTenants" folder.
  main:
    banner-mode: off
  thymeleaf: # boot-calendar github: https://github.com/metronome12/boot-calendar
    cache: true
  cache:
    type: simple

# Swagger/OpenAPI kutuphanesi JAR icinde tutulur fakat normal kullanici calismasinda kapali olur.
# Gerektiginde --spring.profiles.active=operations ile application-operations.yml tarafindan acilir.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# https://www.baeldung.com/multitenancy-with-spring-data-jpa
