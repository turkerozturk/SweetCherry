# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# LOGGING
# Her zaman su linkten bakilmali kullanilabilecek degisken isimlerine:
# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html#appendix.application-properties.core
logging:
  file:
    name: myapp.log
  threshold:
    console: INFO
    file: TRACE



# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# My custom variables
myapp:
  # Read-only Word attachment preview: DOCX and legacy DOC. No document is saved.
  node-fragments:
    max-depth: 3 # Nested link levels, 1..5. Reader preference defaults off.
    max-inclusions: 20 # Per displayed note, 1..50; repeated fragments count separately.
    max-source-characters: 250000 # Note + codebox/table source budget, 1..1000000.
    max-html-characters: 1048576 # Per fragment response, 1024..2097152.
    max-object-bytes: 16777216 # Stored image/attachment payload budget, 1024..33554432.
    max-objects: 200 # Images/attachments/anchors/codeboxes/tables, 1..500.
  drawio-preview:
    # Bundled shape families; all enabled by default. Changes require restart.
    shape-libraries:
      active-directory: true
      alibaba-cloud: true
      allied-telesis: true
      android: true
      archimate: true
      archimate3: true
      archimate4: true
      arrows: true
      arrows2: true
      atlassian: true
      atlassian2: true
      aws: true
      aws2: true
      aws3: true
      aws3d: true
      aws4: true
      azure: true
      azure2: true
      basic: true
      bootstrap: true
      bpmn: true
      c4: true
      cabinets: true
      cisco: true
      cisco19: true
      cisco-safe: true
      citrix: true
      citrix2: true
      clip-art: true
      cumulus: true
      dfd: true
      dynamics365: true
      eip: true
      electrical: true
      emoji: true
      er: true
      floorplan: true
      flowchart: true
      fluid-power: true
      gcp: true
      gcp2: true
      gcp3: true
      gmdl: true
      ibm: true
      ibm-cloud: true
      infographic: true
      ios: true
      ios7: true
      ios7ui: true
      kubernetes: true
      kubernetes2: true
      lean-mapping: true
      mockup: true
      mscae: true
      networks: true
      networks2: true
      office: true
      openstack: true
      pid: true
      pid2inst: true
      pid2misc: true
      pid2valves: true
      rack: true
      rackgeneral: true
      salesforce: true
      sap: true
      signs: true
      sitemap: true
      sysml: true
      uml25: true
      veeam: true
      veeam2: true
      vvd: true
      webicons: true
      weblogos: true
    max-file-bytes: 16777216
    max-page-bytes: 16777216
    max-total-bytes: 134217728
    max-pages: 512
    max-cells-per-page: 20000
    max-total-cells: 200000
    max-label-characters: 100000
    max-xml-elements: 500000
    max-xml-attributes: 128
    max-xml-depth: 128
    max-parent-depth: 256
    max-geometry-depth: 16
    max-geometry-points: 10000
    max-coordinate: 1000000

  file-preview:
    max-text-bytes: 262144 # First text bytes only; 1024..1048576.
    max-characters: 200000 # Unicode code points; 1..1000000.
    hex-bytes-per-page: 512 # 128..4096, a multiple of 16.
    max-archive-bytes: 5242880 # Complete archive input; 1024..20971520.
    max-expanded-bytes: 33554432 # TAR.GZ decompression cap; 1024..67108864.
    max-entries: 1000 # Visible archive rows; 1..2000.
  word-preview:
    max-file-bytes: 5242880 # 5 MiB; allowed 1024..20971520.
    max-expanded-bytes: 16777216 # Aggregate DOCX ZIP data; allowed 1024..67108864.
    max-characters: 200000 # Displayed Unicode code points, 1..1000000.
    max-blocks: 1000 # Paragraphs/tables, 1..2000.
    max-table-rows: 100 # Per table, 1..200.
    max-table-columns: 20 # Per table, 1..50.

  # Read-only Excel attachment preview. Limits apply before rendering; no workbook is saved.
  excel-preview:
    max-file-bytes: 5242880 # 5 MiB; allowed 1024..20971520.
    max-expanded-bytes: 16777216 # Aggregate XLSX ZIP data; allowed 1024..67108864.
    rows-per-page: 100 # 1..200.
    max-columns: 50 # 1..100; first columns only.
    max-cell-characters: 2000 # 1..4000 Unicode code points.

  codebox-gallery:
    font-size: 14
    preview-max-characters: 2400
    preview-max-lines: 20
    viewer-max-characters: 200000
    page-size: 12
  # Read-only table gallery: fixed pixel sizes, never stretch columns to fill the screen.
  table-gallery:
    cell-width: 160
    cell-padding: 6
    font-size: 14
    cell-max-height: 160
    preview-height: 260
    preview-rows: 5
    preview-columns: 5
    viewer-rows: 200
    page-size: 12
  appearance:
    theme: light # light (existing appearance) or dark; restart after changing.
    node-background-color: white # CSS color name or quoted hex (e.g. "#fff8dc"). User menu can override without restart.
  custom-lists:
    views:
      date-time-format: "yyyy-MM-dd HH:mm:ss"
      time-zone: "" # Empty uses the JVM/operating system zone; e.g. Europe/Istanbul or UTC.
      max-design-characters: 131072
      max-rendered-characters: 16777216
    main-node-name: cherrytemplatetasks
    template-prefix: cherrytemplate # A separating hyphen is added unless already present.
  text-tree-export:
    max-nodes: 10000
    max-depth: 64
    max-node-characters: 8388608
    max-text-bytes: 67108864 # Total uncompressed UTF-8 file contents; ZIP is staged on disk.
  ctb-backup:
    enabled: true
    directory: backups/ctb # Full SQLite snapshots; relative to the application working directory.
    automatic:
      enabled: false # Opt in, then explicitly list registered tenant names below.
      interval-minutes: 1440
      retry-minutes: 5
      keep-last: 0 # 0 = unlimited; only automatic backups of the same physical source are pruned.
      tenants: []
  home:
    open-latest-modified: true # After database selection only; false keeps the virtual root.
    modified-minimum: 5 # All today's occurrences, filled with older ones to this minimum; 0 hides the list.
    created-minimum: 5 # Uses myapp.calendar.time-zone (system by default).
  calendar:
    first-day-of-week: MONDAY # 1=Monday ... 7=Sunday, or an English day name.
    time-zone: system # JVM/system time zone; or e.g. Europe/Istanbul.
    max-entries: 10000 # Visible tree occurrences per calendar range (maximum 50000).
    day-max-entries: 300 # Day cards, 1..2000, also bounded by max-entries.
    day-preview-max-characters: 600 # Unicode code points including ellipsis, 1..20000.
    day-preview-max-lines: 8 # Source lines and visual line clamp, 1..100. Restart after changing.
  audit:
    enabled: false # CTBLOGS history for documented content/properties/tags/moves/bookmark writes.
    max-event-characters: 16777216 # Fail the whole edit if its audit record cannot be stored (1,000,000..67,108,864).
  trash:
    enabled: false # Reversible Delete: move occurrences to TRASH BIN, preserving IDs and shared links.
  reminders:
    enabled: true # Forms, list and reminder APIs. Existing records are preserved when disabled.
    alarms-enabled: true # In-page visual alarm panel and polling; requires enabled.
    sound-enabled: true # Default-on sound preference; browser user activation may still be required.
  tree:
    # Desktop /tree only. Saved browser width takes precedence; other splitters are unaffected.
    default-width: 600 # Pixels, clamped to 20..1900 and the available viewport width.
    show-tag-indicator: true # Small superscript # beside tagged node names in /tree; restart after changing.
    saved-searches-enabled: true # Virtual branches from this user's saved Advanced Search filters; restart after changing.
    font-size: 16 # Tree labels in pixels: 10..32.
    vertical-padding: 1 # Pixels above/below the row AND label: 0..12; 1 halves the previous spacing.
  ctb-import:
    # Server-side CTB file AND decoded field bytes; not an HTTP upload limit. Restart after editing.
    max-bytes: 67108864 # 64 MiB; raise only with enough Java heap and physical RAM.
    max-records: 200000 # Combined rows in all six CTB tables.
  # Empty: use browser language. Optional fixed initial language: en or tr. User choice overrides it.
  default-language: ""
  # ADMIN-only public webpage import; no LAN/local URLs or browser login cookies.
  web-import-enabled: true
  web-bookmarks-enabled: true # Live, inert previews for read-only empty nodes whose names are HTTP(S) URLs.
  pdf:
    # PDF workload limits; increase deliberately for larger exports on stronger machines.
    max-nodes: 512
    max-depth: 64
    max-node-text-characters: 8388608
    max-html-characters: 67108864
    max-image-bytes: 50331648
    max-image-pixels: 40000000
  security:
    proxy-https-enabled: false
    proxy-https-port: 443
    # Enable only for a hostname with a trusted HTTPS certificate, not self-signed/local HTTP.
    hsts-enabled: false
  command-line-runner:
    enabled: false
  openWebBrowserOnStartup: false
  debug: false
  syntax-highlighting:
    # Client-side highlight.js for code nodes; plain text and PDF stay readable without JavaScript.
    enabled: true
  operations:
    enabled: false
  scheduling:
    enabled: false
  exportingFolderName: exportedFiles
  login:
    # Prints generated admin credentials once to local process output, never to the web or myapp.log.
    show-initial-password: true
    # Set only when a trusted reverse proxy overwrites X-SweetCherry-Client-IP.
    # Empty means use the direct TCP peer for login limits and security logs.
    trusted-proxy-address: ""
    admin:
      name: admin
    user:
      name: user

# ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# ACTUATOR
# (DEVOPS larin gozlem yapmasi icin yazagi url ler)
# health ve info normal calismada aciktir. Digerleri operations profilinde * ile acilir.
# <severurl>/actuator/health
# <severurl>/actuator/info
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    shutdown:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: SweetCherry
    version: "development" # /actuator/info uses the actual artifact build version.
