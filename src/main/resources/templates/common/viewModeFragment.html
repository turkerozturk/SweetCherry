<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="viewModeFragment">
    <li><a class="dropdown-item" th:href="@{/changeView(mode='tree')}"><i class="fas fa-desktop"></i> <span th:text="#{view.desktop}">Desktop</span> <i th:if="${viewMode == 'tree'}" class="fas fa-check"></i></a></li>
    <li><a class="dropdown-item" th:href="@{/changeView(mode='reader')}"><i class="fas fa-mobile-alt"></i> <span th:text="#{view.mobile}">Mobile</span> <i th:if="${viewMode == 'reader'}" class="fas fa-check"></i></a></li>
    <li th:if="${currentTenantName}"><div class="dropdown-divider"></div></li>
    <li th:if="${currentTenantName}"><a class="dropdown-item" th:href="@{/markmap-quick-mind-map/all}" target="_blank" rel="noopener noreferrer"><i class="fas fa-project-diagram"></i> <span th:text="#{view.mindmap1}">Mind Map 1</span></a></li>
    <li th:if="${currentTenantName}"><a class="dropdown-item" th:href="@{/quick-mind-map/all}" target="_blank" rel="noopener noreferrer"><i class="fas fa-project-diagram"></i> <span th:text="#{view.mindmap2}">Mind Map 2</span></a></li>
    <li th:if="${currentTenantName}"><div class="dropdown-divider"></div></li>
    <li th:if="${currentTenantName}"><a class="dropdown-item" th:href="@{/cherrytemplatetasks}"><i class="fas fa-list"></i> <span th:text="#{view.special1}">SweetCherry Special 1</span></a></li>
    <li th:if="${currentTenantName}"><hr class="dropdown-divider"></li>
    <li th:if="${currentTenantName}"><a class="dropdown-item" th:href="@{/nodes/timeline/modified(_tenantView=${tenantViewToken})}"><i class="fas fa-clock"></i> <span th:text="#{timeline.recentModified}">Recently Modified</span></a></li>
    <li th:if="${currentTenantName}"><a class="dropdown-item" th:href="@{/nodes/timeline/created(_tenantView=${tenantViewToken})}"><i class="fas fa-plus"></i> <span th:text="#{timeline.recentCreated}">Recently Added</span></a></li>
    <li><hr class="dropdown-divider"></li>
    <li class="node-zoom-controls" role="group" th:aria-label="#{view.contentZoom}">
        <button type="button" class="btn btn-sm btn-outline-secondary" data-node-zoom="out" th:title="#{view.zoomOut}" th:aria-label="#{view.zoomOut}"><i class="fas fa-search-minus" aria-hidden="true"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-node-zoom="reset" th:title="#{view.zoomReset}" th:aria-label="#{view.zoomReset}"><span data-node-zoom-value>100%</span></button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-node-zoom="in" th:title="#{view.zoomIn}" th:aria-label="#{view.zoomIn}"><i class="fas fa-search-plus" aria-hidden="true"></i></button>
    </li>
</div></body></html>
