<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{login.signin}">SweetCherry Sign in</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/font-awesome/css/all.min.css}">

    <style>

        html,
        body {
          min-height: 100%;
        }

        body {
          display: -ms-flexbox;
          display: -webkit-box;
          display: flex;
          -ms-flex-align: center;
          -ms-flex-pack: center;
          -webkit-box-align: center;
          align-items: center;
          -webkit-box-pack: center;
          justify-content: center;
          padding-top: 16px;
          padding-bottom: 16px;
          background-color: #f5f5f5;
        }

        .form-signin {
          width: 100%;
          max-width: 330px;
          padding: 15px;
          margin: 0 auto;
        }
        .form-signin .checkbox {
          font-weight: 400;
        }
        .form-signin .form-control {
          position: relative;
          box-sizing: border-box;
          height: auto;
          padding: 10px;
          font-size: 16px;
        }
        .form-signin .form-control:focus {
          z-index: 2;
        }
        .form-signin input[type="text"] {
          margin-bottom: -1px;
          border-bottom-right-radius: 0;
          border-bottom-left-radius: 0;
        }
        .form-signin input[type="password"] {
          margin-bottom: 10px;
          border-top-left-radius: 0;
          border-top-right-radius: 0;
        }

        .login-companion {display:flex;align-items:center;gap:.6rem;margin:.8rem 0 0;text-align:left;color:#555;font-size:.85rem;line-height:1.35}
        .login-companion img {flex:0 0 36px;width:36px;height:36px;object-fit:contain}
        @media (max-height:520px) {body{align-items:flex-start;padding:8px 0}.form-signin{padding:10px 15px}}
    </style>

</head>

<!--/*-->
https://getbootstrap.com/docs/4.0/examples/sign-in/
<!--*/-->

<body class="text-center">
<form class="form-signin"
      th:action="@{/login}"
      method="post">

<p th:if="${expired}" class="alert alert-info" role="status">
        Oturumunuz sona erdi. Yeniden giriş yaptıktan sonra CTB dosyanızı seçin.
    </p>

    <label class="visually-hidden"
           for="username"
           th:text="#{login.username}"
    >Username
    </label>

    <input class="form-control"
           id="username"
           name="username"
           type="text"
           autocomplete="username" autocapitalize="none" spellcheck="false"
           th:placeholder="#{login.username}"
    />

    <label class="visually-hidden"
           for="password"
           th:text="#{login.password}"
    >Password
    </label>

    <input class="form-control"
           id="password"
           name="password"
           type="password"
           autocomplete="current-password"
           th:placeholder="#{login.password}"
    />

    <!--/*-->
    <div class="checkbox mb-3">
        <label>
            <input type="checkbox" value="remember-me" th:text="#{login.rememberMe}"> Remember me
        </label>
    </div>
    <!--*/-->

    <button class="btn btn-primary w-100"
            type="submit"

    >
        <i class="fas fa-right-to-bracket" aria-hidden="true"></i>
        <span th:text="#{login.signin}">SweetCherry Sign in</span>

    </button>





    <div class="login-companion">
        <img th:src="@{/img/logo.jpg}" alt="" width="36" height="36">
        <span th:text="#{login.companion}">A web companion for CherryTree CTB note databases.</span>
    </div>

    <div th:if="${param.error}" class="bg-rose-100 justify-center p-4 ring-1 ring-rose-200 rounded-md">
        <p th:text="#{login.username_and_pasword_mismatch}">Username and Password Mismatch</p>
    </div>


</form>






        <!--/*-->
        <div th:replace="~{common/languageFragment :: languageFragment}"></div>
        <!--*/-->



<!--/*-->
 <script type="text/javascript" th:src="@{/js/common/selectlanguage.js}"></script>
<!--*/-->


</body>
</html>
