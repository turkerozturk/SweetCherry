<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}">
<head><title th:text="#{mindmap.export.title}"></title></head>
<body><section layout:fragment="content">
<h1 th:text="#{mindmap.export.title}"></h1>
<p th:if="${rootName != null}" th:text="${rootName}"></p>
<div class="card"><div class="card-body">
<form th:action="@{/mindmap-export}" method="post">
<input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
<div class="mb-3"><label class="form-label" for="nodeId" th:text="#{mindmap.export.root}"></label>
<input class="form-control" type="number" name="nodeId" id="nodeId" min="1" step="1" th:value="${nodeId}">
<div class="form-text" th:text="#{mindmap.export.rootHelp}"></div></div>
<div class="mb-3"><label class="form-label" for="level" th:text="#{mindmap.export.level}"></label>
<input class="form-control" type="number" name="level" id="level" min="0" step="1" th:placeholder="#{mindmap.export.allLevels}">
<div class="form-text" th:text="#{mindmap.export.levelHelp}"></div></div>
<div class="mb-3"><label class="form-label" for="foldMode" th:text="#{mindmap.export.fold}"></label>
<select class="form-select" name="foldMode" id="foldMode"><option value="chat" selected th:text="#{mindmap.export.foldChat}"></option>
<option value="all-folded" th:text="#{mindmap.export.foldAll}"></option><option value="all-unfolded" th:text="#{mindmap.export.unfoldAll}"></option></select>
<div class="form-text" th:text="#{mindmap.export.foldHelp}"></div></div>
<div class="mb-3"><label class="form-label" for="includeColors" th:text="#{mindmap.export.colors}"></label>
<select class="form-select" name="includeColors" id="includeColors"><option value="true" selected th:text="#{mindmap.export.include}"></option><option value="false" th:text="#{mindmap.export.exclude}"></option></select></div>
<div class="mb-3"><label class="form-label" for="iconMode" th:text="#{mindmap.export.icons}"></label>
<select class="form-select" name="iconMode" id="iconMode">
<option value="none" selected th:text="#{mindmap.export.iconsNone}"></option>
<option value="references" th:text="#{mindmap.export.iconsReferences}"></option>
<option value="bundle" th:text="#{mindmap.export.iconsBundle}"></option></select>
<div class="form-text" th:text="#{mindmap.export.iconsHelp}"></div></div>
<button class="btn btn-primary" type="submit" th:text="#{mindmap.export.download}"></button>
</form></div></div>
</section></body></html>
