<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{_layout}">
<head>

    <title th:text="#{objects.tables}"></title>


</head>
<body>
<section layout:fragment="content">

<h1 th:if="${grids != null and !grids.isEmpty()}"><span th:text="#{objects.tablesOf}"></span> <a th:href="@{/nodes/{nodeId}(nodeId=${grids[0].id.nodeId})}" th:text="${grids[0].id.nodeId}"></a></h1>
    <p th:if="${grids != null and !grids.isEmpty()}">
        <b th:text="#{objects.nodeName}">Node name:</b>
        <span th:text="${grids[0].node.name}"></span>
    </p>
<p th:if="${grids == null or grids.isEmpty()}" class="text-body-secondary" th:text="#{objects.empty}"></p>
<table class="table">
    <thead>
    <tr>
        <th th:text="#{objects.nodeId}">Node Id</th>
        <th th:text="#{objects.offset}">Offset</th>
        <th th:text="#{objects.alignment}">Justification</th>
        <th th:text="#{objects.table}">Table</th>
        <th th:text="#{objects.colMin}">Col Min</th>
        <th th:text="#{objects.colMax}">Col Max</th>

    </tr>
    </thead>
    <tbody>
    <th:block th:each="grid : ${grids}">
        <tr>
            <td th:text="${grid.id.nodeId}"></td>
            <td th:text="${grid.id.offset}"></td>
            <td th:text="${#lists.contains({'left','right','center','fill'}, grid.justification)} ? ${#messages.msg('objects.align.' + grid.justification)} : ${grid.justification}"></td>
            <td>
                <pre class="highlight" th:utext="${xmlHelper.convertXmlTableToHtml(grid.txt)}">icerik</pre>

            </td>
            <td th:text="${grid.colMin}"></td>
            <td th:text="${grid.colMax}"></td>

        </tr>
    </th:block>
    </tbody>
</table>


</section>
</body>
</html>
