<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{_layout}">
<head>
    <title>Dosya Yükleme</title>
    <th:block layout:fragment="pageSpecificCssStyles">







    </th:block>
</head>
<body>
<section layout:fragment="content">

    <div class="kutu">

        <div class="row text-center">

            <h1>Dosya Yükleme Formu</h1>

            <form method="post" th:action="@{/upload-database}" enctype="multipart/form-data">
                <label for="file">Dosya Seç:</label>
                <input type="file" id="file" name="dosya" accept=".txt"/>
                <button class="btn btn-primary" type="submit" th:title="#{selectdatasource.upload}">
                    <i class="fas fa-upload"></i>
                    <span th:text="#{selectdatasource.upload}">Yükle</span>
                </button>
            </form>

            <div th:if="${message}" class="row">
                <p th:text="${message}"></p>
            </div>

        </div>

        <hr/>

        <div class="row text-center">
            <h3
                    th:text="#{selectdatasource.to_create_a_new_datasource_heading}"
            ></h3>

            <p
                    th:text="#{selectdatasource.to_create_a_new_datasource}"
            ></p>
            <span class="text-success"
                  th:text="${ALL_TENANTS_FOLDER}"
            ></span>
            <br/>

        </div>

        <br/>


        <div class="bg-light row">
                <div
                     th:utext="${exampleDataSourceHighlighted}">icerik
                </div>
        </div>

    </div>

</section>
</body>
</html>
