<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="#{richtext.edit.title}">Rich text editor</title>
<link rel="stylesheet" th:href="@{/css/node/richTextEditor.css}"></head>
<body>
<header class="rich-page-header"><h1 th:text="#{richtext.edit.title}"></h1><strong th:text="${editor.node.name}"></strong></header>
<form id="richEditForm" th:attr="data-leave-message=#{editor.unsaved}" th:action="@{/nodes/richtext/edit/{id}(id=${editor.node.nodeId})}" method="post">
<input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
<input type="hidden" name="revision" th:value="${editor.revision}">
<input type="hidden" name="xml" id="richXml">
<input type="hidden" name="images" id="richImages" value="{}">
<input type="hidden" name="files" id="richFiles" value="{}">
<input type="hidden" name="deleted" id="richDeleted" value="[]">
<input type="hidden" name="codeboxes" id="richCodeboxes" value="{}">
<input type="hidden" name="tables" id="richTables" value="{}">
<div class="actions rich-savebar"><button type="button" id="richToolsToggle" aria-controls="richControls" aria-expanded="false" th:text="#{editor.controls}"></button><button type="submit" th:text="#{richtext.edit.save}"></button><button type="submit" name="continueEditing" value="true" class="btn btn-success" th:text="#{editor.saveContinue}">Save and continue</button><a th:href="@{/nodes/{id}(id=${editor.node.nodeId},_tenantView=${tenantViewToken})}" th:text="#{richtext.edit.cancel}"></a></div>
<div id="richEditorShell" class="rich-editor-shell">
<aside id="richControls" th:aria-label="#{editor.controls}"><button type="button" id="richToolsClose" th:text="#{editor.closeControls}"></button>
    <div th:replace="~{common/backupWarningFragment :: backupWarning}"></div>

<p class="note" th:text="#{richtext.edit.help}"></p>
<p id="protectedHint" class="note" th:hidden="${#maps.isEmpty(editor.objects)}" th:text="#{richtext.edit.protected}"></p>
<p class="note" th:if="${editor.node.syntax == 'plain-text'}" th:text="#{richtext.edit.convert}"></p>
<label><input type="checkbox" id="richVisualMode" checked> <span th:text="#{richtext.edit.visual}"></span></label>
<div class="toolbar">
<div class="tool-group" role="group" th:aria-label="#{editor.formatTools}">
<button type="button" data-format="weight" data-value="heavy" th:title="#{richtext.edit.bold}" th:aria-label="#{richtext.edit.bold}"><b>B</b></button>
<button type="button" data-format="style" data-value="italic" th:title="#{richtext.edit.italic}" th:aria-label="#{richtext.edit.italic}"><i>I</i></button>
<button type="button" data-format="underline" data-value="single" th:title="#{richtext.edit.underline}" th:aria-label="#{richtext.edit.underline}"><u>U</u></button>
<button type="button" data-format="strikethrough" data-value="true" th:title="#{richtext.edit.strike}" th:aria-label="#{richtext.edit.strike}"><s>S</s></button>
<button type="button" data-format="family" data-value="monospace" th:title="#{richtext.edit.monospace}" th:aria-label="#{richtext.edit.monospace}"><span style="font-family:monospace">ms</span></button>
<label th:title="#{richtext.edit.color}"><span th:text="#{richtext.edit.color}"></span><input type="color" data-color="foreground" value="#3584e4" th:aria-label="#{richtext.edit.color}"></label>
<label th:title="#{richtext.edit.background}"><span th:text="#{richtext.edit.background}"></span><input type="color" data-color="background" value="#ffffff" th:aria-label="#{richtext.edit.background}"></label>
</div>
<div class="tool-group" role="group" th:aria-label="#{editor.historyTools}">
<button type="button" id="richUndo" th:title="#{editor.undoShortcut}" th:aria-label="#{richtext.edit.undo}">↶</button>
<button type="button" id="richRedo" th:title="#{editor.redoShortcut}" th:aria-label="#{richtext.edit.redo}">↷</button>
</div>
<select data-choice="scale" th:aria-label="#{richtext.edit.size}"><option value="" th:text="#{richtext.edit.normal}"></option><option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option><option value="h4">H4</option><option value="h5">H5</option><option value="h6">H6</option><option value="small">Small</option><option value="sub">Sub</option><option value="sup">Sup</option></select>
<select data-choice="justification" th:aria-label="#{richtext.edit.align}"><option value="left" th:text="#{richtext.edit.left}"></option><option value="center" th:text="#{richtext.edit.center}"></option><option value="right" th:text="#{richtext.edit.right}"></option><option value="fill" th:text="#{richtext.edit.justify}"></option></select>
<div class="tool-group" role="group" th:aria-label="#{editor.objectTools}">
<button type="button" id="richAddImage" th:text="#{richtext.edit.addImage}"></button>
<button type="button" id="richPasteImage" th:title="#{richtext.clipboardPaste}" th:aria-label="#{richtext.clipboardPaste}">📋</button>
<button type="button" id="richWebImport" th:title="#{richtext.webImport}" th:aria-label="#{richtext.webImport}">🌐</button>
<button type="button" id="richAddFile" th:text="#{richtext.edit.addFile}"></button>
<button type="button" id="richTable" th:text="#{richtext.edit.table}" th:attr="data-edit=#{richtext.edit.tableEdit}"></button>
<button type="button" id="richCodebox" th:text="#{richtext.codebox.add}" th:attr="data-edit=#{richtext.codebox.edit}"></button>
<button type="button" id="richSeparator" th:title="#{editor.separator.help}">33~</button>
<button type="button" id="richObjects" th:text="#{richtext.edit.objects}"></button>
</div>
<div class="tool-group" role="group" th:aria-label="#{editor.listTools}">
<button type="button" data-insert-symbol="☐" th:title="#{editor.insertUnchecked}" th:aria-label="#{editor.insertUnchecked}">☐</button>
<button type="button" data-insert-symbol="☑" th:title="#{editor.insertChecked}" th:aria-label="#{editor.insertChecked}">☑</button>
<button type="button" data-insert-symbol="☒" th:title="#{editor.insertCrossed}" th:aria-label="#{editor.insertCrossed}">☒</button>
<button type="button" data-insert-symbol="•" th:title="#{editor.insertBullet}" th:aria-label="#{editor.insertBullet}">•</button>
</div>
<button type="button" id="richLink" th:text="#{richtext.edit.link}"></button>
<button type="button" id="richInternalLink" th:text="#{richtext.internal.button}" th:title="#{richtext.internal.help}"></button>
<button type="button" id="richAutoLink" th:text="#{editor.linkSelection}" th:title="#{editor.linkSelectionHelp}"></button>
<button type="button" id="clearFormat" th:text="#{richtext.edit.clear}"></button>
<label><input type="checkbox" id="richAllowDeletion" name="allowObjectDeletion" value="true"><span id="richDeletionIcon">🔒</span><span th:text="#{richtext.edit.allowDeletion}"></span></label>
<input type="file" id="richImageFile" accept="image/png,image/jpeg" hidden>
<input type="file" id="richFilePicker" hidden>
<span class="note" th:text="#{richtext.edit.fileLimit(${editor.maxEmbeddedFileBytes / 1000000})}"></span>
<span id="richImageStatus" role="status" th:attr="data-error=#{richtext.edit.imageError},data-error-size=#{richtext.file.size},data-error-type=#{richtext.file.type},data-error-read=#{richtext.file.read},data-error-name=#{richtext.file.name},data-error-changed=#{richtext.file.changed},data-error-objects=#{richtext.file.objects},data-error-unsupported=#{richtext.file.unsupported}"></span>
</div>
<p id="richClipboardHint" class="note" role="alert" hidden th:attr="data-empty=#{richtext.clipboardUnavailable},data-http=#{richtext.clipboardHttp},data-plain=#{richtext.clipboardPlain},data-changed=#{richtext.file.changed}"></p>
<p id="richAutoLinkError" role="alert" hidden th:text="#{editor.linkSelectionError}"></p>
</aside>
<div id="richToolsSplitter" role="separator" tabindex="0" aria-orientation="vertical" aria-valuemin="220" aria-valuemax="480" aria-valuenow="280" th:aria-label="#{editor.resizeControls}"></div>
<main id="richWritingPane">
<label id="richTextLabel" for="richText" th:text="#{richtext.edit.text}"></label>
<textarea id="richText" spellcheck="false"></textarea>
<h2 id="richPreviewTitle" th:attr="data-visual=#{richtext.edit.text},data-preview=#{richtext.edit.preview}" th:text="#{richtext.edit.preview}"></h2><div id="richPreview" aria-labelledby="richPreviewTitle"></div>
<p id="richPasteStatus" class="note" role="alert" hidden th:text="#{richtext.edit.pasteError}"></p>
<p id="selectionHint" class="note" hidden th:text="#{richtext.edit.select}"></p>
<p id="richDeletionHint" role="alert" hidden th:text="#{richtext.edit.deletionLocked}"></p>

</main></div>
<div id="richToolsBackdrop" hidden></div>
</form>
<dialog id="richObjectDialog" style="max-width:95vw;max-height:85vh;overflow:auto" aria-labelledby="richObjectTitle">
<h2 id="richObjectTitle" th:text="#{richtext.edit.objects}"></h2>
<p th:text="#{richtext.edit.deletionHelp}"></p>
<div id="richObjectList"></div>
<button type="button" id="richObjectDelete" disabled th:text="#{richtext.edit.deleteSelected}"></button>
<button type="button" id="richObjectCancel" th:text="#{richtext.edit.cancel}"></button>
</dialog>
<dialog id="richCodeboxDialog" class="rich-codebox-dialog" aria-labelledby="richCodeboxTitle">
<h2 id="richCodeboxTitle" th:text="#{richtext.codebox.title}"></h2>
<label for="richCodeboxSearch" th:text="#{richtext.codebox.search}"></label>
<input id="richCodeboxSearch" type="search" autocomplete="off">
<div id="richCodeboxLanguages" class="rich-codebox-languages" role="radiogroup" th:aria-label="#{richtext.codebox.language}">
<label th:each="language : ${codeboxLanguages}" class="rich-codebox-language">
<input type="radio" name="richCodeboxLanguage" th:value="${language.syntax}" form="richCodeboxStandalone">
<img th:src="@{/img/ctbicons/{icon}.png(icon=${language.icon})}" width="20" height="20" alt="" loading="lazy">
<span th:text="${language.syntax == 'plain-text' ? #messages.msg('node.type.plainText') : language.syntax}"></span>
</label></div>
<p><span th:text="#{richtext.codebox.language}"></span>: <strong id="richCodeboxSelected"></strong></p>
<label for="richCodeboxText" th:text="#{richtext.codebox.text}"></label>
<textarea id="richCodeboxText" spellcheck="false" maxlength="200000"></textarea>
<p id="richCodeboxError" role="alert" hidden th:text="#{richtext.codebox.error}"></p>
<div class="actions"><button type="button" id="richCodeboxApply" th:text="#{richtext.edit.linkApply}"></button><button type="button" id="richCodeboxCancel" th:text="#{richtext.edit.cancel}"></button></div>
</dialog>
<dialog id="richTableDialog" style="max-width:95vw;max-height:90vh" aria-labelledby="richTableTitle">
<h2 id="richTableTitle" th:text="#{richtext.edit.table}"></h2>
<p th:text="#{richtext.edit.tableHelp}"></p>
<label for="richTableRows" th:text="#{richtext.edit.tableRows}"></label><input id="richTableRows" type="number" min="1" max="100" value="3">
<label for="richTableColumns" th:text="#{richtext.edit.tableColumns}"></label><input id="richTableColumns" type="number" min="1" max="20" value="3">
<button type="button" id="richTableResize" th:text="#{richtext.edit.tableResize}"></button>
<div id="richTableCells" style="overflow:auto;max-height:55vh;margin:1rem 0"></div>
<p id="richTableError" role="alert" hidden th:text="#{richtext.edit.tableError}"></p>
<div class="actions"><button type="button" id="richTableApply" th:text="#{richtext.edit.linkApply}"></button><button type="button" id="richTableCancel" th:text="#{richtext.edit.cancel}"></button></div>
</dialog>
<dialog id="richInternalDialog" class="rich-internal-dialog" aria-labelledby="richInternalTitle"
 th:attr="data-target=@{/nodes/richtext/links/target},data-matches=@{/nodes/richtext/links/matches},data-icons=@{/img/ctbicons/},data-error=#{richtext.internal.error},data-invalid=#{richtext.internal.invalid},data-missing=#{richtext.internal.missing},data-empty=#{richtext.internal.empty},data-changed=#{richtext.internal.changed},data-objects=#{richtext.internal.objects},data-loading=#{richtext.internal.loading},data-limit=#{richtext.internal.limit},data-anchor-missing=#{richtext.internal.anchorMissing},data-clipboard=#{richtext.internal.clipboard}">
<h2 id="richInternalTitle" th:text="#{richtext.internal.button}"></h2>
<p class="note" th:text="#{richtext.internal.help}"></p>
<label for="richInternalId" th:text="#{richtext.internal.id}"></label>
<div class="rich-internal-id"><input id="richInternalId" type="text" inputmode="numeric" maxlength="19" autocomplete="off"><button type="button" id="richInternalPaste" th:title="#{richtext.internal.paste}" th:aria-label="#{richtext.internal.paste}">📋</button><button type="button" id="richInternalLookup" th:text="#{richtext.internal.lookup}"></button></div>
<div id="richInternalTarget"></div>
<label for="richInternalText" th:text="#{richtext.internal.text}"></label>
<input id="richInternalText" type="text" maxlength="10000" autocomplete="off">
<button type="button" id="richInternalSearch" th:text="#{richtext.internal.search}"></button>
<div id="richInternalMatches" class="rich-internal-matches"></div>
<label for="richInternalAnchor" th:text="#{richtext.internal.anchor}"></label>
<select id="richInternalAnchor"><option value="" th:text="#{richtext.internal.whole}"></option></select>
<p id="richInternalStatus" role="status" aria-live="polite"></p>
<div class="actions"><button type="button" id="richInternalApply" th:text="#{richtext.internal.apply}"></button><button type="button" id="richInternalRemove" th:text="#{richtext.internal.remove}"></button><button type="button" id="richInternalCancel" th:text="#{richtext.edit.cancel}"></button></div>
</dialog>
<dialog id="richLinkDialog" aria-labelledby="richLinkTitle">
<h2 id="richLinkTitle" th:text="#{richtext.edit.link}"></h2>
<label for="richLinkUrl" th:text="#{richtext.edit.linkUrl}"></label>
<input id="richLinkUrl" type="url" maxlength="4091" placeholder="https://example.org" style="width:100%;box-sizing:border-box">
<p id="richLinkError" role="alert" hidden th:text="#{richtext.edit.linkError}"></p>
<div class="actions" style="margin-top:1rem">
<button type="button" id="richLinkApply" th:text="#{richtext.edit.linkApply}"></button>
<button type="button" id="richLinkRemove" th:text="#{richtext.edit.linkRemove}"></button>
<button type="button" id="richLinkCancel" th:text="#{richtext.edit.cancel}"></button>
</div>
</dialog>
<dialog id="richWebDialog" style="width:45rem;max-width:95vw;max-height:90vh;overflow:auto" aria-labelledby="richWebTitle"
 th:attr="data-endpoint=@{/nodes/richtext/import/{id}(id=${editor.node.nodeId})},data-loading=#{richtext.web.loading},data-summary=#{richtext.web.summary},data-error=#{richtext.web.error},data-error-url=#{richtext.web.urlError},data-error-blocked=#{richtext.web.blocked},data-error-large=#{richtext.web.large},data-error-busy=#{richtext.web.busy},data-error-type=#{richtext.web.type},data-error-timeout=#{richtext.web.timeout},data-error-disabled=#{richtext.web.disabled},data-error-empty=#{richtext.web.empty},data-error-changed=#{richtext.web.changed},data-error-network=#{richtext.web.network}">
<h2 id="richWebTitle" th:text="#{richtext.webImport}"></h2>
<p class="note" th:text="#{richtext.web.help}"></p>
<label for="richWebUrl" th:text="#{richtext.edit.linkUrl}"></label>
<input id="richWebUrl" type="url" maxlength="4091" placeholder="https://example.org/article" style="width:100%;box-sizing:border-box">
<div class="actions"><button type="button" id="richWebLoad" th:text="#{richtext.web.load}"></button><button type="button" id="richWebApply" disabled th:text="#{richtext.web.insert}"></button><button type="button" id="richWebCancel" th:text="#{richtext.edit.cancel}"></button></div>
<p id="richWebStatus" role="status"></p><pre id="richWebPreview" style="white-space:pre-wrap;max-height:35vh;overflow:auto"></pre>
</dialog>
<script th:inline="javascript">window.richEditorDocument = /*[[${editor.document}]]*/ {runs: []}; window.richEditorObjects = /*[[${editor.objects}]]*/ {}; window.richEditorMaxFileBytes = /*[[${editor.maxEmbeddedFileBytes}]]*/ 9000000; window.richEditorTenant = /*[[${tenantViewToken}]]*/ "";</script>
<script src="/js/node/richTextVisualModel.js"></script>
<script src="/js/node/richTextClipboard.js"></script>
<script th:src="@{/js/common/editorLeaveGuard.js}"></script>
<script th:src="@{/js/node/richTextImageClipboard.js}"></script>
<script th:src="@{/js/node/richTextEditorSupport.js}"></script>
<script src="/js/node/richTextEditor.js"></script>
<script th:src="@{/js/node/richTextWebImport.js}"></script>
<script th:src="@{/js/node/richTextInternalLink.js}"></script>
<script th:src="@{/js/node/richTextEditorLayout.js}"></script>
</body></html>
