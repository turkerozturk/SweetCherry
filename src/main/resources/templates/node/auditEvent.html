<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}"><head><title th:text="#{audit.review}"></title><section layout:fragment="pageSpecificCssStyles"><style>.audit-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.audit-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:32rem;overflow:auto;border:1px solid var(--bs-border-color,#888);padding:.6rem}.audit-row{overflow-wrap:anywhere}.audit-fields{white-space:pre-wrap;font-size:.85rem;max-width:35rem}@media(max-width:767px){.audit-compare{grid-template-columns:1fr}}</style></section></head><body><section layout:fragment="content" class="container-fluid py-3 audit-row">
<h1 th:text="${#messages.msg('audit.action.'+event.action)}"></h1><p><span th:text="${event.time}"></span> · <span th:text="${event.actor}"></span> · <code th:text="${event.id}"></code></p><p class="alert alert-info" th:text="#{audit.inspectOnly}"></p><a class="btn btn-outline-secondary mb-2" th:href="@{/nodes/audit/{id}/download(id=${event.id},_tenantView=${tenantViewToken})}" th:text="#{audit.downloadEvent}"></a><p th:if="${metadataLimited}" class="alert alert-info" th:text="#{audit.metadataLimited}"></p><p th:unless="${event.requestedObjectDeletions.empty}" th:text="#{audit.deletions(${event.requestedObjectDeletions})}"></p>
<section th:each="kind:${ {'nodes','tree','bookmarks'} }" th:with="changes=${kind=='nodes'?nodeChanges:(kind=='tree'?treeChanges:bookmarkChanges)}" th:unless="${kind=='nodes'?nodeChanges.empty:(kind=='tree'?treeChanges.empty:bookmarkChanges.empty)}"><h2 class="h4" th:text="${#messages.msg('audit.section.'+kind)}"></h2><div class="table-responsive"><table class="table table-bordered"><thead><tr><th>ID</th><th th:text="#{audit.before}"></th><th th:text="#{audit.after}"></th></tr></thead><tbody><tr th:each="change:${changes}"><td><a th:href="@{/tree(nodeId=${change.id},_tenantView=${tenantViewToken})}" th:text="${change.id}"></a></td><td><dl class="audit-fields"><th:block th:each="field:${change.before}" th:if="${change.after==null or field.value!=change.after[field.key]}"><dt th:text="${field.key}"></dt><dd th:text="${field.value}"></dd></th:block></dl></td><td><dl class="audit-fields"><th:block th:each="field:${change.after}" th:if="${change.before==null or field.value!=change.before[field.key]}"><dt th:text="${field.key}"></dt><dd th:text="${field.value}"></dd></th:block></dl></td></tr></tbody></table></div></section>
<h2 th:unless="${sources.empty}" class="h4" th:text="#{audit.content}"></h2><div class="audit-compare"><section th:each="view:${sources}"><h3 class="h5"><span th:text="${#messages.msg('audit.'+view.source.stage)}"></span> [<span th:text="${view.source.id}"></span>] · <span th:text="${view.source.syntax}"></span> · <span th:text="${view.source.name}"></span></h3><p th:if="${view.longPlain or view.longRaw or view.longObjects}" class="alert alert-info" th:text="#{audit.previewLimited}"></p><a th:href="@{/nodes/audit/{id}/source(id=${event.id},nodeId=${view.source.id},stage=${view.source.stage},_tenantView=${tenantViewToken})}" th:text="#{audit.downloadText}"></a><pre class="audit-text" th:text="${view.plain}"></pre><details><summary th:text="#{audit.source}"></summary><a th:href="@{/nodes/audit/{id}/source(id=${event.id},nodeId=${view.source.id},stage=${view.source.stage},raw=true,_tenantView=${tenantViewToken})}" th:text="#{audit.downloadSource}"></a><p th:if="${view.source.rawNull}" th:text="#{audit.nullSource}"></p><pre class="audit-text" th:text="${view.raw}"></pre></details><details><summary th:text="#{audit.objects}"></summary><pre class="audit-text" th:text="${view.objects}"></pre></details></section></div>
<a class="btn btn-secondary mt-3" th:href="@{/nodes/audit(day=${#strings.substring(event.time,0,10)},_tenantView=${tenantViewToken})}" th:text="#{audit.back}"></a>
</section></body></html>
