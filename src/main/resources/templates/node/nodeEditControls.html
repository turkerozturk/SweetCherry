<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<th:block th:fragment="edit" th:if="${canDeleteNode == true and node != null}" sec:authorize="hasRole('ADMIN')"
 th:with="plain=${canEditNodeContent == true},rich=${isSharedNode != true and (node.syntax == 'plain-text' or node.syntax == 'custom-colors') and node.isReadOnly16bit % 2 == 0}">
<a th:if="${plain != rich}" data-toolbar-item="edit" class="btn btn-sm btn-outline-primary"
 th:href="${rich} ? @{/nodes/richtext/edit/{id}(id=${requestedNodeId},_tenantView=${tenantViewToken})} : @{/nodes/content/{id}(id=${requestedNodeId},_tenantView=${tenantViewToken})}">
<i aria-hidden="true" th:class="${rich ? 'fas fa-bold' : (node.syntax == 'markdown' ? 'fab fa-markdown' : (node.syntax == 'plain-text' ? 'fas fa-align-left' : 'fas fa-code'))}"></i> <span th:text="#{tree.edit}"></span></a>
<div th:if="${plain and rich}" data-toolbar-item="edit" class="dropdown">
<button type="button" class="btn btn-sm btn-outline-primary dropdown-toggle" data-bs-toggle="dropdown"><i class="fas fa-edit" aria-hidden="true"></i> <span th:text="#{tree.edit}"></span></button>
<div class="dropdown-menu">
<a class="dropdown-item" th:href="@{/nodes/content/{id}(id=${requestedNodeId},_tenantView=${tenantViewToken})}"><i class="fas fa-edit" aria-hidden="true"></i> <span th:text="#{tree.edit}"></span></a>
<a class="dropdown-item" th:href="@{/nodes/richtext/edit/{id}(id=${requestedNodeId},_tenantView=${tenantViewToken})}"><i class="fas fa-bold" aria-hidden="true"></i> <span th:text="#{richtext.edit.short}"></span></a>
</div></div></th:block></body></html>
