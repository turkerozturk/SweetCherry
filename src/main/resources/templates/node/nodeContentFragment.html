<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div th:fragment="nodeContentFragment">



    <div th:if="${node}" th:with="emptyContent=${node.contentEmpty}">

        <div id="content">

            <p th:if="${emptyContent}" class="node-empty-content border rounded bg-body-tertiary text-body-secondary small fst-italic p-3" role="status" th:text="#{node.emptyNotice}"></p>
            <div id="nodeContent" th:unless="${emptyContent}">




                <div>
                    <div th:if="${node.syntax eq 'plain-text'}"
                         th:text="${node.txt}"
                         class="nodetextformatting" style="white-space: pre-wrap; overflow-wrap: anywhere;">icerik
                    </div>
                    <div th:if="${node.syntax eq 'custom-colors'}"
                         th:utext="${node.txtAsHtml}">
                        icerik
                    </div>
                    <div th:unless="${node.syntax eq 'plain-text' or node.syntax eq 'custom-colors'}"
                         class="">
                        <div th:utext="${node.txtAsHtml}">icerik</div>
                    </div>
                </div>

            </div>
        </div>
    </div>



</div>

</body>
</html>
