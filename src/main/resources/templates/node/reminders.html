<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}">
<head><title th:text="#{reminder.title}"></title></head><body><section layout:fragment="content" class="container-fluid p-3">
<h1 th:text="#{reminder.title}"></h1><p th:text="#{reminder.help}"></p>
<p class="alert alert-success" role="status" th:if="${reminderSaved == true}" th:text="#{reminder.saved}"></p>
<p th:text="#{reminder.counts(${reminders.upcoming},${reminders.overdue},${reminders.done},${reminders.cancelled})}"></p>
<form method="get" th:action="@{/nodes/reminders}" class="d-flex flex-wrap align-items-end gap-2 mb-3">
<input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
<div><label for="reminderSearch" th:text="#{reminder.search}"></label><input id="reminderSearch" name="q" type="search" maxlength="500" class="form-control" th:value="${reminders.options.q}"></div>
<div><label for="reminderStatus" th:text="#{reminder.status}"></label><select id="reminderStatus" name="status" class="form-select"><option th:each="key : ${ {'pending','upcoming','overdue','done','cancelled','all'} }" th:value="${key}" th:selected="${reminders.options.status == key}" th:text="${#messages.msg('reminder.state.'+key)}"></option></select></div>
<div><label for="reminderLimit" th:text="#{tags.perPage}"></label><input id="reminderLimit" name="limit" type="number" min="1" max="200" required class="form-control" style="width:7rem" th:value="${reminders.options.limit}"></div>
<button type="submit" class="btn btn-primary" th:text="#{reminder.refresh}"></button></form>
<p th:if="${invalidOptions == true}" class="alert alert-warning" th:text="#{tags.invalidOptions}"></p>
<p class="text-muted" th:text="#{reminder.asOf(${reminders.asOf})}"></p>
<p th:if="${canEditReminders != true}" class="text-muted" th:text="#{todo.readonly}"></p>
<p th:text="#{tags.range(${reminders.first()},${reminders.last()},${reminders.matched})}"></p>
<p th:if="${reminders.matched == 0}" class="alert alert-info" th:text="#{reminder.empty}"></p>
<p th:if="${reminders.options.page > reminders.pages()}" class="alert alert-warning"><span th:text="#{tags.outsidePage}"></span> <a th:href="@{/nodes/reminders(q=${reminders.options.q},status=${reminders.options.status},limit=${reminders.options.limit},_tenantView=${tenantViewToken})}" th:text="#{tags.firstPage}"></a></p>
<div th:if="${!reminders.rows.isEmpty()}" class="table-responsive"><table class="table align-middle">
<thead><tr><th th:text="#{tags.column.node}"></th><th th:text="#{reminder.message}"></th><th th:text="#{reminder.due}"></th><th th:text="#{reminder.status}"></th><th th:if="${canEditReminders}" th:text="#{todo.action}"></th></tr></thead>
<tbody><tr th:each="row : ${reminders.rows}" th:classappend="${row.status == 'overdue' ? 'table-warning' : ''}">
<td><a th:if="${row.available}" th:href="@{/nodes/{id}(id=${row.nodeId},_tenantView=${tenantViewToken})}" th:text="${row.name.isEmpty() ? #messages.msg('tags.unnamed') : row.name}"></a><span th:unless="${row.available}" th:text="${row.name}"></span> <small th:text="|[${row.contentId}]|"></small><small class="d-block text-muted" th:unless="${row.available}" th:text="#{reminder.targetUnavailable}"></small></td>
<td style="white-space:pre-wrap;overflow-wrap:anywhere;max-width:30rem" th:text="${row.message}"></td>
<td class="text-nowrap"><span th:text="${row.dueText()}"></span><small class="d-block" th:text="${#messages.msg('reminder.repeat.'+row.repeat)}"></small><small class="d-block" th:if="${!row.lastCompleted.isEmpty()}" th:text="#{reminder.lastCompleted(${row.lastCompletedText()})}"></small></td><td><span th:text="${#messages.msg('reminder.state.'+row.status)}"></span><small class="d-block" th:if="${!row.acknowledgedAt.isEmpty()}" th:text="#{reminder.alarm.dismissed}"></small><small class="d-block" th:if="${!row.snoozedUntil.isEmpty()}" th:text="#{reminder.alarm.snoozed(${row.snoozedText()})}"></small></td>
<td th:if="${canEditReminders}">
<a th:if="${row.available}" class="btn btn-sm btn-outline-primary m-1" th:href="@{/nodes/reminders/edit/{id}(id=${row.id},_tenantView=${tenantViewToken})}" th:text="#{reminder.edit}"></a>
<th:block th:if="${row.pending()}"><th:block th:replace="~{node/reminder-state :: button(${row},'done',${row.repeat == 'yearly' ? 'completeYear' : 'complete'})}"></th:block><th:block th:replace="~{node/reminder-state :: button(${row},'cancelled','cancel')}"></th:block></th:block>
<th:block th:if="${row.pending() and row.available and row.alarmMuted()}"><th:block th:replace="~{node/reminder-state :: button(${row},'pending','alarm.rearm')}"></th:block></th:block>
<th:block th:if="${!row.pending() and row.available}"><th:block th:replace="~{node/reminder-state :: button(${row},'pending','reopen')}"></th:block></th:block>
</td></tr></tbody></table></div>
<nav class="d-flex flex-wrap align-items-center gap-2" th:aria-label="#{tags.pages}">
<a th:if="${reminders.options.page > 1 and reminders.options.page <= reminders.pages()}" class="btn btn-sm btn-outline-primary" th:href="@{/nodes/reminders(q=${reminders.options.q},status=${reminders.options.status},limit=${reminders.options.limit},page=${reminders.options.page - 1},_tenantView=${tenantViewToken})}" th:text="#{tags.previous}"></a><span th:text="#{tags.page(${reminders.options.page},${reminders.pages()})}"></span><a th:if="${reminders.options.page < reminders.pages()}" class="btn btn-sm btn-outline-primary" th:href="@{/nodes/reminders(q=${reminders.options.q},status=${reminders.options.status},limit=${reminders.options.limit},page=${reminders.options.page + 1},_tenantView=${tenantViewToken})}" th:text="#{tags.next}"></a>
</nav></section></body></html>
