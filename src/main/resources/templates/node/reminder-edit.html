<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}">
<head><title th:text="#{reminder.title}"></title></head><body><section layout:fragment="content" class="container p-3">
<h1 th:text="${#messages.msg(editor.id.isEmpty() ? 'reminder.add' : 'reminder.edit')}"></h1>
<p><a data-inline-symbols th:if="${editor.available}" th:href="@{/nodes/{id}(id=${editor.nodeId},_tenantView=${tenantViewToken})}" th:text="${editor.name}"></a><span data-inline-symbols th:unless="${editor.available}" th:text="${editor.name}"></span> <span th:text="|[${editor.contentId}]|"></span></p>
<p th:if="${reminderError != null}" class="alert alert-warning" th:text="${#messages.msg('reminder.error.'+reminderError)}"></p>
<p th:unless="${editor.available}" class="alert alert-warning" th:text="#{reminder.targetUnavailable}"></p>
<p th:text="#{reminder.formHelp}"></p>
<p th:unless="${editor.id.isEmpty()}" th:text="#{reminder.editStatus(${#messages.msg('reminder.state.'+editor.status)})}"></p>
<form method="post" th:action="@{/nodes/reminders/save}" class="mb-3">
<input type="hidden" name="_tenantView" th:value="${tenantViewToken}"><input type="hidden" name="id" th:value="${editor.id}"><input type="hidden" name="nodeId" th:value="${editor.nodeId}"><input type="hidden" name="contentId" th:value="${editor.contentId}"><input type="hidden" name="occurrence" th:value="${editor.alarmId}"><input type="hidden" name="revision" th:value="${editor.revision}">
<fieldset th:disabled="${!editor.available}">
<div class="mb-3"><label for="reminderTime" th:text="#{reminder.due}"></label><input id="reminderTime" type="datetime-local" name="localTime" min="0001-01-01T00:00" max="9999-12-31T23:59" step="60" class="form-control" required th:value="${editor.localTime}"></div>
<div class="mb-3"><label for="reminderZone" th:text="#{reminder.zone}"></label><input id="reminderZone" type="text" name="zone" maxlength="100" class="form-control" required list="reminderZones" th:value="${editor.zone}"><datalist id="reminderZones"><option value="UTC"></option><option value="Europe/Istanbul"></option><option value="Europe/Berlin"></option><option value="America/New_York"></option></datalist><small th:text="#{reminder.zoneHelp}"></small></div>
<div class="mb-3"><label for="reminderRepeat" th:text="#{reminder.repeat}"></label><select id="reminderRepeat" name="repeat" class="form-select"><option value="none" th:selected="${editor.repeat == 'none'}" th:text="#{reminder.repeat.none}"></option><option value="yearly" th:selected="${editor.repeat == 'yearly'}" th:text="#{reminder.repeat.yearly}"></option></select><small th:text="#{reminder.annualHelp}"></small></div>
<div class="mb-3"><label for="reminderLeap" th:text="#{reminder.leapDay}"></label><select id="reminderLeap" name="leapDay" class="form-select"><option value="feb28" th:selected="${editor.leapDay == 'feb28'}" th:text="#{reminder.leap.feb28}"></option><option value="mar1" th:selected="${editor.leapDay == 'mar1'}" th:text="#{reminder.leap.mar1}"></option></select></div>
<p th:if="${editor.repeat == 'yearly' and !editor.anchor.isEmpty()}" th:text="#{reminder.anchor(${editor.anchor})}"></p>
<div class="mb-3"><label for="reminderMessage" th:text="#{reminder.message}"></label><textarea id="reminderMessage" name="message" maxlength="2000" rows="4" class="form-control" th:text="${editor.message}"></textarea></div>
<button type="submit" class="btn btn-primary" th:text="#{reminder.save}"></button>
</fieldset></form>
<a th:href="@{/nodes/reminders(_tenantView=${tenantViewToken})}" th:text="#{reminder.back}"></a>
</section></body></html>
