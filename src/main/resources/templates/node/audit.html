<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}"><head><title th:text="#{audit.title}"></title></head><body><section layout:fragment="content" class="container-fluid py-3">
<h1 th:text="#{audit.title}"></h1><p th:text="#{audit.help}"></p><p class="alert alert-warning" th:text="#{audit.scope}"></p><p th:unless="${auditEnabled}" class="alert alert-info" th:text="#{audit.off}"></p><p class="small" th:text="#{audit.privacy}"></p><p class="small" th:text="#{audit.sharedFilter}"></p>
<form method="get" th:action="@{/nodes/audit}" class="d-flex flex-wrap align-items-end gap-2 mb-3"><input type="hidden" name="_tenantView" th:value="${tenantViewToken}"><div><label for="auditDay" th:text="#{audit.day}"></label><input id="auditDay" name="day" type="date" class="form-control" required th:value="${auditDay}" list="auditDays"><datalist id="auditDays"><option th:each="day:${history.days}" th:value="${day}"></option></datalist></div><div><label for="auditNode" th:text="#{audit.nodeFilter}"></label><input id="auditNode" name="nodeId" type="number" min="0" class="form-control" th:value="${auditNode}"></div><button type="submit" class="btn btn-primary" th:text="#{timeline.apply}"></button></form>
<p th:if="${history.events.empty}" th:text="#{audit.empty}"></p><a th:if="${history.rootId>0}" th:href="@{/tree(nodeId=${history.rootId},_tenantView=${tenantViewToken})}" th:text="#{audit.openRoot}"></a>
<div class="table-responsive" th:unless="${history.events.empty}"><table class="table table-striped"><thead><tr><th th:text="#{audit.time}"></th><th th:text="#{audit.actor}"></th><th th:text="#{audit.operation}"></th><th th:text="#{audit.subjects}"></th><th th:text="#{audit.nodes}"></th><th></th></tr></thead><tbody><tr th:each="event:${history.events}"><td th:text="${event.time}"></td><td th:text="${event.actor}"></td><td th:text="${#messages.msg('audit.action.'+event.action)}"></td><td th:text="${event.summary}"></td><td th:text="${#strings.listJoin(event.nodes.size()>12?event.nodes.subList(0,12):event.nodes,', ')+(event.nodes.size()>12?' …':'')}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/nodes/audit/{id}(id=${event.id},_tenantView=${tenantViewToken})}" th:text="#{audit.review}"></a></td></tr></tbody></table></div>
<p th:text="#{audit.total(${history.total})}"></p><nav class="d-flex align-items-center gap-2" th:aria-label="#{audit.title}"><a th:if="${auditPage>0}" class="btn btn-outline-secondary" th:href="@{/nodes/audit(day=${auditDay},nodeId=${auditNode},page=${auditPage-1},_tenantView=${tenantViewToken})}" th:text="#{backlinks.prev}"></a><span th:text="${auditPage+1}"></span><a th:if="${(auditPage+1)*100<history.total}" class="btn btn-outline-secondary" th:href="@{/nodes/audit(day=${auditDay},nodeId=${auditNode},page=${auditPage+1},_tenantView=${tenantViewToken})}" th:text="#{backlinks.next}"></a></nav>
</section></body></html>
