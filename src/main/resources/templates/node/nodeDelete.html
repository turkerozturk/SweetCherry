<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{_layoutMobile}">
<head>
    <meta charset="UTF-8">
    <title>Node Deletion</title>
</head>
<body>
<section layout:fragment="content">

    <h1 th:text="#{node.delete.title}">Delete node</h1>
    <p th:if="${!sharedNode}" th:text="#{node.delete.warning}">This will permanently delete the selected node and its descendants.</p>
    <p th:if="${sharedNode}" th:text="#{node.delete.sharedWarning}">This shared occurrence and its own descendants will be permanently deleted.</p>
    <p th:text="#{node.delete.survivors}"></p>
    <p><strong th:text="${node.name}">Node</strong></p>
    <form th:action="@{/nodes/delete/{nodeId}(nodeId=${selectedNodeId})}" method="post">
        <input type="hidden" name="_tenantView" th:value="${tenantViewToken}"/>
        <button type="submit" class="btn btn-danger" th:text="#{node.delete.confirm}">Confirm deletion</button>
        <a th:href="@{/nodes/{nodeId}(nodeId=${selectedNodeId})}" class="btn btn-secondary" th:text="#{node.delete.cancel}">Cancel</a>
    </form>




</section>

</body>
</html>
