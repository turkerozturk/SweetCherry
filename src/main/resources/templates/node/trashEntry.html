<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}"><head><title th:text="#{trash.review}"></title></head><body><section layout:fragment="content" class="container py-3">
<h1 th:text="#{trash.review}"></h1><p><strong th:text="|${entry.name} [${entry.nodeId}]|"></strong></p><p th:text="#{trash.descendants(${entry.descendants})}"></p><dl><dt th:text="#{trash.originalParent}"></dt><dd th:text="${entry.parentPath}"></dd><dt th:text="#{trash.deletedAt}"></dt><dd th:text="${entry.deletedAt}"></dd><dt th:text="#{trash.actor}"></dt><dd th:text="${entry.actor}"></dd></dl>
<p class="alert alert-info" th:text="#{trash.liveWarning}"></p><p th:if="${entry.externalSharedLocations>0}" class="alert alert-warning" th:text="#{trash.sharedCount(${entry.externalSharedLocations})}"></p>
<h2 class="h4" th:text="#{trash.restore}"></h2><p th:unless="${entry.originalAvailable}" class="alert alert-warning" th:text="#{trash.parentMissing}"></p>
<form method="post" th:action="@{/nodes/trash/{id}/restore(id=${entry.id})}"><input type="hidden" name="_tenantView" th:value="${tenantViewToken}"><input type="hidden" name="revision" th:value="${entry.revision}"><label for="trashDestination" th:text="#{trash.destination}"></label><select id="trashDestination" name="destination" class="form-select mb-2"><option th:if="${entry.originalAvailable}" value="original" th:text="#{trash.originalDestination}"></option><option value="root" th:text="#{trash.rootDestination}"></option></select><button class="btn btn-primary" type="submit" th:text="#{trash.restore}"></button></form>
<hr><h2 class="h4 text-danger" th:text="#{trash.purge}"></h2><p th:text="#{trash.purgeWarning}"></p><p th:text="#{node.delete.survivors}"></p>
<a class="btn btn-outline-danger" th:href="@{/nodes/trash/{id}/purge(id=${entry.id},_tenantView=${tenantViewToken})}" th:text="#{trash.reviewPurge}"></a>
<a class="btn btn-outline-secondary mt-3" th:href="@{/nodes/trash(_tenantView=${tenantViewToken})}" th:text="#{trash.back}"></a>
</section></body></html>
