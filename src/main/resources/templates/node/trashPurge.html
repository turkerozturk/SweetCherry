<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}"><head><title th:text="#{trash.purge}"></title></head><body><section layout:fragment="content" class="container py-3"><h1 th:text="#{trash.purge}"></h1><p><strong th:text="|${entry.name} [${entry.nodeId}]|"></strong></p><p th:text="#{trash.descendants(${entry.descendants})}"></p><p class="alert alert-danger" th:text="#{trash.purgeWarning}"></p><p th:text="#{node.delete.survivors}"></p><p th:text="#{trash.purgeReviewHelp}"></p>
<form method="post" th:action="@{/nodes/trash/{id}/purge(id=${entry.id})}"><input type="hidden" name="_tenantView" th:value="${tenantViewToken}"><input type="hidden" name="revision" th:value="${purgeRevision}"><label class="d-block mb-2"><input type="checkbox" name="confirmed" value="true" required> <span th:text="#{trash.confirmPurge}"></span></label><button class="btn btn-danger" type="submit" th:text="#{trash.purge}"></button></form><a class="btn btn-secondary mt-3" th:href="@{/nodes/trash/{id}(id=${entry.id},_tenantView=${tenantViewToken})}" th:text="#{node.delete.cancel}"></a></section></body></html>
