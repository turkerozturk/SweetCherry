<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<div th:fragment="welcome">
<h1><img th:src="@{/img/ctbicons/{icon}.png(icon=${currentDatabaseIcon})}" width="20" height="20" alt="" class="me-1" aria-hidden="true"><span th:text="${#strings.isEmpty(currentTenantName)} ? #{home.database} : ${currentTenantName}">Database</span></h1>
<p th:text="#{tree.selectNode}">Select a node in the tree.</p>
<form th:if="${canDeleteNode == true}" sec:authorize="hasRole('ADMIN')" th:action="@{/nodes/top-level}" method="post" th:attr="data-confirm-message=#{node.confirmAdd}">
<input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
<button class="btn btn-sm btn-outline-primary" type="submit"><i class="fas fa-plus"></i> <span th:text="#{tree.addRoot}">Add node</span></button>
</form>
<div class="d-flex flex-wrap gap-2 mt-3">
<a class="btn btn-sm btn-outline-primary text-decoration-none" th:href="@{/nodes/timeline/modified(_tenantView=${tenantViewToken})}" th:text="#{timeline.recentModified}">Recently Modified</a>
<a class="btn btn-sm btn-outline-primary text-decoration-none" th:href="@{/nodes/timeline/created(_tenantView=${tenantViewToken})}" th:text="#{timeline.recentCreated}">Recently Added</a>
<a class="btn btn-sm btn-outline-primary text-decoration-none" th:href="@{/bookmarks(_tenantView=${tenantViewToken})}" th:text="#{bookmarks.heading}">Bookmarks</a>
</div>
<aside class="border rounded bg-body-tertiary p-3 mt-3 small" aria-labelledby="mobileNavigationHelp">
<h2 id="mobileNavigationHelp" class="h6" th:text="#{home.mobileHelp}">In mobile view</h2>
<ul class="mb-0">
<li th:text="#{home.mobileOptions}"></li>
<li th:text="#{home.mobileTree}"></li>
<li th:text="#{home.mobileFlat}"></li>
<li th:text="#{home.mobileArrows}"></li>
</ul>
</aside>
<p th:if="${homeActivityUnavailable == true}" class="text-muted mt-3" th:text="#{home.activity.unavailable}"></p>
<th:block th:if="${homeActivityUnavailable != true}">
<section th:if="${homeModifiedEnabled == true}" th:insert="~{node/homeActivityFragment :: activity(#{home.activity.modified}, ${homeModified})}"></section>
<section th:if="${homeCreatedEnabled == true}" th:insert="~{node/homeActivityFragment :: activity(#{home.activity.created}, ${homeCreated})}"></section>
</th:block>
</div></body></html>
