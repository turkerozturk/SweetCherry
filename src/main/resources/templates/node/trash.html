<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}"><head><title th:text="#{trash.title}"></title></head><body><section layout:fragment="content" class="container-fluid py-3">
<h1 th:text="#{trash.title}"></h1><p th:text="#{trash.help}"></p><p class="alert alert-warning" th:unless="${trashEnabled}" th:text="#{trash.offHelp}"></p><p class="alert alert-info" th:text="#{trash.liveWarning}"></p>
<p th:if="${trash.entries.empty}" th:text="#{trash.empty}"></p><a th:if="${trash.rootId>0}" th:href="@{/tree(nodeId=${trash.rootId},_tenantView=${tenantViewToken})}" th:text="#{trash.openRoot}"></a>
<div class="table-responsive" th:unless="${trash.entries.empty}"><table class="table table-striped"><thead><tr><th th:text="#{timeline.column.name}"></th><th th:text="#{trash.originalParent}"></th><th th:text="#{trash.deletedAt}"></th><th th:text="#{trash.actor}"></th><th th:text="#{trash.actions}"></th></tr></thead><tbody><tr th:each="entry:${trash.entries}"><td><a th:href="@{/tree(nodeId=${entry.nodeId},_tenantView=${tenantViewToken})}" th:text="|${entry.name} [${entry.nodeId}]|"></a><small class="d-block" th:text="#{trash.descendants(${entry.descendants})}"></small></td><td th:text="${entry.parentPath}"></td><td th:text="${entry.deletedAt}"></td><td th:text="${entry.actor}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/nodes/trash/{id}(id=${entry.id},_tenantView=${tenantViewToken})}" th:text="#{trash.review}"></a></td></tr></tbody></table></div>
<p th:text="#{trash.total(${trashTotal})}"></p><nav class="d-flex gap-2" th:aria-label="#{trash.title}"><a th:if="${trashPage>0}" class="btn btn-outline-secondary" th:href="@{/nodes/trash(page=${trashPage-1},_tenantView=${tenantViewToken})}" th:text="#{backlinks.prev}"></a><span th:text="|${trashPage+1} / ${trashPages}|"></span><a th:if="${trashPage+1<trashPages}" class="btn btn-outline-secondary" th:href="@{/nodes/trash(page=${trashPage+1},_tenantView=${tenantViewToken})}" th:text="#{backlinks.next}"></a></nav>
</section></body></html>
