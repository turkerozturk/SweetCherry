<section xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="page" class="advanced-search container-fluid py-2">
<h1 class="h4" th:text="#{search.title}"></h1>
<details class="mb-2"><summary th:text="#{saved.title}"></summary><div th:replace="~{node/savedFilters :: filters}"></div></details>
<form id="paginationForm" th:action="@{/nodesadvancedwithbinding}" th:object="${formSearch}" method="post">
<input type="hidden" name="_tenantView" th:value="${tenantViewToken}"><input type="hidden" th:field="*{pageNumber}">
<div th:if="${#fields.hasAnyErrors()}" class="alert alert-warning" role="alert"><span th:text="#{advanced.invalid}"></span><ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
<div class="search-primary border rounded p-2 mb-2">
<div class="row g-2 align-items-end">
<div class="col-12 col-lg-6"><label for="query" th:text="#{advanced.query}"></label><input type="search" th:field="*{query}" class="form-control form-control-sm" maxlength="2000" th:placeholder="#{advanced.queryHint}"></div>
<div class="col-7 col-lg-3"><label for="matchMode" th:text="#{advanced.match}"></label><select th:field="*{matchMode}" class="form-select form-select-sm"><option value="all" th:text="#{advanced.allWords}"></option><option value="any" th:text="#{advanced.anyWord}"></option><option value="phrase" th:text="#{advanced.phrase}"></option></select></div>
<div class="col-5 col-lg-3 d-flex gap-1 flex-wrap"><button type="submit" class="btn btn-sm btn-primary" data-search-submit th:text="#{advanced.search}"></button><a class="btn btn-sm btn-outline-secondary" th:href="@{/nodesadvancedwithbinding(_tenantView=${tenantViewToken})}" th:text="#{search.clear}"></a><button type="submit" th:formaction="@{/nodesadvancedwithbinding/pdf}" class="btn btn-sm btn-outline-secondary" data-export-pdf th:text="#{advanced.pdf}"></button></div>
</div><small class="text-muted" th:text="#{advanced.rawHint}"></small>
<div class="row g-2 mt-1 align-items-end">
<div class="col-12 col-md-6"><label for="tagsFilter" th:text="#{tags.label}"></label><input type="text" th:field="*{tagsFilter}" class="form-control form-control-sm" maxlength="2000" th:placeholder="#{advanced.tagsHint}"></div>
<div class="col-6 col-md-3"><label for="tagMode" th:text="#{advanced.tagMatch}"></label><select th:field="*{tagMode}" class="form-select form-select-sm"><option value="all" th:text="#{advanced.allTags}"></option><option value="any" th:text="#{advanced.anyTag}"></option><option value="contains" th:text="#{advanced.tagContains}"></option></select></div>
<div class="col-6 col-md-3"><label for="syntaxFilter" th:text="#{search.column.syntax}"></label><input th:field="*{syntaxFilter}" list="search-syntaxes" class="form-control form-control-sm" maxlength="100" th:placeholder="#{advanced.anyType}"><datalist id="search-syntaxes"><option th:each="syntax : ${searchSyntaxes}" th:value="${syntax}" th:label="${syntax == 'custom-colors' ? #messages.msg('node.type.richText') : (syntax == 'plain-text' ? #messages.msg('node.type.plainText') : syntax)}"></option></datalist></div>
</div>
<details class="mt-2" data-search-tags><summary th:text="#{tags.choose}"></summary><label for="search-tag-filter" class="visually-hidden" th:text="#{tags.filter}"></label><input id="search-tag-filter" type="search" class="form-control form-control-sm my-1" th:placeholder="#{tags.filter}"><div class="search-tag-list"><label th:each="tag : ${searchTags}" class="search-tag-choice"><input type="checkbox" data-tag-value th:value="${tag}"> <span th:text="${tag}"></span></label><span th:if="${#lists.isEmpty(searchTags)}" th:text="#{tags.noChoices}"></span></div></details>
</div>
<details class="border rounded p-2 mb-2" th:open="${!#strings.isEmpty(formSearch.nameFilter) or !#strings.isEmpty(formSearch.textFilter) or formSearch.nameStartsWith or formSearch.nodeIdStartFilter != null or formSearch.nodeIdEndFilter != null or formSearch.tsCreationStartFilter != null or formSearch.tsCreationEndFilter != null or formSearch.tsModificationStartFilter != null or formSearch.tsModificationEndFilter != null or (formSearch.nodeIcons != null and !formSearch.nodeIcons.empty)}"><summary th:text="#{advanced.more}"></summary><div class="row g-2 mt-1">
<div class="col-12 col-md-6"><label for="nameFilter" th:text="#{advanced.nameOnly}"></label><input th:field="*{nameFilter}" class="form-control form-control-sm" maxlength="2000"><label class="d-block mt-1"><input type="checkbox" id="nameStartsWith" name="nameStartsWith" value="true" th:checked="*{nameStartsWith}"> <span th:text="#{advanced.prefix}"></span></label></div>
<div class="col-12 col-md-6"><label for="textFilter" th:text="#{advanced.contentOnly}"></label><input th:field="*{textFilter}" class="form-control form-control-sm" maxlength="2000"></div>
<fieldset class="col-12 col-md-4"><legend class="fs-6 mb-1" th:text="#{advanced.idRange}"></legend><div class="row g-1"><div class="col-6"><label for="nodeIdStartFilter" th:text="#{advanced.from}"></label><input type="number" th:field="*{nodeIdStartFilter}" class="form-control form-control-sm" min="1" max="9223372036854775807"></div><div class="col-6"><label for="nodeIdEndFilter" th:text="#{advanced.to}"></label><input type="number" th:field="*{nodeIdEndFilter}" class="form-control form-control-sm" min="1" max="9223372036854775807"></div></div></fieldset>
<fieldset class="col-12 col-md-4"><legend class="fs-6 mb-1" th:text="#{advanced.created}"></legend><div class="row g-1"><div class="col-6"><label for="tsCreationStartFilter" th:text="#{advanced.from}"></label><input type="date" th:field="*{tsCreationStartFilter}" class="form-control form-control-sm"></div><div class="col-6"><label for="tsCreationEndFilter" th:text="#{advanced.to}"></label><input type="date" th:field="*{tsCreationEndFilter}" class="form-control form-control-sm"></div></div></fieldset>
<fieldset class="col-12 col-md-4"><legend class="fs-6 mb-1" th:text="#{advanced.modified}"></legend><div class="row g-1"><div class="col-6"><label for="tsModificationStartFilter" th:text="#{advanced.from}"></label><input type="date" th:field="*{tsModificationStartFilter}" class="form-control form-control-sm"></div><div class="col-6"><label for="tsModificationEndFilter" th:text="#{advanced.to}"></label><input type="date" th:field="*{tsModificationEndFilter}" class="form-control form-control-sm"></div></div></fieldset>
<div class="col-12" data-icon-picker><label for="search-icon-filter" th:text="#{search.icon.choose}"></label><input id="search-icon-filter" data-icon-search type="search" class="form-control form-control-sm my-1" th:placeholder="#{icon.search}"><div data-icon-selected class="small d-flex flex-wrap gap-1 mb-1"></div><details data-icon-details><summary th:text="#{search.icon.choose}"></summary><div class="search-icon-list">
<label th:each="icon : *{allIcons}" class="icon-choice"><input type="checkbox" name="nodeIcons" th:value="${icon.name()}" th:checked="${formSearch.nodeIcons != null and formSearch.nodeIcons.contains(icon)}"><img th:attr="data-icon-src=@{/img/ctbicons/{icon}.png(icon=${icon.iconName})}" width="18" height="18" alt=""><span data-icon-label th:text="${icon == T(com.turkerozturk.helpers.NodeIcon).OTHER ? #messages.msg('icon.none') : icon.iconNameForHuman}"></span></label></div></details></div>
</div></details>
<div class="d-flex gap-2 flex-wrap align-items-end mb-2">
<div><label for="sortBy" th:text="#{advanced.sort}"></label><select th:field="*{sortBy}" class="form-select form-select-sm"><option value="modified" th:text="#{advanced.modified}"></option><option value="created" th:text="#{advanced.created}"></option><option value="parent" th:text="#{tags.column.parent}"></option><option value="name" th:text="#{search.column.name}"></option><option value="id">ID</option><option value="tags" th:text="#{tags.label}"></option><option value="syntax" th:text="#{search.column.syntax}"></option></select></div>
<div><label for="sortDirection" class="visually-hidden" th:text="#{advanced.direction}"></label><select th:field="*{sortDirection}" class="form-select form-select-sm"><option value="desc" th:text="#{advanced.desc}"></option><option value="asc" th:text="#{advanced.asc}"></option></select></div>
<div><label for="pageSize" th:text="#{advanced.perPage}"></label><input type="number" th:field="*{pageSize}" class="form-control form-control-sm search-page-size" min="1" max="100000" list="search-page-sizes"><datalist id="search-page-sizes"><option th:each="size : *{PAGE_SIZE_OPTIONS}" th:value="${size}"></option></datalist></div>
<button type="submit" class="btn btn-sm btn-outline-primary" data-search-submit th:text="#{advanced.search}"></button>
</div>
</form>
<div th:fragment="pagination" class="d-flex gap-2 flex-wrap align-items-center my-2"><span><b th:text="${nodes.totalElements}"></b> <span th:text="#{advanced.results}"></span></span><span th:text="|${nodes.number + 1} / ${nodes.totalPages == 0 ? 1 : nodes.totalPages}|"></span><button type="button" class="btn btn-sm btn-outline-secondary" th:disabled="${!nodes.hasPrevious()}" th:attr="data-search-page=${nodes.number - 1}" th:text="#{backlinks.prev}"></button><button type="button" class="btn btn-sm btn-outline-secondary" th:disabled="${!nodes.hasNext()}" th:attr="data-search-page=${nodes.number + 1}" th:text="#{backlinks.next}"></button></div>
<th:block th:if="${batchWritable == true}" sec:authorize="hasRole('ADMIN')"><div th:replace="~{node/batchNodes :: controls}"></div></th:block>
<div class="table-responsive"><table class="table table-sm table-striped search-results"><thead><tr>
<th class="batch-select-cell" hidden th:if="${batchWritable == true}" sec:authorize="hasRole('ADMIN')"><input type="checkbox" data-batch-all th:aria-label="#{batch.selectPage}"></th>
<th scope="col" class="search-parent" th:attr="aria-sort=${formSearch.sortBy == 'parent' ? (formSearch.sortDirection == 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-search-sort="parent" class="search-sort" th:text="#{tags.column.parent}"></button></th>
<th scope="col" th:attr="aria-sort=${formSearch.sortBy == 'name' ? (formSearch.sortDirection == 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-search-sort="name" class="search-sort"><span th:text="#{search.column.name}"></span> <span th:if="${formSearch.sortBy == 'name'}" th:text="${formSearch.sortDirection == 'asc' ? '↑' : '↓'}"></span></button></th>
<th scope="col" th:attr="aria-sort=${formSearch.sortBy == 'id' ? (formSearch.sortDirection == 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-search-sort="id" class="search-sort"><span th:text="#{search.column.nodeId}"></span> <span th:if="${formSearch.sortBy == 'id'}" th:text="${formSearch.sortDirection == 'asc' ? '↑' : '↓'}"></span></button></th>
<th scope="col" class="search-date" th:attr="aria-sort=${formSearch.sortBy == 'created' ? (formSearch.sortDirection == 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-search-sort="created" class="search-sort"><span th:text="#{advanced.created}"></span> <span th:if="${formSearch.sortBy == 'created'}" th:text="${formSearch.sortDirection == 'asc' ? '↑' : '↓'}"></span></button></th>
<th scope="col" class="search-date" th:attr="aria-sort=${formSearch.sortBy == 'modified' ? (formSearch.sortDirection == 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-search-sort="modified" class="search-sort"><span th:text="#{advanced.modified}"></span> <span th:if="${formSearch.sortBy == 'modified'}" th:text="${formSearch.sortDirection == 'asc' ? '↑' : '↓'}"></span></button></th>
<th scope="col" th:attr="aria-sort=${formSearch.sortBy == 'tags' ? (formSearch.sortDirection == 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-search-sort="tags" class="search-sort"><span th:text="#{tags.label}"></span> <span th:if="${formSearch.sortBy == 'tags'}" th:text="${formSearch.sortDirection == 'asc' ? '↑' : '↓'}"></span></button></th>
<th scope="col" th:attr="aria-sort=${formSearch.sortBy == 'syntax' ? (formSearch.sortDirection == 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" data-search-sort="syntax" class="search-sort"><span th:text="#{search.column.syntax}"></span> <span th:if="${formSearch.sortBy == 'syntax'}" th:text="${formSearch.sortDirection == 'asc' ? '↑' : '↓'}"></span></button></th>
</tr></thead><tbody><tr th:each="node : ${nodes}">
<td class="batch-select-cell" hidden th:if="${batchWritable == true}" sec:authorize="hasRole('ADMIN')"><input type="checkbox" data-batch-id th:value="${node.nodeId}" th:aria-label="|${#messages.msg('batch.select')} ${node.name} [${node.nodeId}]|"></td>
<td class="search-parent"><a th:if="${node.listParentId>0 and node.listParentName!=null}" th:href="@{/nodes/{id}(id=${node.listParentId},_tenantView=${tenantViewToken})}" target="_blank" rel="noopener" th:text="${node.listParentName}"></a><span th:unless="${node.listParentId>0 and node.listParentName!=null}" th:text="${node.listParentId==0 ? #messages.msg('tags.root') : #messages.msg('tags.missingParent')}"></span></td>
<td class="search-node-name"><a th:href="@{/nodes/{id}(id=${node.nodeId},_tenantView=${tenantViewToken})}" th:style="|color:${node.titleColorAsHtmlHex};font-weight:${node.boldnessBit ? 'bold' : 'normal'}|"><img th:src="@{/img/ctbicons/{icon}.png(icon=${node.nodeIcon.iconName})}" width="20" height="20" alt="" loading="lazy"> <span th:text="${node.name}"></span></a><small class="search-breadcrumbs"><th:block th:each="crumb, stat : ${node.breadcrumbs}"><span th:unless="${stat.first}"> / </span><span th:text="|${crumb.value} [${crumb.key}]|"></span></th:block></small></td>
<td class="text-nowrap"><a th:href="@{/nodes/{id}(id=${node.nodeId},_tenantView=${tenantViewToken})}" th:text="${node.nodeId}"></a></td>
<td class="search-date" th:text="${#dates.format(new java.util.Date(node.creationTimestamp * 1000),'yyyy-MM-dd')}" th:title="${#dates.format(new java.util.Date(node.creationTimestamp * 1000),'yyyy-MM-dd HH:mm:ss')}"></td>
<td class="search-date" th:text="${#dates.format(new java.util.Date(node.lastSaveTimestamp * 1000),'yyyy-MM-dd')}" th:title="${#dates.format(new java.util.Date(node.lastSaveTimestamp * 1000),'yyyy-MM-dd HH:mm:ss')}"></td>
<td class="search-tags" th:text="${node.tags}"></td><td th:text="${node.syntax == 'custom-colors' ? #messages.msg('node.type.richText') : (node.syntax == 'plain-text' ? #messages.msg('node.type.plainText') : node.syntax)}"></td>
</tr></tbody></table></div><div th:replace="~{node/advancedSearch :: pagination}"></div><p th:if="${nodes.empty}" th:text="#{search.noNodesFound}"></p>
</section>
