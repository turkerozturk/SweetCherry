<div xmlns:th="http://www.thymeleaf.org" th:fragment="controls" data-batch-nodes class="mb-2"
 th:attr="data-preview=@{/nodes/batch/preview},data-apply=@{/nodes/batch/apply},data-limit=#{batch.limit},data-loading=#{tree.loading},data-changed=#{batch.changed},data-denied=#{batch.denied},data-failed=#{batch.failed},data-cycle=#{node.moveTo.cycle},data-invalid=#{batch.invalid},data-saved=#{batch.saved},data-count=#{batch.count},data-move-summary=#{batch.summary},data-tag-summary=#{batch.tagSummary},data-move-title=#{batch.move},data-tag-title=#{batch.tag},data-clipboard-error=#{node.moveTo.clipboardError}">
<button type="button" class="btn btn-sm btn-outline-primary" data-batch-toggle aria-expanded="false" th:text="#{batch.toggle}"></button>
<div data-batch-actions hidden class="mt-2"><p class="small" th:text="#{batch.help}"></p><span data-batch-count role="status" class="me-2"></span><button type="button" data-batch-operation="move" class="btn btn-sm btn-outline-primary" disabled th:text="#{batch.move}"></button> <button type="button" data-batch-operation="tag" class="btn btn-sm btn-outline-primary" disabled th:text="#{batch.tag}"></button></div>
<p data-batch-status role="status" aria-live="polite" class="small"></p>
<dialog class="batch-nodes-dialog" id="batchNodesDialog" aria-labelledby="batchNodesTitle"><form method="post" th:action="@{/nodes/batch/apply}" id="batchNodesForm">
<input type="hidden" name="_tenantView" th:value="${tenantViewToken}"><h2 class="h5" id="batchNodesTitle"></h2><p data-batch-summary></p><ul data-batch-list class="batch-nodes-list small"></ul>
<div data-batch-move-fields hidden><label for="batchParent" th:text="#{node.moveTo.parent}"></label><div class="input-group"><input class="form-control" id="batchParent" name="parentId" type="text" inputmode="numeric" pattern="[0-9]{1,19}" maxlength="19" autocomplete="off"><button class="btn btn-outline-secondary" type="button" data-batch-paste th:aria-label="#{node.moveTo.paste}"><i class="fas fa-paste" aria-hidden="true"></i></button></div><label for="batchBookmark" class="mt-2" th:text="#{node.moveTo.bookmarks}"></label><select id="batchBookmark" class="form-select"><option value="" th:text="#{batch.bookmark}"></option></select><p class="small mt-2" th:text="#{batch.moveHelp}"></p></div>
<div data-batch-tag-fields hidden><label for="batchTag" th:text="#{batch.tagLabel}"></label><input id="batchTag" name="tag" class="form-control" type="text" maxlength="200" list="batchTagChoices" autocomplete="off"><datalist id="batchTagChoices"><option th:each="tag:${searchTags}" th:value="${tag}"></option></datalist><p class="small mt-2" th:text="#{batch.tagHelp}"></p></div>
<p data-batch-message role="status" aria-live="polite"></p><div class="d-flex justify-content-end gap-2"><button type="button" data-batch-cancel class="btn btn-secondary" th:text="#{richtext.edit.cancel}"></button><button type="submit" data-batch-save class="btn btn-primary" disabled th:text="#{richtext.edit.save}"></button></div>
</form></dialog></div>
