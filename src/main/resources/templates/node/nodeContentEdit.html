<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{_layoutMobile}">
<head><title>Düğüm içeriğini düzenle</title></head>
<body>
<section layout:fragment="content" class="container py-3">
    <div th:replace="~{common/backupWarningFragment :: backupWarning}"></div>
    <h1>Düğüm içeriğini düzenle</h1>
    <p><strong th:text="${node.name}">Düğüm adı</strong>
        <span class="text-muted" th:text="|(${node.syntax})|">(plain-text)</span></p>
    <p class="text-muted">Bu alan düz metindir. Satır sonları ve kod metni olduğu gibi kaydedilir.</p>
    <form id="plainEditForm" th:attr="data-leave-message=#{editor.unsaved}" th:action="@{/nodes/content/{nodeId}(nodeId=${node.nodeId})}" method="post">
        <input type="hidden" name="_tenantView" th:value="${tenantViewToken}"/>
        <div class="mb-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary" th:text="#{richtext.edit.save}">Kaydet</button>
            <a class="btn btn-secondary" th:href="@{/nodes/{nodeId}(nodeId=${node.nodeId},_tenantView=${tenantViewToken})}" th:text="#{richtext.edit.cancel}">İptal</a>
        </div>
        <label for="nodeText" class="form-label">İçerik</label>
        <div class="d-flex gap-2 mb-2" role="group" th:aria-label="#{editor.tools}">
        <button type="button" id="plainUndo" class="btn btn-outline-secondary" th:title="#{richtext.edit.undo}" th:aria-label="#{richtext.edit.undo}"><i class="fas fa-undo" aria-hidden="true"></i></button>
        <button type="button" id="plainRedo" class="btn btn-outline-secondary" th:title="#{richtext.edit.redo}" th:aria-label="#{richtext.edit.redo}"><i class="fas fa-redo" aria-hidden="true"></i></button>
        <button type="button" id="plainSeparator" class="btn btn-outline-secondary mb-2" th:title="#{editor.separator.help}">33~</button>
        </div>
        <textarea id="nodeText" name="text" class="form-control font-monospace" rows="20"
                  spellcheck="false" th:text="${node.txt}"></textarea>

    </form>
<script th:src="@{/js/common/editorLeaveGuard.js}"></script>
<script th:src="@{/js/node/plainTextEditor.js}"></script>
</section>
</body>
</html>
