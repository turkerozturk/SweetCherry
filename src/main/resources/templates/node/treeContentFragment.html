<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<section th:fragment="treeContent" class="workspace-node" th:attr="data-node-id=${requestedNodeId},data-node-title=${node != null ? node.name : currentTenantName}">
    <th:block th:if="${isRootNode == true}">
        <div class="workspace-root-content" tabindex="0"><th:block th:replace="~{node/rootWelcomeFragment :: welcome}"></th:block></div>
    </th:block>
    <th:block th:if="${node != null}">
        <header class="workspace-node-header">
        <nav class="workspace-breadcrumbs" th:attr="aria-label=#{tree.path}">
            <a th:href="@{/tree(nodeId=0)}"><span th:text="${currentTenantName}"></span></a>
            <th:block th:each="entry : ${node.breadcrumbs}">
                <span aria-hidden="true"> / </span><a th:href="@{/nodes/{id}(id=${entry.key})}" th:text="${entry.value}" data-inline-symbols></a>
            </th:block>
        </nav>
        <p th:if="${isSharedNode == true}" class="alert alert-info py-1 my-1">
            <span th:text="#{node.sharedReference}"></span> <span th:text="${requestedNodeId}"></span>
            → <a th:href="@{/nodes/{id}(id=${masterNodeId})}" th:text="${masterNodeId}"></a>
        </p>
        <th:block th:replace="~{node/nodeToolbarFragment :: controls('tree')}"></th:block>
        <div class="workspace-title-row" data-node-title-editor
             th:attr="data-title-id=${requestedNodeId},data-title-endpoint=@{/nodes/properties/{id}/title(id=${requestedNodeId})},data-title-loading=#{title.loading},data-title-saving=#{title.saving},data-title-changed=#{title.changed},data-title-error=#{title.error},data-title-readonly=#{title.readonly}">
        <h1 class="workspace-node-title" data-title-heading th:attr="data-path-ids=${#strings.arrayJoin(node.breadcrumbs.keySet().toArray(), ',')}"><img th:if="${node.nodeIcon != null and node.nodeIcon.iconName != 'zero'}" th:src="@{/img/ctbicons/{name}.png(name=${node.nodeIcon.iconName})}" width="26" height="26" alt=""><th:block th:replace="~{node/nodeStatusIcons :: headerStates(${node},${nodeBookmarked})}"></th:block><span data-title-text th:text="${node.name}" data-inline-symbols></span></h1>
        <th:block th:if="${canDeleteNode == true and isSharedNode != true}" sec:authorize="hasRole('ADMIN')" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        <button type="button" class="btn btn-sm btn-outline-primary node-title-pencil" data-title-open th:title="#{title.edit}" th:aria-label="#{title.edit}"><i class="fas fa-pen" aria-hidden="true"></i></button>
        <form hidden data-title-form class="node-title-form" method="post" th:action="@{/nodes/properties/{id}/title(id=${requestedNodeId})}">
        <input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
        <label class="visually-hidden" th:for="|node-title-${requestedNodeId}|" th:text="#{title.name}"></label>
        <input class="form-control" name="name" th:id="|node-title-${requestedNodeId}|" maxlength="255" required data-title-value autocomplete="off">
        <input type="hidden" data-title-icon-value name="icon" value="">
        <button type="button" class="btn btn-sm btn-outline-secondary node-title-icon-button" data-title-icon-open th:title="#{title.chooseIcon}" th:aria-label="#{title.chooseIcon}" disabled><img data-title-icon-preview width="22" height="22" alt="" hidden><i data-title-icon-fallback class="fas fa-icons" aria-hidden="true"></i></button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-symbol-picker-open th:attr="data-symbol-target=|node-title-${requestedNodeId}|" th:title="#{title.symbols}" th:aria-label="#{title.symbols}"><span aria-hidden="true">☺</span></button>
        <button type="submit" class="btn btn-sm btn-primary" data-title-save th:title="#{title.save}" th:aria-label="#{title.save}"><i class="fas fa-save" aria-hidden="true"></i> <span th:text="#{title.save}"></span></button>
        <button type="button" class="btn btn-sm btn-outline-secondary" data-title-cancel th:title="#{title.cancel}" th:aria-label="#{title.cancel}"><i class="fas fa-times" aria-hidden="true"></i> <span th:text="#{title.cancel}"></span></button>
        <span data-title-status role="status" class="small text-danger"></span>
        </form>
        </th:block>
        <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasScrolling" th:title="#{node.meta.header}" th:aria-label="#{tree.info}"><i class="fas fa-info-circle" aria-hidden="true"></i></button>
        <a th:if="${webBookmarkUrl != null}" class="node-web-bookmark-open btn btn-sm btn-outline-secondary" style="margin-left:auto;flex:none" th:href="${webBookmarkUrl}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" th:title="#{webBookmark.open}" th:aria-label="#{webBookmark.open}"><img th:src="@{/img/ctbicons/ct_link_website.png}" width="24" height="24" alt=""></a>
        </div>
        </header>
        <div class="node-related-shell"><div class="node-related-layout"><div th:replace="~{node/backlinks :: panel}"></div><div class="workspace-rendered" tabindex="0" th:attr="aria-label=#{tree.content}"><th:block th:if="${dttSnapshot != null}"><th:block th:replace="~{node/dttBridge :: panel}"></th:block></th:block>
            <th:block th:unless="${dttSnapshot != null}">
                <p th:if="${dttError != null}" class="alert alert-warning" th:text="${#messages.msg(dttError)}"></p>
                <th:block th:replace="~{node/nodeContentFragment :: nodeContentFragment}"></th:block>
            </th:block></div></div></div>
        <th:block th:replace="~{node/offcanvasFragment :: offcanvasFragment}"></th:block>
    </th:block>
    <template data-workspace-status th:fragment="workspaceStatus">
        <th:block th:if="${node != null}">
            <span><b th:text="#{tree.type}"></b>: <span th:text="${node.syntax == 'custom-colors' ? #messages.msg('node.type.richText') : (node.syntax == 'plain-text' ? #messages.msg('node.type.plainText') : node.syntax)}"></span></span>
            <span><b th:text="#{tree.created}"></b>: <span th:text="${#dates.format(new java.util.Date(node.creationTimestamp * 1000), 'yyyy-MM-dd HH:mm')}"></span></span>
            <span><b th:text="#{tree.modified}"></b>: <span th:text="${#dates.format(new java.util.Date(node.lastSaveTimestamp * 1000), 'yyyy-MM-dd HH:mm')}"></span></span>
            <span><b th:text="#{tree.children}"></b>: <span th:text="${childNodes != null ? #lists.size(childNodes) : 0}"></span></span>
            <span><b th:text="#{node.nodeId}"></b>: <span th:text="${node.nodeId}"></span></span>
            <span th:if="${isSharedNode == true}"><b th:text="#{node.sharedId}"></b>: <span th:text="${requestedNodeId}"></span></span>
            <span class="workspace-status-tags" th:if="${node.tags != null and !#strings.isEmpty(#strings.trim(node.tags))}" th:title="${node.tags}"><b th:text="#{node.meta.tags}"></b>: <span th:text="${node.tags}"></span></span>
        </th:block>
        <span th:if="${node == null}"><img th:src="@{/img/ctbicons/{icon}.png(icon=${currentDatabaseIcon})}" width="20" height="20" alt="" class="me-1" aria-hidden="true"><span th:text="${currentTenantName}"></span></span>
    </template>
</section>
</body>
</html>
