<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<section th:fragment="treeContent" class="workspace-node" th:attr="data-node-id=${requestedNodeId},data-node-title=${node != null ? node.name : currentTenantName}">
    <th:block th:if="${isRootNode == true}">
        <th:block th:replace="~{node/rootWelcomeFragment :: welcome}"></th:block>
    </th:block>
    <th:block th:if="${node != null}">
        <header class="workspace-node-header">
        <nav class="workspace-breadcrumbs" th:attr="aria-label=#{tree.path}">
            <a th:href="@{/tree(nodeId=0)}"><span th:text="${currentTenantName}"></span></a>
            <th:block th:each="entry : ${node.breadcrumbs}">
                <span aria-hidden="true"> / </span><a th:href="@{/nodes/{id}(id=${entry.key})}" th:text="${entry.value}"></a>
            </th:block>
        </nav>
        <p th:if="${isSharedNode == true}" class="alert alert-info py-1 my-1">
            <span th:text="#{node.sharedReference}"></span> <span th:text="${requestedNodeId}"></span>
            → <a th:href="@{/nodes/{id}(id=${masterNodeId})}" th:text="${masterNodeId}"></a>
        </p>
        <th:block th:replace="~{node/nodeToolbarFragment :: controls('tree')}"></th:block>
        <h1 class="workspace-node-title" th:attr="data-path-ids=${#strings.arrayJoin(node.breadcrumbs.keySet().toArray(), ',')}"><img th:if="${node.nodeIcon != null and node.nodeIcon.iconName != 'zero'}" th:src="@{/img/ctbicons/{name}.png(name=${node.nodeIcon.iconName})}" width="26" height="26" alt=""><span th:text="${node.name}"></span></h1>
        </header>
        <div class="workspace-rendered" tabindex="0" th:attr="aria-label=#{tree.content}"><th:block th:replace="~{node/nodeContentFragment :: nodeContentFragment}"></th:block></div>
        <th:block th:replace="~{node/offcanvasFragment :: offcanvasFragment}"></th:block>
    </th:block>
    <template data-workspace-status>
        <th:block th:if="${node != null}">
            <span><b th:text="#{tree.type}"></b>: <span th:text="${node.syntax == 'custom-colors' ? #messages.msg('node.type.richText') : (node.syntax == 'plain-text' ? #messages.msg('node.type.plainText') : node.syntax)}"></span></span>
            <span><b th:text="#{tree.created}"></b>: <span th:text="${#dates.format(new java.util.Date(node.creationTimestamp * 1000), 'yyyy-MM-dd HH:mm')}"></span></span>
            <span><b th:text="#{tree.modified}"></b>: <span th:text="${#dates.format(new java.util.Date(node.lastSaveTimestamp * 1000), 'yyyy-MM-dd HH:mm')}"></span></span>
            <span><b th:text="#{tree.children}"></b>: <span th:text="${childNodes != null ? #lists.size(childNodes) : 0}"></span></span>
            <span><b th:text="#{node.nodeId}"></b>: <span th:text="${node.nodeId}"></span></span>
            <span th:if="${isSharedNode == true}"><b th:text="#{node.sharedId}"></b>: <span th:text="${requestedNodeId}"></span></span>
        </th:block>
        <span th:if="${node == null}"><img th:src="@{/img/ctbicons/{icon}.png(icon=${currentDatabaseIcon})}" width="20" height="20" alt="" class="me-1" aria-hidden="true"><span th:text="${currentTenantName}"></span></span>
    </template>
</section>
</body>
</html>
