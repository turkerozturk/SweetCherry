<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="widget" th:if="${currentTenantName != null and tenantViewToken != null}">
<link rel="stylesheet" th:href="@{/css/reminders/alarms.css}">
<details id="reminderAlarms" class="reminder-alarms" th:attr="data-endpoint=@{/nodes/reminders/alarms},data-nodes=@{/nodes/},data-token=${tenantViewToken},data-scope=${currentTenantName},data-start=#{reminder.alarm.start},data-stop=#{reminder.alarm.stop},data-sound-on=#{reminder.alarm.soundOn},data-sound-off=#{reminder.alarm.soundOff},data-sound-blocked=#{reminder.alarm.soundBlocked},data-open=#{reminder.alarm.open},data-snooze=#{reminder.alarm.snooze},data-dismiss=#{reminder.alarm.dismiss},data-disabled=#{reminder.alarm.disabled},data-stale=#{reminder.alarm.stale},data-error=#{reminder.alarm.error},data-readonly=#{todo.readonly},data-more=#{reminder.alarm.more},data-due=#{reminder.alarm.due},data-quiet=#{reminder.alarm.quiet}">
<summary th:text="#{reminder.alarm.title}"></summary><div class="reminder-alarm-controls"><button type="button" class="btn btn-sm btn-outline-primary" data-alarm-enable th:text="#{reminder.alarm.start}"></button><button type="button" class="btn btn-sm btn-outline-secondary" data-alarm-sound disabled th:text="#{reminder.alarm.soundOn}"></button></div>
<p th:text="#{reminder.alarm.help}"></p><p data-alarm-status role="status" aria-live="polite"></p><div class="reminder-alarm-cards" data-alarm-cards></div>
<a th:href="@{/nodes/reminders(_tenantView=${tenantViewToken})}" th:text="#{reminder.title}"></a><form hidden method="post" th:action="@{/nodes/reminders/alarms/0}"></form>
</details><script defer th:src="@{/js/reminders/alarmState.js}"></script><script defer th:src="@{/js/reminders/alarms.js}"></script>
</th:block></body></html>
