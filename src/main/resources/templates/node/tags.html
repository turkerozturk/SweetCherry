<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}">
<head><title th:text="#{tags.viewTitle}"></title><section layout:fragment="pageSpecificCssStyles"><link rel="stylesheet" th:href="@{/css/node/tags.css}"></section></head>
<body><section layout:fragment="content" class="container-fluid tags-page p-3">
<h1 th:text="#{tags.viewTitle}"></h1>
<p th:if="${canEditTags}"><a class="btn btn-sm btn-outline-primary" th:href="@{/nodes/tags/manage(_tenantView=${tenantViewToken})}" th:text="#{tags.manage.open}"></a></p>
<p th:if="${tagManagementResult != null}" class="alert alert-success" role="status" th:text="${#messages.msg(tagManagementResult.operation.action.name() == 'RENAME' ? 'tags.manage.renamed' : 'tags.manage.removed',tagManagementResult.operation.from,tagManagementResult.operation.to,tagManagementResult.count)}"></p><p th:text="#{tags.viewHelp}"></p>
<p th:text="#{tags.statistics(${tagView.catalogue.size()},${tagView.taggedContents},${tagView.taggedPlaces})}"></p>
<form th:action="@{/nodes/tags}" method="get" class="mb-3"><input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
<details open><summary th:text="#{tags.choose}"></summary>
<div data-tag-browser><label for="tagViewFilter" th:text="#{tags.filter}"></label><input id="tagViewFilter" class="form-control form-control-sm" type="search" data-tag-filter autocomplete="off">
<div class="tag-choice-list" data-tag-list><label th:each="tag : ${tagChoices}" class="tag-choice"><input type="checkbox" name="tag" th:value="${tag}" th:checked="${tagView.options.tags.contains(tag)}"><span data-tag-label th:text="${tag}"></span></label></div>
<div class="tag-summary" data-tag-summary aria-live="polite"></div></div></details>
<div class="d-flex flex-wrap align-items-end gap-2 mt-2"><div><label for="tagViewMode" th:text="#{tags.match}"></label><select id="tagViewMode" class="form-select form-select-sm" name="mode"><option value="any" th:selected="${tagView.options.mode == 'any'}" th:text="#{tags.any}"></option><option value="all" th:selected="${tagView.options.mode == 'all'}" th:text="#{tags.all}"></option></select></div>
<div><label for="tagViewLimit" th:text="#{tags.perPage}"></label><input id="tagViewLimit" class="form-control form-control-sm" type="number" style="width:7rem" min="1" max="1000" name="limit" th:value="${tagView.options.limit}" required></div>
<div><label for="tagSort" th:text="#{tags.sortBy}"></label><select id="tagSort" class="form-select form-select-sm" name="sort"><option th:each="key:${ {'parent','node','tags','created','modified'} }" th:value="${key}" th:selected="${tagView.options.sort==key}" th:text="${#messages.msg('tags.column.'+key)}"></option></select></div>
<div><label for="tagDirection" th:text="#{tags.direction}"></label><select id="tagDirection" class="form-select form-select-sm" name="direction"><option value="asc" th:selected="${tagView.options.direction=='asc'}" th:text="#{tags.ascending}"></option><option value="desc" th:selected="${tagView.options.direction=='desc'}" th:text="#{tags.descending}"></option></select></div>
<button type="submit" class="btn btn-sm btn-primary" th:text="#{tags.show}"></button><a class="btn btn-sm btn-outline-secondary" th:href="@{/nodes/tags(_tenantView=${tenantViewToken})}" th:text="#{tags.reset}"></a></div></form>
<p th:if="${invalidOptions == true}" class="alert alert-warning" th:text="#{tags.invalidOptions}"></p>
<p th:text="#{tags.range(${tagView.first()},${tagView.last()},${tagView.matched})}"></p>
<p th:if="${tagView.matched == 0}" class="alert alert-info" th:text="#{tags.noNodes}"></p>
<p th:if="${tagView.options.page > tagView.pages()}" class="alert alert-warning"><span th:text="#{tags.outsidePage}"></span> <a th:href="@{/nodes/tags(tag=${tagView.options.tags},mode=${tagView.options.mode},sort=${tagView.options.sort},direction=${tagView.options.direction},limit=${tagView.options.limit},_tenantView=${tenantViewToken})}" th:text="#{tags.firstPage}"></a></p>
<div th:if="${!tagView.rows.isEmpty()}" class="table-responsive"><table class="table table-sm tags-table"><thead><tr><th class="tags-wide" th:attr="aria-sort=${tagView.options.sort=='parent' ? (tagView.options.direction=='asc' ? 'ascending' : 'descending') : 'none'}"><a th:href="@{/nodes/tags(tag=${tagView.options.tags},mode=${tagView.options.mode},limit=${tagView.options.limit},sort='parent',direction=${tagView.options.sort=='parent' and tagView.options.direction=='asc' ? 'desc' : 'asc'},_tenantView=${tenantViewToken})}"><span th:text="#{tags.column.parent}"></span><span th:if="${tagView.options.sort=='parent'}" aria-hidden="true" th:text="${tagView.options.direction=='asc' ? ' ↑' : ' ↓'}"></span></a></th><th th:attr="aria-sort=${tagView.options.sort=='node' ? (tagView.options.direction=='asc' ? 'ascending' : 'descending') : 'none'}"><a th:href="@{/nodes/tags(tag=${tagView.options.tags},mode=${tagView.options.mode},limit=${tagView.options.limit},sort='node',direction=${tagView.options.sort=='node' and tagView.options.direction=='asc' ? 'desc' : 'asc'},_tenantView=${tenantViewToken})}"><span th:text="#{tags.column.node}"></span><span th:if="${tagView.options.sort=='node'}" aria-hidden="true" th:text="${tagView.options.direction=='asc' ? ' ↑' : ' ↓'}"></span></a></th><th th:attr="aria-sort=${tagView.options.sort=='tags' ? (tagView.options.direction=='asc' ? 'ascending' : 'descending') : 'none'}"><a th:href="@{/nodes/tags(tag=${tagView.options.tags},mode=${tagView.options.mode},limit=${tagView.options.limit},sort='tags',direction=${tagView.options.sort=='tags' and tagView.options.direction=='asc' ? 'desc' : 'asc'},_tenantView=${tenantViewToken})}"><span th:text="#{tags.column.tags}"></span><span th:if="${tagView.options.sort=='tags'}" aria-hidden="true" th:text="${tagView.options.direction=='asc' ? ' ↑' : ' ↓'}"></span></a></th><th th:if="${canEditTags}" th:text="#{tags.properties}"></th><th class="tags-wide" th:attr="aria-sort=${tagView.options.sort=='created' ? (tagView.options.direction=='asc' ? 'ascending' : 'descending') : 'none'}"><a th:href="@{/nodes/tags(tag=${tagView.options.tags},mode=${tagView.options.mode},limit=${tagView.options.limit},sort='created',direction=${tagView.options.sort=='created' and tagView.options.direction=='asc' ? 'desc' : 'asc'},_tenantView=${tenantViewToken})}"><span th:text="#{tags.column.created}"></span><span th:if="${tagView.options.sort=='created'}" aria-hidden="true" th:text="${tagView.options.direction=='asc' ? ' ↑' : ' ↓'}"></span></a></th><th class="tags-wide" th:attr="aria-sort=${tagView.options.sort=='modified' ? (tagView.options.direction=='asc' ? 'ascending' : 'descending') : 'none'}"><a th:href="@{/nodes/tags(tag=${tagView.options.tags},mode=${tagView.options.mode},limit=${tagView.options.limit},sort='modified',direction=${tagView.options.sort=='modified' and tagView.options.direction=='asc' ? 'desc' : 'asc'},_tenantView=${tenantViewToken})}"><span th:text="#{tags.column.modified}"></span><span th:if="${tagView.options.sort=='modified'}" aria-hidden="true" th:text="${tagView.options.direction=='asc' ? ' ↑' : ' ↓'}"></span></a></th></tr></thead>
<tbody><tr th:each="row : ${tagView.rows}"><td class="tags-wide"><a th:if="${row.parentAvailable}" target="_blank" rel="noopener" th:href="@{/nodes/{id}(id=${row.parentId},_tenantView=${tenantViewToken})}" th:title="${row.breadcrumb}" th:text="${row.parentName.isEmpty() ? #messages.msg('tags.unnamed') : row.parentName}"></a><span th:unless="${row.parentAvailable}" th:text="${row.parentId==0 ? #messages.msg('tags.root') : #messages.msg('tags.unknownParent')}"></span></td><td class="tags-node"><a th:href="@{/nodes/{id}(id=${row.id},_tenantView=${tenantViewToken})}" th:title="${row.breadcrumb}"><img th:src="@{/img/ctbicons/{name}.png(name=${row.icon})}" width="20" height="20" alt="" loading="lazy"> <span th:style="|font-weight:${row.bold ? 'bold' : 'normal'};color:${row.color}|" th:text="${row.name.isEmpty() ? #messages.msg('tags.unnamed') : row.name}"></span> <span class="text-nowrap" th:text="|[${row.id}]|"></span></a> <small th:if="${row.shared}" class="badge text-bg-secondary" th:text="#{tags.shared}"></small></td>
<td><span th:each="tag : ${row.tags}" class="badge tag-badge" th:text="${tag}"></span></td>
<td th:if="${canEditTags}"><button type="button" th:if="${row.propertiesAvailable}" class="btn btn-sm btn-outline-primary" th:attr="data-quick-tags=${row.id},data-quick-tags-reload='true',data-quick-tags-token=${tenantViewToken}" th:text="#{tags.quick.button}"></button> <a target="_blank" rel="noopener" th:if="${row.propertiesAvailable}" class="btn btn-sm btn-outline-secondary" th:href="@{/nodes/properties/{id}(id=${row.contentId},_tenantView=${tenantViewToken})}" th:title="${row.shared ? #messages.msg('tags.editMasterHelp',row.contentId) : #messages.msg('tags.properties')}" th:text="${row.shared ? #messages.msg('tags.masterProperties') : #messages.msg('tags.properties')}"></a></td>
<td class="tags-wide text-nowrap"><time th:text="${row.createdText()}"></time></td><td class="tags-wide text-nowrap"><time th:text="${row.modifiedText()}"></time></td></tr></tbody></table></div>
<nav class="d-flex flex-wrap align-items-center gap-2" th:aria-label="#{tags.pages}">
<a th:if="${tagView.options.page > 1 && tagView.options.page <= tagView.pages()}" class="btn btn-sm btn-outline-primary" th:href="@{/nodes/tags(tag=${tagView.options.tags},mode=${tagView.options.mode},sort=${tagView.options.sort},direction=${tagView.options.direction},limit=${tagView.options.limit},page=${tagView.options.page - 1},_tenantView=${tenantViewToken})}" th:text="#{tags.previous}"></a><span th:text="#{tags.page(${tagView.options.page},${tagView.pages()})}"></span><a th:if="${tagView.options.page < tagView.pages()}" class="btn btn-sm btn-outline-primary" th:href="@{/nodes/tags(tag=${tagView.options.tags},mode=${tagView.options.mode},sort=${tagView.options.sort},direction=${tagView.options.direction},limit=${tagView.options.limit},page=${tagView.options.page + 1},_tenantView=${tenantViewToken})}" th:text="#{tags.next}"></a>
</nav></section><section layout:fragment="pageSpecificJsScripts"><script defer th:src="@{/js/node/tags.js}"></script></section></body></html>
