<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{security.error.notFound.title} + ' · SweetCherry'">Page not found · SweetCherry</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 1.25rem; background: #f5f6f8; color: #24292f;
               font-family: system-ui, sans-serif; line-height: 1.6; }
        main { max-width: 36rem; margin: 8vh auto; padding: clamp(1.5rem, 5vw, 3rem);
               background: white; border: 1px solid #d8dee4; border-radius: 1rem; }
        .brand { font-weight: 600; }
        .status { margin: 1rem 0 0; font-size: 4rem; font-weight: 700; line-height: 1.1; color: #57606a; }
        h1 { font-size: 1.5rem; }
        .home { display: inline-block; margin: .75rem 0; padding: .65rem 1rem;
                background: #245c49; color: white; border-radius: .5rem; text-decoration: none; }
        .home:focus-visible { outline: 3px solid #0969da; outline-offset: 3px; }
        .reference { font-size: .8rem; color: #57606a; }
        code { overflow-wrap: anywhere; }
    </style>
</head>
<body>
<main>
    <div class="brand">SweetCherry</div>
    <p class="status">404</p>
    <h1 th:text="#{security.error.notFound.title}">Page not found</h1>
    <p th:text="#{security.error.notFound.message}">This address does not match an available page. Check the address or return to the home page.</p>
    <a class="home" th:href="@{/}" th:text="#{security.error.home}">Go to home page</a>
    <p class="reference"><span th:text="#{security.error.reference}">Error reference</span>: <code th:text="${errorId}"></code></p>
</main>
</body>
</html>
