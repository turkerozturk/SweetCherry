<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${rootNodeName} + ' - Markmap Quick Mind Map'">
        Markmap Quick Mind Map
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css}">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            min-height: 0;
        }

        .mind-map-page {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            min-height: 0;
            overflow: hidden;
        }

        .mind-map-toolbar {
            flex: 0 0 auto;
        }

        .mind-map-controls .form-control,
        .mind-map-controls .form-select,
        .mind-map-controls .btn {
            min-height: 31px;
        }

        .mind-map-level {
            width: 4.75rem;
        }

        .mind-map-toggle {
            width: 6.5rem;
        }

        .mind-map-panel {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .mind-map-panel .card-body {
            position: absolute;
            inset: 0;
            padding: 0;
            overflow: hidden;
        }

        #markmap {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        .markmap-node-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .markmap-node-title.is-bold {
            font-weight: 700;
        }

        .markmap-node-link,
        .markmap-node-link:link,
        .markmap-node-link:visited,
        .markmap-node-link:hover,
        .markmap-node-link:active {
            color: inherit;
            text-decoration: none;
        }

        .markmap-node-icon {
            display: inline-block;
            flex: 0 0 16px;
            width: 16px;
            height: 16px;
            object-fit: contain;
            vertical-align: middle;
        }
    </style>
</head>

<body class="bg-light">

<main class="container-fluid py-3 mind-map-page">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3 mind-map-toolbar">
        <h1 class="h5 mb-0" th:text="${rootNodeName}">Mind map</h1>

        <span class="badge text-bg-secondary"
              th:text="'Node ' + ${rootNodeId}">Node</span>

        <span th:if="${foldChat}"
              class="badge text-bg-light border">
            chat dalları başlangıçta kapalı
        </span>

        <form class="d-flex flex-wrap align-items-center gap-1 ms-md-auto mind-map-controls"
              method="get"
              th:action="@{/markmap-quick-mind-map/{nodeId}(nodeId=${rootNodeId})}">

            <input type="hidden"
                   name="foldChat"
                   th:value="${foldChat}">

            <label for="level" class="small mb-0 ms-1">Seviye</label>
            <input id="level"
                   class="form-control form-control-sm mind-map-level"
                   type="number"
                   name="level"
                   min="0"
                   step="1"
                   th:value="${maximumLevel}">

            <label for="icons" class="small mb-0 ms-1">İkon</label>
            <select id="icons"
                    class="form-select form-select-sm mind-map-toggle"
                    name="icons">
                <option value="true" th:selected="${icons}">Göster</option>
                <option value="false" th:selected="${!icons}">Gizle</option>
            </select>

            <label for="colors" class="small mb-0 ms-1">Renk</label>
            <select id="colors"
                    class="form-select form-select-sm mind-map-toggle"
                    name="colors">
                <option value="true" th:selected="${colors}">Göster</option>
                <option value="false" th:selected="${!colors}">Gizle</option>
            </select>

            <button type="submit" class="btn btn-sm btn-primary">
                Uygula
            </button>
        </form>
    </div>

    <div class="card shadow-sm mind-map-panel">
        <div class="card-body">
            <svg id="markmap"
                 role="img"
                 th:attr="aria-label=${rootNodeName} + ' düşünce haritası'">
            </svg>
        </div>
    </div>
</main>


<!-- Markmap View, tarayıcı sürümünde global d3 nesnesini kullanır. -->
<script th:src="@{/js/thirdparty/markmap/d3.min.js}"></script>
<script th:src="@{/js/thirdparty/markmap/markmap-view.min.js}"></script>

<script th:inline="javascript">
    (() => {
        'use strict';

        const dataJson = /*[[${markmapDataJson}]]*/ '{}';
        const rootNodeId = /*[[${rootNodeId}]]*/ 0;
        const rootParentNodeId = /*[[${rootParentNodeId}]]*/ rootNodeId;
        const maximumLevel = /*[[${maximumLevel}]]*/ 3;
        const colorsEnabled = /*[[${colors}]]*/ true;
        const iconsEnabled = /*[[${icons}]]*/ true;
        const foldChatEnabled = /*[[${foldChat}]]*/ true;
        const mapBaseUrl = /*[[@{/markmap-quick-mind-map/}]]*/ '/markmap-quick-mind-map/';
        const iconBaseUrl = /*[[@{/img/ctbicons/}]]*/ '/img/ctbicons/';
        const data = JSON.parse(dataJson);

        prepareLabels(data);

        const options = {
            autoFit: true,
            duration: 300,
            fitRatio: 0.92,
            maxInitialScale: 1.5,
            maxWidth: 320,
            paddingX: 14,
            spacingHorizontal: 100,
            spacingVertical: 8
        };

        if (colorsEnabled) {
            const fallbackColor = d3.scaleOrdinal(d3.schemeTableau10);

            options.color = node =>
                node.data?.payload?.color
                || fallbackColor(String(node.depth));
        }

        const {Markmap} = window.markmap;
        const markmap = Markmap.create('#markmap', options, data);

        // Fontların ve Bootstrap'in yerleşmesi tamamlandıktan sonra haritayı
        // görünür alana yeniden oturtur.
        window.addEventListener('load', () => {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    markmap.fit();
                });
            });
        });

        function prepareLabels(node) {
            const iconName = node.payload?.iconName;
            const isBold = node.payload?.bold === true;
            const color = normalizeColor(node.payload?.color);

            // Markmap düğüm içeriğini HTML olarak işler. Veritabanından gelen
            // başlık önce metne çevrilerek script/HTML çalıştırması engellenir.
            const safeTitle = escapeHtml(node.content || '');
            const titleClasses = isBold
                ? 'markmap-node-link markmap-node-title is-bold'
                : 'markmap-node-link markmap-node-title';
            const colorStyle = colorsEnabled && color
                ? ' style="color:' + color + '"'
                : ' style="color:inherit"';
            const currentNodeId = Number(node.payload?.nodeId);
            const navigationNodeId = currentNodeId === Number(rootNodeId)
                ? rootParentNodeId
                : currentNodeId;
            const nodeUrl = createNodeUrl(navigationNodeId);

            let iconHtml = '';

            if (iconsEnabled && iconName) {
                const safeIconName = String(iconName);
                const iconUrl = iconBaseUrl
                    + encodeURIComponent(safeIconName)
                    + '.png';

                iconHtml =
                    '<img class="markmap-node-icon" src="'
                    + escapeHtmlAttribute(iconUrl)
                    + '" alt="" aria-hidden="true"'
                    + ' data-icon-name="'
                    + escapeHtmlAttribute(safeIconName)
                    + '">';
            }

            node.content =
                '<span class="markmap-node-label">'
                + iconHtml
                + '<a class="'
                + titleClasses
                + '" href="'
                + escapeHtmlAttribute(nodeUrl)
                + '"'
                + colorStyle
                + '>'
                + safeTitle
                + '</a></span>';

            (node.children || []).forEach(prepareLabels);
        }

        function createNodeUrl(nodeId) {
            const safeNodeId = Number(nodeId);

            if (!Number.isSafeInteger(safeNodeId) || safeNodeId <= 0) {
                return '#';
            }

            const url = new URL(
                mapBaseUrl + encodeURIComponent(String(safeNodeId)),
                window.location.origin
            );

            url.searchParams.set('level', String(maximumLevel));
            url.searchParams.set('icons', String(iconsEnabled));
            url.searchParams.set('colors', String(colorsEnabled));
            url.searchParams.set('foldChat', String(foldChatEnabled));

            return url.pathname + url.search;
        }

        function normalizeColor(value) {
            const normalized = String(value || '').trim().toUpperCase();
            return /^#[0-9A-F]{6}$/.test(normalized)
                ? normalized
                : null;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function escapeHtmlAttribute(value) {
            return escapeHtml(value);
        }
    })();
</script>

</body>
</html>
