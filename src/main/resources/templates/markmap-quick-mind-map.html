<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="#{quickmap.markmapTitle(${rootNodeName})}">
        Markmap Quick Mind Map
    </title>

    <link rel="stylesheet" type="text/css" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/webjars/font-awesome/css/all.min.css}">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            min-height: 0;
        }

        .mind-map-page {
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            min-height: 0;
            overflow: hidden;
        }

        .markmap-page-only { padding: 0 !important; }
        .markmap-page-only .mind-map-toolbar { display: none !important; }
        .markmap-page-only .mind-map-panel { border: 0; border-radius: 0; }
        #markmapCanvasToggle {
            position: absolute; top: 8px; right: 48px; z-index: 2;
            width: 32px; height: 32px; padding: 5px;
            background: rgba(255,255,255,.92); color: #343a40;
            border: 1px solid #adb5bd; border-radius: 4px;
        }
        #quickMapClose { position:absolute; top:8px; right:8px; z-index:2; width:32px; height:32px; padding:0; font-size:24px; line-height:1; background:rgba(255,255,255,.92); }
        #markmapCanvasToggle:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }
        .mind-map-toolbar {
            flex: 0 0 auto;
        }

        .mind-map-controls .form-control,
        .mind-map-controls .form-select,
        .mind-map-controls .btn {
            min-height: 31px;
        }

        .mind-map-layout { width: 10rem; }

        .mind-map-level {
            width: 4.75rem;
        }

        .mind-map-toggle {
            width: 6.5rem;
        }

        .mind-map-panel {
            position: relative;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .mind-map-panel .card-body {
            position: absolute;
            inset: 0;
            padding: 0;
            overflow: hidden;
        }

        #markmap {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }

        .markmap-node-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* Reserve the button's width so hover never moves the tree or its labels. */
        .markmap-add-child {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 22px;
            width: 22px;
            height: 22px;
            padding: 0;
            border: 1px solid #6c757d;
            border-radius: 4px;
            background: #fff;
            color: #212529;
            font: 18px/1 sans-serif;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
        }
        .markmap-node-label:hover .markmap-add-child,
        .markmap-node-label:focus-within .markmap-add-child {
            opacity: 1;
            pointer-events: auto;
        }
        .markmap-add-child:focus-visible { outline: 2px solid #0d6efd; outline-offset: 2px; }
        @media (hover: none) {
            .markmap-add-child { opacity: 1; pointer-events: auto; }
        }
        #markmap-child-dialog {
            width: min(28rem, calc(100vw - 2rem));
            max-height: calc(100vh - 2rem);
            border: 1px solid #adb5bd;
            border-radius: .5rem;
            padding: 1.25rem;
        }
        #markmap-child-dialog::backdrop { background: rgb(0 0 0 / 35%); }
        #markmap-child-parent { overflow-wrap: anywhere; }

        .markmap-node-title.is-bold {
            font-weight: 700;
        }

        .markmap-node-link,
        .markmap-node-link:link,
        .markmap-node-link:visited,
        .markmap-node-link:hover,
        .markmap-node-link:active {
            color: inherit;
            text-decoration: none;
        }

        .markmap-node-icon {
            display: inline-block;
            flex: 0 0 16px;
            width: 16px;
            height: 16px;
            object-fit: contain;
            vertical-align: middle;
        }

        .markmap-node-icon.is-placeholder {
            opacity: .3;
        }

        .markmap-content-link,
        .markmap-content-link:link,
        .markmap-content-link:visited,
        .markmap-content-link:hover,
        .markmap-content-link:active {
            display: inline-flex;
            flex: 0 0 16px;
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>

<body class="bg-light">

<main class="container-fluid py-3 mind-map-page">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3 mind-map-toolbar">
        <h1 class="h5 mb-0" th:text="${rootNodeName}">Mind map</h1>

        <span class="badge text-bg-secondary"
              th:text="${rootNodeId == 0 ? #messages.msg('quickmap.allRoots') : #messages.msg('quickmap.node', rootNodeId)}">Node</span>

        <a class="btn btn-sm btn-outline-primary" th:if="${rootNodeId != 0}"
           th:href="@{/markmap-quick-mind-map/all(level=${maximumLevel},icons=${icons},colors=${colors},foldChat=${foldChat})}" th:text="#{quickmap.allNodes}">All nodes</a>

        <span th:if="${foldChat}"
              class="badge text-bg-light border" th:text="#{quickmap.foldChat}">
            Chat branches initially folded
        </span>

        <form class="d-flex flex-wrap align-items-center gap-1 ms-md-auto mind-map-controls"
              method="get"
              th:action="@{/markmap-quick-mind-map/{nodeId}(nodeId=${rootNodeId == 0 ? 'all' : rootNodeId})}">

            <input type="hidden"
                   name="foldChat"
                   th:value="${foldChat}">

            <label for="level" class="small mb-0 ms-1" th:text="#{quickmap.level}">Seviye</label>
            <input id="level"
                   class="form-control form-control-sm mind-map-level"
                   type="number"
                   name="level"
                   min="0"
                   step="1"
                   th:value="${maximumLevel}">

            <label for="icons" class="small mb-0 ms-1" th:text="#{quickmap.icons}">İkon</label>
            <select id="icons"
                    class="form-select form-select-sm mind-map-toggle"
                    name="icons">
                <option value="true" th:selected="${icons}" th:text="#{quickmap.show}">Göster</option>
                <option value="false" th:selected="${!icons}" th:text="#{quickmap.hide}">Gizle</option>
            </select>

            <label for="colors" class="small mb-0 ms-1" th:text="#{quickmap.colors}">Renk</label>
            <select id="colors"
                    class="form-select form-select-sm mind-map-toggle"
                    name="colors">
                <option value="true" th:selected="${colors}" th:text="#{quickmap.show}">Göster</option>
                <option value="false" th:selected="${!colors}" th:text="#{quickmap.hide}">Gizle</option>
            </select>

            <label for="layout" class="small mb-0 ms-1" th:text="#{quickmap.layout}">Layout</label>
            <select id="layout" name="layout" class="form-select form-select-sm mind-map-layout">
                <option value="right" th:text="#{quickmap.layoutRight}">Rightward</option>
                <option value="balanced" th:text="#{quickmap.layoutBalanced}">Balanced, both sides</option>
            </select>
            <button type="submit" class="btn btn-sm btn-primary" th:text="#{quickmap.apply}">
                Uygula
            </button>
        </form>
    </div>

    <div class="card shadow-sm mind-map-panel">
        <div class="card-body">
            <button type="button" id="quickMapClose" class="btn btn-sm btn-outline-secondary" data-close-page
                    th:attr="data-close-fallback=@{/}" th:title="#{quick.close}" th:aria-label="#{quick.close}"><span aria-hidden="true">×</span></button>
            <button type="button" id="markmapCanvasToggle" aria-pressed="false"
                    th:title="#{quickmap.expandPage}" th:aria-label="#{quickmap.expandPage}"
                    th:attr="data-expand=#{quickmap.expandPage},data-restore=#{quickmap.restorePage}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>
                </svg>
            </button>
            <svg id="markmap"
                 role="group"
                 th:attr="aria-label=#{quickmap.canvasLabel(${rootNodeName})}">
            </svg>
        </div>
    </div>
</main>


<div th:if="${markmapCanAdd}" data-markmap-children
     th:attr="data-stale=#{quick.stale},data-denied=#{quick.denied},data-invalid=#{quick.invalid},data-uncertain=#{quick.uncertain},data-saving=#{markmap.child.saving},data-reload=#{markmap.child.reload}">
    <dialog id="markmap-child-dialog" aria-labelledby="markmap-child-heading">
        <h2 id="markmap-child-heading" class="h5" th:text="#{markmap.child.add}">Add child node</h2>
        <p id="markmap-child-parent" class="small text-body-secondary"></p>
        <form data-markmap-child-form method="post" th:action="@{/nodes/quick/create}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
            <input type="hidden" name="parentId">
            <input type="hidden" name="text" value="">
            <input type="hidden" name="syntax" value="plain-text">
            <label for="markmap-child-title" th:text="#{quick.title}">Title</label>
            <input id="markmap-child-title" name="title" type="text" class="form-control"
                   maxlength="255" required autocomplete="off" autofocus>
            <p data-markmap-child-status class="small mt-2" role="status" aria-live="polite"></p>
            <div class="d-flex justify-content-end gap-2 mt-3">
                <button type="button" data-markmap-child-cancel class="btn btn-outline-secondary" th:text="#{markmap.child.cancel}">Cancel</button>
                <button type="submit" class="btn btn-primary" th:text="#{markmap.child.ok}">OK</button>
            </div>
        </form>
    </dialog>
</div>
<script th:if="${markmapCanAdd}" th:src="@{/js/markmap/quickChild.js}"></script>

<script th:src="@{/js/markmap/canvasView.js}"></script>

<!-- Markmap View, tarayıcı sürümünde global d3 nesnesini kullanır. -->
<script th:src="@{/js/thirdparty/markmap/d3.min.js}"></script>
<script th:src="@{/js/thirdparty/markmap/markmap-view.min.js}"></script>
<script th:src="@{/js/markmap/bilateral.js}"></script>

<script th:inline="javascript">
    (async () => {
        'use strict';

        const dataJson = /*[[${markmapDataJson}]]*/ '{}';
        const rootNodeId = /*[[${rootNodeId}]]*/ 0;
        const rootParentNodeId = /*[[${rootParentNodeId}]]*/ rootNodeId;
        const maximumLevel = /*[[${maximumLevel}]]*/ 3;
        const colorsEnabled = /*[[${colors}]]*/ true;
        const iconsEnabled = /*[[${icons}]]*/ true;
        const foldChatEnabled = /*[[${foldChat}]]*/ true;
        const mapBaseUrl = /*[[@{/markmap-quick-mind-map/}]]*/ '/markmap-quick-mind-map/';
        const contentBaseUrl = /*[[@{/quick-node-content/}]]*/ '/quick-node-content/';
        const iconBaseUrl = /*[[@{/img/ctbicons/}]]*/ '/img/ctbicons/';
        const zeroIconUrl = /*[[@{/img/icons/zero.svg}]]*/ '/img/icons/zero.svg';
        const openContentLabel = /*[[#{quickmap.openContent}]]*/ 'Open node content in a new tab';
        const contentIconLabel = /*[[#{quickmap.contentIcon}]]*/ 'Open content';
        const viewScaleStorageKey = 'sweetCherry.markmap.viewScale';
        const defaultViewScale = 1;
        const layout = new URLSearchParams(window.location.search).get('layout') === 'balanced' ? 'balanced' : 'right';
        document.getElementById('layout').value = layout;
        document.querySelectorAll('.mind-map-toolbar a[href]').forEach(link => {
            const url = new URL(link.href);
            url.searchParams.set('layout', layout);
            link.href = url.pathname + url.search;
        });
        const data = JSON.parse(dataJson);
        const canAddChildren = /*[[${markmapCanAdd}]]*/ false;
        const addChildLabel = /*[[#{markmap.child.add}]]*/ 'Add child node';
        const revealParentId = new URLSearchParams(window.location.search).get('childOf');

        prepareLabels(data);

        const options = {
            autoFit: false,
            duration: 300,
            fitRatio: 0.92,
            maxInitialScale: 1.5,
            maxWidth: 320,
            paddingX: 14,
            spacingHorizontal: 100,
            spacingVertical: 8
        };

        if (colorsEnabled) {
            const fallbackColor = d3.scaleOrdinal(d3.schemeTableau10);

            options.color = node =>
                node.data?.payload?.color
                || fallbackColor(String(node.depth));
        }

        const {Markmap} = window.markmap;
        const MapClass = layout === 'balanced' ? window.SweetCherryMarkmapLayout.createClass(Markmap) : Markmap;
        const markmap = new MapClass('#markmap', options);
        await markmap.setData(data);

        // Bütün ağacı ekrana sığdırmak yerine kökü okunabilir ölçekte solda
        // açar. Aynı sekmedeki sonraki haritalarda son zoom seviyesi korunur.
        const initializeView = () => {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    placeRootAtReadableScale(readSavedScale());
                    rememberScaleAfterInteraction();
                });
            });
        };
        if (document.readyState === 'complete') initializeView();
        else window.addEventListener('load', initializeView, {once: true});

        function placeRootAtReadableScale(scale) {
            const svgElement = markmap.svg.node();
            const viewport = svgElement.getBoundingClientRect();
            const rootRect = markmap.state.data?.state?.rect;

            if (!rootRect || viewport.width <= 0 || viewport.height <= 0) {
                return;
            }

            const safeScale = clampScale(scale);
            const leftPadding = 28;
            const rootCenterY = rootRect.y + rootRect.height / 2;
            const transform = d3.zoomIdentity
                .translate(
                    layout === 'balanced'
                        ? viewport.width / 2 - (rootRect.x + rootRect.width / 2) * safeScale
                        : leftPadding - rootRect.x * safeScale,
                    viewport.height / 2 - rootCenterY * safeScale
                )
                .scale(safeScale);

            markmap.svg.call(markmap.zoom.transform, transform);
        }

        function rememberScaleAfterInteraction() {
            const svgElement = markmap.svg.node();
            let saveTimer;

            const scheduleSave = () => {
                window.clearTimeout(saveTimer);
                saveTimer = window.setTimeout(() => {
                    saveCurrentScale(svgElement);
                }, 120);
            };

            svgElement.addEventListener('wheel', scheduleSave, {passive: true});
            svgElement.addEventListener('pointerup', scheduleSave);
            svgElement.addEventListener('touchend', scheduleSave, {passive: true});
            window.addEventListener(
                'pagehide',
                () => saveCurrentScale(svgElement)
            );
        }

        function saveCurrentScale(svgElement) {
            try {
                const transform = d3.zoomTransform(svgElement);
                sessionStorage.setItem(
                    viewScaleStorageKey,
                    String(clampScale(transform.k))
                );
            } catch (error) {
                // Depolama kapalıysa harita varsayılan ölçekle çalışmaya devam eder.
            }
        }

        function readSavedScale() {
            try {
                return clampScale(
                    Number(sessionStorage.getItem(viewScaleStorageKey))
                );
            } catch (error) {
                return defaultViewScale;
            }
        }

        function clampScale(value) {
            return Number.isFinite(value) && value > 0
                ? Math.min(4, Math.max(.25, value))
                : defaultViewScale;
        }

        function prepareLabels(node, depth = 0) {
            if (node.payload?.parentId === revealParentId) node.payload.fold = 0;
            const iconName = node.payload?.iconName;
            const isBold = node.payload?.bold === true;
            const color = normalizeColor(node.payload?.color);

            // Markmap düğüm içeriğini HTML olarak işler. Veritabanından gelen
            // başlık önce metne çevrilerek script/HTML çalıştırması engellenir.
            const safeTitle = escapeHtml(node.content || '');
            const titleClasses = isBold
                ? 'markmap-node-link markmap-node-title is-bold'
                : 'markmap-node-link markmap-node-title';
            const colorStyle = colorsEnabled && color
                ? ' style="color:' + color + '"'
                : ' style="color:inherit"';
            const currentNodeId = Number(node.payload?.nodeId);
            const navigationNodeId = currentNodeId === Number(rootNodeId)
                ? rootParentNodeId
                : currentNodeId;
            const nodeUrl = createNodeUrl(navigationNodeId);

            let iconHtml = '';
            const hasVisibleNodeIcon = iconsEnabled && iconName;

            if (currentNodeId > 0) {
                const safeIconName = iconName
                    ? String(iconName)
                    : 'zero';
                const iconUrl = hasVisibleNodeIcon
                    ? iconBaseUrl
                        + encodeURIComponent(safeIconName)
                        + '.png'
                    : zeroIconUrl;
                const iconClasses = hasVisibleNodeIcon
                    ? 'markmap-node-icon'
                    : 'markmap-node-icon is-placeholder';
                const contentUrl = createContentUrl(node.payload?.nodeId);

                iconHtml =
                    '<a class="markmap-content-link" href="'
                    + escapeHtmlAttribute(contentUrl)
                    + '" target="_blank" rel="noopener"'
                    + ' title="' + escapeHtmlAttribute(openContentLabel) + '">'
                    + '<img class="'
                    + iconClasses
                    + '" src="'
                    + escapeHtmlAttribute(iconUrl)
                    + '" alt="' + escapeHtmlAttribute(contentIconLabel) + '"'
                    + ' data-icon-name="'
                    + escapeHtmlAttribute(safeIconName)
                    + '"></a>';
            }

            if(currentNodeId === 0 && hasVisibleNodeIcon) {
                iconHtml='<img class="markmap-node-icon" src="'+escapeHtmlAttribute(iconBaseUrl+encodeURIComponent(String(iconName))+'.png')+'" alt="">';
            }
            const parentId = String(node.payload?.parentId || '');
            const addChildHtml = canAddChildren && /^[1-9][0-9]{0,18}$/.test(parentId)
                ? '<button type="button" class="markmap-add-child" data-parent-id="'
                    + parentId + '" data-reveal-level="' + (depth + 1)
                    + '" aria-label="' + escapeHtmlAttribute(addChildLabel)
                    + '" title="' + escapeHtmlAttribute(addChildLabel) + '">+</button>'
                : '';
            node.content =
                '<span class="markmap-node-label">'
                + iconHtml
                + '<a class="'
                + titleClasses
                + '" href="'
                + escapeHtmlAttribute(nodeUrl)
                + '"'
                + colorStyle
                + '>'
                + safeTitle
                + '</a>' + addChildHtml + '</span>';

            (node.children || []).forEach(child => prepareLabels(child, depth + 1));
        }

        function createNodeUrl(nodeId) {
            const safeNodeId = Number(nodeId);

            if (!Number.isSafeInteger(safeNodeId) || safeNodeId < 0) {
                return '#';
            }

            const url = new URL(
                mapBaseUrl + (safeNodeId === 0 ? 'all' : encodeURIComponent(String(safeNodeId))),
                window.location.origin
            );

            url.searchParams.set('layout', layout);
            url.searchParams.set('level', String(maximumLevel));
            url.searchParams.set('icons', String(iconsEnabled));
            url.searchParams.set('colors', String(colorsEnabled));
            url.searchParams.set('foldChat', String(foldChatEnabled));

            return url.pathname + url.search;
        }

        function createContentUrl(nodeId) {
            const safeNodeId = Number(nodeId);

            if (!Number.isSafeInteger(safeNodeId) || safeNodeId <= 0) {
                return '#';
            }

            return contentBaseUrl
                + encodeURIComponent(String(safeNodeId));
        }

        function normalizeColor(value) {
            const normalized = String(value || '').trim().toUpperCase();
            return /^#[0-9A-F]{6}$/.test(normalized)
                ? normalized
                : null;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function escapeHtmlAttribute(value) {
            return escapeHtml(value);
        }
    })();
</script>

<th:block th:replace="~{common/sessionViewGuard :: sessionViewGuard}"></th:block>

<script th:src="@{/js/common/closePage.js}" defer></script>
</body>
</html>
