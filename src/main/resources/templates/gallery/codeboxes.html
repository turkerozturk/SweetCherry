<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}">
<head><title th:text="#{codes.title}"></title><section layout:fragment="pageSpecificCssStyles"><link rel="stylesheet" th:href="@{/css/codeGallery.css}"></section></head>
<body><main layout:fragment="content" class="container-fluid py-3" id="code-gallery" th:style="|--cg-font:${codeSettings.fontSize}px|"
 th:attr="data-error=#{codes.error},data-stale=#{gallery.stale},data-loading=#{gallery.loading},data-position=#{gallery.position},data-limited=#{codes.limited},data-copied=#{codes.copied},data-copy-error=#{codes.copyError},data-highlighting=${syntaxHighlightingEnabled == true}">
 <div class="d-flex flex-wrap align-items-center gap-3 mb-2"><h1 class="h3 mb-0" th:text="#{codes.title}"></h1><span th:text="#{codes.count(${gallery.total})}"></span><label class="ms-auto"><input type="checkbox" id="code-details" checked> <span th:text="#{codes.details}"></span></label></div>
 <p class="small text-body-secondary" th:text="#{codes.help}"></p>
 <form method="get" th:action="@{/codebox-gallery}" class="d-flex flex-wrap align-items-end gap-2 mb-3"><input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
 <div class="flex-grow-1"><label class="form-label" for="code-search" th:text="#{tables.search}"></label><input type="search" id="code-search" name="q" class="form-control" maxlength="200" th:value="${gallery.options.search}"></div>
 <div><label class="form-label" for="code-syntax" th:text="#{codes.syntax}"></label><input type="text" id="code-syntax" name="syntax" list="code-syntaxes" class="form-control" maxlength="100" th:value="${gallery.options.syntax}"><datalist id="code-syntaxes"><option th:each="syntax:${gallery.syntaxes}" th:value="${syntax}"></option></datalist></div>
 <div><label class="form-label" for="code-sort" th:text="#{gallery.sort}"></label><select name="sort" id="code-sort" class="form-select"><option th:each="sort:${ {'newest','oldest','node','syntax','id'} }" th:value="${sort}" th:selected="${sort==gallery.options.sort}" th:text="${#messages.msg('codes.sort.'+sort)}"></option></select></div><button class="btn btn-primary" th:text="#{gallery.apply}"></button></form>
 <p th:if="${gallery.items.empty}" class="alert alert-info" th:text="#{codes.empty}"></p>
 <div class="code-gallery-grid"><article class="code-card border rounded p-2" th:each="item:${gallery.items}">
 <div class="d-flex justify-content-between gap-2 mb-1"><span class="small text-body-secondary" th:text="${item.syntax}"></span><span class="small text-body-secondary" th:text="#{codes.characters(${item.characters})}"></span></div>
 <pre class="code-preview"><code th:class="${syntaxHighlightingEnabled == true and item.language != null ? 'cherry-highlight' : ''}" th:attr="data-language=${syntaxHighlightingEnabled == true ? item.language : null}" th:text="${item.preview}"></code></pre>
 <p class="small text-body-secondary mb-1" th:if="${item.limited}" th:text="#{codes.previewLimited}"></p>
 <div class="d-flex align-items-start flex-wrap gap-2 my-2"><button class="btn btn-primary btn-sm" type="button" data-code-open th:attr="data-url=@{/codebox-gallery/{node}/{offset}/data(node=${item.nodeId},offset=${item.offset},_tenantView=${tenantViewToken})}" th:text="#{codes.open}"></button><a class="code-node fw-semibold" th:href="@{/tree(nodeId=${item.nodeId},_tenantView=${tenantViewToken})}" th:text="${item.name}"></a></div>
 <div class="cg-info small"><dl><dt th:text="#{codes.id}"></dt><dd th:text="${item.identity}"></dd><dt th:text="#{gallery.created}"></dt><dd th:text="${item.createdText}"></dd></dl><a th:href="@{/codebox-gallery/{node}/{offset}/source(node=${item.nodeId},offset=${item.offset},_tenantView=${tenantViewToken})}" th:text="#{codes.download}"></a></div>
 </article></div>
 <nav class="d-flex align-items-center justify-content-center gap-3 my-3" th:aria-label="#{gallery.pages}"><a th:if="${gallery.options.page>1}" class="btn btn-outline-secondary" th:href="@{/codebox-gallery(page=${gallery.options.page - 1},q=${gallery.options.search},syntax=${gallery.options.syntax},sort=${gallery.options.sort},_tenantView=${tenantViewToken})}" th:text="#{gallery.previousPage}"></a><span th:text="#{gallery.page(${gallery.options.page},${gallery.pages})}"></span><a th:if="${gallery.options.page<gallery.pages}" class="btn btn-outline-secondary" th:href="@{/codebox-gallery(page=${gallery.options.page + 1},q=${gallery.options.search},syntax=${gallery.options.syntax},sort=${gallery.options.sort},_tenantView=${tenantViewToken})}" th:text="#{gallery.nextPage}"></a></nav>
 <dialog id="code-viewer" th:aria-label="#{codes.viewer}">
 <div class="d-flex flex-wrap align-items-center gap-2 mb-2"><button class="btn btn-outline-secondary" type="button" data-code-prev th:text="#{codes.previous}"></button><span data-code-position></span><button class="btn btn-outline-secondary" type="button" data-code-next th:text="#{codes.next}"></button><button class="btn btn-outline-secondary" type="button" data-code-copy disabled th:text="#{codes.copy}"></button><label><input type="checkbox" data-code-wrap> <span th:text="#{codes.wrap}"></span></label><button class="btn btn-outline-secondary" type="button" data-code-details aria-pressed="true" th:text="#{codes.details}"></button><button class="btn btn-outline-secondary ms-auto" type="button" data-code-close th:text="#{gallery.close}"></button></div>
 <div data-code-node></div><p data-code-status role="status" class="small my-2"></p><pre class="code-full" tabindex="0" th:aria-label="#{codes.viewer}" data-code-stage></pre><div class="cg-info small" data-code-info></div><p class="small text-body-secondary mt-2 mb-0" th:text="#{codes.keys}"></p>
 </dialog>
</main><section layout:fragment="pageSpecificJsScripts"><script defer th:src="@{/js/codeGallery.js}"></script></section></body></html>
