<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{_layoutMobile}">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{exportedFiles.title}">Exported files</title>
</head>
<body>
<section layout:fragment="content">

    <h1 th:text="#{exportedFiles.title}">Exported files</h1>
    <div th:if="${importError != null}" class="alert alert-warning" th:text="${#messages.msg(importError)}"></div>
<div th:replace="~{common/ctbImportDiagnostics :: details}"></div>
    <div th:if="${importCount != null}" class="alert alert-success" th:text="#{ctbImport.success(${importCount})}"></div>
    <p th:if="${#lists.isEmpty(files)}" class="text-body-secondary" th:text="#{exportedFiles.empty}"></p>
    <div class="table-responsive"><table class="table table-striped">
        <thead>
        <tr>
            <th>#</th>
            <th th:text="#{exportedFiles.name}">File Name</th>
            <th th:text="#{exportedFiles.modified}">Creation Date</th>
            <th th:text="#{exportedFiles.size}">Size (bytes)</th>
            <th th:text="#{exportedFiles.actions}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="file, iStats : ${files}">
            <td th:text="${iStats.index + 1}"></td>
            <td th:text="${file.name}">sample.ctb</td>
            <td th:text="${#dates.format(file.creationDate, 'dd-MM-yyyy HH:mm:ss')}">12-08-2024 12:34:56</td>
            <td th:text="${file.size}">123456</td>
            <td>
                <a th:href="@{'/download/' + ${file.name}}" class="btn btn-success">
                    <i class="fas fa-download" aria-hidden="true"></i> <span th:text="#{exportedFiles.download}">Download</span>
                </a>
                <form th:if="${importWritable and #authorization.expression('hasRole(''ADMIN'')') and #strings.endsWith(#strings.toLowerCase(file.name), '.ctb')}"
                      th:action="@{/exportedFiles/import/preview}" method="post" class="d-inline">
                    <input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
                    <input type="hidden" name="filename" th:value="${file.name}">
                    <button type="submit" class="btn btn-primary" th:title="#{ctbImport.title}">
                        <i class="fas fa-file-import"></i> <span th:text="#{ctbImport.action}">Import</span>
                    </button>
                </form>
                <form th:action="@{'/delete/' + ${file.name}}" method="post"
                      class="d-inline delete-form" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:attr="data-confirm-message=#{exportedFiles.deleteConfirm(${file.name})}">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash-alt" aria-hidden="true"></i> <span th:text="#{exportedFiles.delete}">Delete</span>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table></div>



</section>
</body>
</html>
