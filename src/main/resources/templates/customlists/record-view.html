<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layoutMobile}"><head><title th:text="${recordView.record.name}"></title><section layout:fragment="pageSpecificCssStyles"><style>.record-layout-frame{width:100%;height:75vh;min-height:400px;resize:vertical;border:1px solid #aaa;background:white}</style></section></head><body><section layout:fragment="content" class="container-fluid py-2">
<h1 class="fs-5" th:text="|${recordView.record.name} [${recordView.record.nodeId}]|"></h1><p class="small text-muted" th:text="|${recordView.catalog.name} · ${recordView.view.name}|"></p>
<nav class="d-flex flex-wrap gap-2 mb-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/cherrytemplatenode/{id}/views(id=${recordView.catalog.templateId},recordId=${recordView.record.nodeId},_tenantView=${tenantViewToken})}" th:text="#{recordviews.title}"></a><a class="btn btn-sm btn-outline-primary" th:href="@{/nodes/{id}(id=${recordView.record.nodeId},_tenantView=${tenantViewToken})}" th:text="#{report.node}"></a><a class="btn btn-sm btn-outline-secondary" th:href="@{/cherrytemplatenode/{id}/view/{view}(id=${recordView.catalog.templateId},view=${recordView.view.id},recordId=${recordView.record.nodeId},_tenantView=${tenantViewToken})}" th:text="#{recordviews.refresh}"></a><a th:if="${layoutAdmin and recordView.catalog.writable}" class="btn btn-sm btn-outline-secondary" th:href="@{/nodes/content/{id}(id=${recordView.view.contentId},_tenantView=${tenantViewToken})}" th:text="#{recordviews.edit}"></a><a class="btn btn-sm btn-outline-danger" th:href="@{/cherrytemplatenode/{id}/view/{view}/pdf(id=${recordView.catalog.templateId},view=${recordView.view.id},recordId=${recordView.record.nodeId},_tenantView=${tenantViewToken})}" th:text="#{recordviews.pdf}"></a></nav><p class="small text-muted" th:text="#{recordviews.pdfHelp}"></p>
<details class="alert alert-warning" th:if="${!recordView.output.warnings.isEmpty()}"><summary th:text="#{recordviews.warnings}"></summary><ul><li th:each="warning : ${recordView.output.warnings}" th:text="${warning}"></li></ul></details>
<iframe class="record-layout-frame" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" th:title="#{recordviews.frame}" th:attr="srcdoc=${recordView.output.document}"></iframe>
</section></body></html>
