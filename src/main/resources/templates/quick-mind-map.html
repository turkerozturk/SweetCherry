<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${rootNodeName} + ' - Quick Mind Map'">
        Quick Mind Map
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css}">

    <style>
        html, body {
            min-height: 100%;
        }

        .mind-map-panel {
            min-height: calc(100vh - 8rem);
            overflow: auto;
        }

        .mermaid {
            min-width: max-content;
            text-align: center;
        }

        .mermaid svg {
            max-width: none !important;
            height: auto;
        }

        .mermaid .ct-bold .nodeLabel,
        .mermaid .ct-bold span,
        .mermaid .ct-bold p {
            font-weight: 700 !important;
        }

        .mermaid-node-label-with-icon {
            display: inline-flex !important;
            align-items: center;
            gap: 5px;
        }

        .mermaid-node-icon {
            display: block;
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            object-fit: contain;
        }

        .mermaid-node-icon.is-placeholder {
            opacity: .3;
        }

        .mermaid-content-link,
        .mermaid-content-link:link,
        .mermaid-content-link:visited,
        .mermaid-content-link:hover,
        .mermaid-content-link:active {
            display: inline-flex;
            flex: 0 0 16px;
            color: inherit;
            text-decoration: none;
        }

        .mermaid .mermaid-node-navigation {
            cursor: pointer;
        }

        /* Düğüm gezinmesi metnin rengini ve görünüşünü değiştirmez. */
        .mermaid .mermaid-node-navigation .nodeLabel {
            text-decoration: none !important;
        }
    </style>

    <!--
      Yalnız controller'ın doğruladığı #RRGGBB değerleri ve sayısal node ID'leri
      kullanılarak üretilir.
    -->
    <style th:if="${colors}" th:text="${mermaidColorCss}"></style>
</head>

<body class="bg-light">

<main class="container-fluid py-3">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="h5 mb-0" th:text="${rootNodeName}">Mind map</h1>

        <span class="badge text-bg-secondary"
              th:text="'Node ' + ${rootNodeId}">
            Node
        </span>

        <span class="badge text-bg-light border"
              th:text="'Level ' + ${maximumLevel}">
            Level
        </span>

        <span th:if="${foldChat}"
              class="badge text-bg-light border">
            chat dalları kapalı
        </span>

        <span th:if="${colors}"
              class="badge text-bg-light border">
            renkler açık
        </span>

        <span th:if="${icons}"
              class="badge text-bg-warning">
            ikon sınıfları açık
        </span>
    </div>

    <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
            <form method="get"
                  class="d-flex flex-wrap align-items-center gap-2"
                  th:action="@{/quick-mind-map/{nodeId}(nodeId=${rootNodeId})}">

                <label for="level" class="small mb-0">Level</label>
                <input id="level"
                       class="form-control form-control-sm"
                       style="width: 5rem"
                       type="number"
                       name="level"
                       min="0"
                       step="1"
                       th:value="${maximumLevel}">

                <label for="icons" class="small mb-0 ms-1">İkon</label>
                <select id="icons"
                        class="form-select form-select-sm w-auto"
                        name="icons">
                    <option value="true" th:selected="${icons}">Göster</option>
                    <option value="false" th:selected="${!icons}">Gizle</option>
                </select>

                <label for="colors" class="small mb-0 ms-1">Renk</label>
                <select id="colors"
                        class="form-select form-select-sm w-auto"
                        name="colors">
                    <option value="true" th:selected="${colors}">Göster</option>
                    <option value="false" th:selected="${!colors}">Gizle</option>
                </select>

                <input type="hidden" name="foldChat" th:value="${foldChat}">

                <button type="submit" class="btn btn-sm btn-primary">
                    Uygula
                </button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm mind-map-panel">
        <div class="card-body">
            <!-- th:text kullanıldığı için node başlıkları HTML olarak çalıştırılmaz. -->
            <pre class="mermaid" th:text="${mermaidDefinition}">
mindmap
  root((Quick mind map))
            </pre>
        </div>
    </div>

    <div id="mermaid-icon-data" hidden>
        <span th:each="iconNode : ${iconNodes}"
              th:attr="data-node-class=${iconNode.nodeClass},
                       data-icon-name=${iconNode.iconName}"></span>
    </div>

    <div id="mermaid-navigation-data" hidden>
        <span th:each="navigationNode : ${navigationNodes}"
              th:attr="data-node-class=${navigationNode.nodeClass},
                       data-target-node-id=${navigationNode.targetNodeId},
                       data-content-node-id=${navigationNode.contentNodeId}"></span>
    </div>
</main>

<script th:src="@{/js/thirdparty/mermaid/mermaid.min.js}"></script>

<script th:inline="javascript">
    (async () => {
        const iconsEnabled = /*[[${icons}]]*/ true;
        const colorsEnabled = /*[[${colors}]]*/ true;
        const foldChatEnabled = /*[[${foldChat}]]*/ true;
        const maximumLevel = /*[[${maximumLevel}]]*/ 3;
        const mapBaseUrl = /*[[@{/quick-mind-map/}]]*/ '/quick-mind-map/';
        const contentBaseUrl = /*[[@{/quick-node-content/}]]*/ '/quick-node-content/';
        const iconBaseUrl = /*[[@{/img/ctbicons/}]]*/ '/img/ctbicons/';
        const zeroIconUrl = /*[[@{/img/icons/zero.svg}]]*/ '/img/icons/zero.svg';

        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: 'default',
            mindmap: {
                useMaxWidth: false
            }
        });

        await mermaid.run({querySelector: '.mermaid'});

        addContentLinks();
        addNodeNavigation();

        function addContentLinks() {
            const iconsByNodeClass = new Map();
            document.querySelectorAll('#mermaid-icon-data [data-node-class]')
                .forEach(iconData => {
                    iconsByNodeClass.set(
                        iconData.dataset.nodeClass,
                        iconData.dataset.iconName
                    );
                });

            document.querySelectorAll(
                '#mermaid-navigation-data [data-node-class]'
            ).forEach(navigationData => {
                const nodeClass = navigationData.dataset.nodeClass;
                const contentNodeId = navigationData.dataset.contentNodeId;
                const iconName = iconsByNodeClass.get(nodeClass);
                const nodeElement = document.querySelector(
                    '.mermaid .' + CSS.escape(nodeClass)
                );

                if (!nodeElement || !contentNodeId) {
                    return;
                }

                const label = nodeElement.querySelector('.nodeLabel');
                if (!label || label.querySelector('.mermaid-content-link')) {
                    return;
                }

                label.classList.add('mermaid-node-label-with-icon');

                const hasVisibleNodeIcon = iconsEnabled && Boolean(iconName);
                const link = document.createElement('a');
                link.className = 'mermaid-content-link';
                link.href = contentBaseUrl + encodeURIComponent(contentNodeId);
                link.target = '_blank';
                link.rel = 'noopener';
                link.title = 'Düğüm içeriğini yeni sekmede aç';

                const image = document.createElement('img');
                image.className = hasVisibleNodeIcon
                    ? 'mermaid-node-icon'
                    : 'mermaid-node-icon is-placeholder';
                image.src = hasVisibleNodeIcon
                    ? iconBaseUrl + encodeURIComponent(iconName) + '.png'
                    : zeroIconUrl;
                image.alt = 'İçeriği aç';
                image.dataset.iconName = iconName || 'zero';

                link.append(image);
                label.prepend(link);
            });
        }

        function addNodeNavigation() {
            const navigationDataElements = document.querySelectorAll(
                '#mermaid-navigation-data [data-node-class]'
            );

            navigationDataElements.forEach(navigationData => {
                const nodeClass = navigationData.dataset.nodeClass;
                const targetNodeId = navigationData.dataset.targetNodeId;
                const nodeElement = document.querySelector(
                    '.mermaid .' + CSS.escape(nodeClass)
                );

                if (!nodeElement || !targetNodeId) {
                    return;
                }

                const label = nodeElement.querySelector('.nodeLabel');
                if (!label) {
                    return;
                }

                label.classList.add('mermaid-node-navigation');
                label.setAttribute('role', 'link');
                label.setAttribute('tabindex', '0');

                const openTargetMap = event => {
                    if (event?.target?.closest('.mermaid-content-link')) {
                        return;
                    }

                    const query = new URLSearchParams({
                        level: String(maximumLevel),
                        icons: String(iconsEnabled),
                        colors: String(colorsEnabled),
                        foldChat: String(foldChatEnabled)
                    });

                    window.location.assign(
                        mapBaseUrl
                        + encodeURIComponent(targetNodeId)
                        + '?'
                        + query.toString()
                    );
                };

                label.addEventListener('click', openTargetMap);
                label.addEventListener('keydown', event => {
                    if (event.target.closest('.mermaid-content-link')) {
                        return;
                    }

                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        openTargetMap(event);
                    }
                });
            });
        }
    })();
</script>

</body>
</html>
