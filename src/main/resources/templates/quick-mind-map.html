<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${rootNodeName} + ' - Quick Mind Map'">
        Quick Mind Map
    </title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.7/css/bootstrap.min.css}">

    <style>
        html, body {
            min-height: 100%;
        }

        .mind-map-panel {
            min-height: calc(100vh - 8rem);
            overflow: auto;
        }

        .mermaid {
            min-width: max-content;
            text-align: center;
        }

        .mermaid svg {
            max-width: none !important;
            height: auto;
        }

        .mermaid .ct-bold .nodeLabel,
        .mermaid .ct-bold span,
        .mermaid .ct-bold p {
            font-weight: 700 !important;
        }

        .mermaid-node-label-with-icon {
            display: inline-flex !important;
            align-items: center;
            gap: 5px;
        }

        .mermaid-node-icon {
            width: 16px;
            height: 16px;
            flex: 0 0 16px;
            object-fit: contain;
        }
    </style>

    <!--
      Yalnız controller'ın doğruladığı #RRGGBB değerleri ve sayısal node ID'leri
      kullanılarak üretilir.
    -->
    <style th:if="${colors}" th:text="${mermaidColorCss}"></style>
</head>

<body class="bg-light">

<main class="container-fluid py-3">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="h5 mb-0" th:text="${rootNodeName}">Mind map</h1>

        <span class="badge text-bg-secondary"
              th:text="'Node ' + ${rootNodeId}">
            Node
        </span>

        <span class="badge text-bg-light border"
              th:text="'Level ' + ${maximumLevel}">
            Level
        </span>

        <span th:if="${foldChat}"
              class="badge text-bg-light border">
            chat dalları kapalı
        </span>

        <span th:if="${colors}"
              class="badge text-bg-light border">
            renkler açık
        </span>

        <span th:if="${icons}"
              class="badge text-bg-warning">
            ikon sınıfları açık
        </span>
    </div>

    <div class="card shadow-sm mind-map-panel">
        <div class="card-body">
            <!-- th:text kullanıldığı için node başlıkları HTML olarak çalıştırılmaz. -->
            <pre class="mermaid" th:text="${mermaidDefinition}">
mindmap
  root((Quick mind map))
            </pre>
        </div>
    </div>

    <div id="mermaid-icon-data" hidden>
        <span th:each="iconNode : ${iconNodes}"
              th:attr="data-node-class=${iconNode.nodeClass},
                       data-icon-name=${iconNode.iconName}"></span>
    </div>
</main>

<script th:src="@{/js/thirdparty/mermaid/mermaid.min.js}"></script>

<script th:inline="javascript">
    (async () => {
        const iconsEnabled = /*[[${icons}]]*/ false;
        const iconBaseUrl = /*[[@{/img/ctbicons/}]]*/ '/img/ctbicons/';

        mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'strict',
            theme: 'default',
            mindmap: {
                useMaxWidth: false
            }
        });

        await mermaid.run({querySelector: '.mermaid'});

        if (iconsEnabled) {
            addCherryTreeIcons();
        }

        function addCherryTreeIcons() {
            const iconDataElements = document.querySelectorAll(
                '#mermaid-icon-data [data-node-class]'
            );

            iconDataElements.forEach(iconData => {
                const nodeClass = iconData.dataset.nodeClass;
                const iconName = iconData.dataset.iconName;
                const nodeElement = document.querySelector(
                    '.mermaid .' + CSS.escape(nodeClass)
                );

                if (!nodeElement || !iconName) {
                    return;
                }

                const label = nodeElement.querySelector('.nodeLabel');
                if (!label || label.querySelector('.mermaid-node-icon')) {
                    return;
                }

                label.classList.add('mermaid-node-label-with-icon');

                const image = document.createElement('img');
                image.className = 'mermaid-node-icon';
                image.src = iconBaseUrl
                    + encodeURIComponent(iconName)
                    + '.png';
                image.alt = '';
                image.setAttribute('aria-hidden', 'true');
                image.dataset.iconName = iconName;

                label.prepend(image);
            });
        }
    })();
</script>

</body>
</html>
