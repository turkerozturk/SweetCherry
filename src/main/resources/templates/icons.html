<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}">
<head><title th:text="#{icons.header}"></title>
<section layout:fragment="pageSpecificCssStyles"><style>
.icon-browser .icon-picture{width:28px;height:28px;object-fit:contain}
.icon-browser td{vertical-align:middle}.icon-browser #icon-table{min-width:54rem}
.icon-browser #icon-table th,.icon-browser .icon-symbol{white-space:nowrap}
.icon-browser .icon-controls>div{max-width:100%}.icon-browser select{max-width:min(24rem,85vw)}
</style></section></head>
<body><main layout:fragment="content" class="container-fluid py-3 icon-browser">
<div class="d-flex align-items-center flex-wrap gap-3 mb-2"><h1 class="h3 mb-0" th:text="#{icons.header}"></h1><span class="text-body-secondary" th:text="#{icons.count(${icons.rows.size()},${icons.total})}"></span></div>
<p class="small text-body-secondary" th:text="#{icons.description}"></p>
<form method="get" th:action="@{/icons}" class="icon-controls d-flex flex-wrap align-items-end gap-2 mb-3">
<input type="hidden" name="sort" th:value="${icons.options.sort}"><input type="hidden" name="dir" th:value="${icons.options.dir}">
<div class="flex-grow-1"><label for="icon-search" class="form-label" th:text="#{icons.search}"></label><input id="icon-search" name="q" type="search" maxlength="200" class="form-control" th:value="${icons.options.q}"></div>
<div><label for="icon-category" class="form-label" th:text="#{icons.column.category}"></label><select id="icon-category" name="category" class="form-select"><option value="" th:text="#{icons.allCategories}"></option><option th:each="category:${icons.categories}" th:value="${category.key}" th:selected="${category.key==icons.options.category}" th:text="${category.label}"></option></select></div>
<button class="btn btn-primary" th:text="#{icons.show}"></button><a class="btn btn-outline-secondary" th:href="@{/icons}" th:text="#{icons.reset}"></a></form>
<p th:if="${icons.rows.empty}" class="alert alert-info" th:text="#{icons.empty}"></p>
<div class="table-responsive"><table class="table table-bordered table-sm" id="icon-table"><thead><tr>
<th scope="col" th:attr="aria-sort=${icons.options.sort=='index'?(icons.options.dir=='asc'?'ascending':'descending'):'none'}"><a th:href="@{/icons(sort='index',dir=${icons.options.sort=='index' and icons.options.dir=='asc'?'desc':'asc'},q=${icons.options.q},category=${icons.options.category})}"><span th:text="#{icons.column.index}"></span> <span aria-hidden="true" th:text="${icons.options.sort=='index'?(icons.options.dir=='asc'?'↑':'↓'):'↕'}"></span></a></th>
<th scope="col" th:text="#{icons.column.icon}"></th>
<th scope="col" th:attr="aria-sort=${icons.options.sort=='name'?(icons.options.dir=='asc'?'ascending':'descending'):'none'}"><a th:href="@{/icons(sort='name',dir=${icons.options.sort=='name' and icons.options.dir=='asc'?'desc':'asc'},q=${icons.options.q},category=${icons.options.category})}"><span th:text="#{icons.column.humanReadableName}"></span> <span aria-hidden="true" th:text="${icons.options.sort=='name'?(icons.options.dir=='asc'?'↑':'↓'):'↕'}"></span></a></th>
<th scope="col" th:attr="aria-sort=${icons.options.sort=='category'?(icons.options.dir=='asc'?'ascending':'descending'):'none'}"><a th:href="@{/icons(sort='category',dir=${icons.options.sort=='category' and icons.options.dir=='asc'?'desc':'asc'},q=${icons.options.q},category=${icons.options.category})}"><span th:text="#{icons.column.category}"></span> <span aria-hidden="true" th:text="${icons.options.sort=='category'?(icons.options.dir=='asc'?'↑':'↓'):'↕'}"></span></a></th>
<th scope="col" th:text="#{icons.column.name}"></th><th scope="col" th:text="#{icons.column.idIn16bit}"></th><th scope="col" th:text="#{icons.column.id}"></th>
</tr></thead><tbody><tr th:each="row:${icons.rows}">
<td th:text="${row.index}"></td><td><img class="icon-picture" loading="lazy" th:src="@{/img/icons/{name}.svg(name=${row.icon.iconName})}" th:alt="${row.icon.iconNameForHuman}"></td>
<td th:text="${row.icon.iconNameForHuman}"></td><td th:text="${row.categoryLabel}" th:title="${row.icon.category}"></td><td class="icon-symbol" th:text="${row.icon.name}"></td><td th:text="${row.icon.iconIdIn16bit}"></td><td th:text="${row.icon.iconId}"></td>
</tr></tbody></table></div>
</main></body></html>
