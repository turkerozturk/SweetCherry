<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" xmlns:layout="http://www.w3.org/1999/xhtml"
      layout:decorate="~{_layoutMobile}">
<head>
    <title th:text="#{sessionInfo.title}"></title>


</head>
<body>
<section layout:fragment="content">



    <h1 th:text="#{sessionInfo.title}"></h1>
    <p class="text-muted" th:text="#{sessionInfo.help}"></p>
    <p class="alert alert-warning" th:if="${debug}" th:text="#{sessionInfo.debugWarning}"></p>


    <table class="table">
        <tr>
            <th th:text="#{sessionInfo.information}"></th>
            <th th:text="#{sessionInfo.value}"></th>
        </tr>
        <tr>
            <td th:text="#{sessionInfo.idleLimit}"></td>
            <td th:text="${sessionMaxInactiveInterval}"></td>
        </tr>
        <tr>
            <td th:text="#{sessionInfo.created}"></td>
            <td th:text="${#dates.format(new java.util.Date(sessionCreationTime), 'dd-MM-yyyy HH:mm:ss')}"></td>
        </tr>
        <tr>
            <td th:text="#{sessionInfo.accessed}"></td>
            <td th:text="${#dates.format(new java.util.Date(sessionLastAccessedTime), 'dd-MM-yyyy HH:mm:ss')}"></td>
        </tr>
        <tr th:if="${debug}">
            <td th:text="#{sessionInfo.id}"></td>
            <td th:text="${sessionId}"></td>
        </tr>

    </table>


    <h2 th:if="${debug}" th:text="#{sessionInfo.attributes}"></h2>
    <table class="table table-striped" th:if="${debug}">
        <tr th:each="entry : ${sessionAttributes}">
            <td th:text="#{sessionInfo.sessionAttribute(${entry.key})}"></td>
            <td th:text="${entry.value}"></td>
        </tr>
    </table>

    <h2 th:if="${debug}" th:text="#{sessionInfo.cookies}"></h2>
    <table class="table table-striped" th:if="${debug}">
        <tr>
            <th th:text="#{sessionInfo.cookieName}"></th>
            <th th:text="#{sessionInfo.cookieValue}"></th>
        </tr>
        <tr th:each="entry : ${cookies}">
            <td th:text="${entry.key}"></td>
            <td th:text="${entry.value}"></td>
        </tr>
    </table>

    <h2 th:if="${debug}" th:text="#{sessionInfo.contextParameters}"></h2>
    <table class="table table-striped" th:if="${debug}">
        <tr>
            <th th:text="#{sessionInfo.parameter}"></th>
            <th th:text="#{sessionInfo.value}"></th>
        </tr>
        <tr th:each="entry : ${servletContextParams}">
            <td th:text="${#messages.msg(entry.key)}"></td>
            <td th:text="${entry.value}"></td>
        </tr>
    </table>


    <h2 th:if="${debug}" th:text="#{sessionInfo.contextAttributes}"></h2>
    <table class="table table-striped" th:if="${debug}">
        <tr>
            <th th:text="#{sessionInfo.attribute}"></th>
            <th th:text="#{sessionInfo.value}"></th>
        </tr>
        <tr th:each="entry : ${servletContextAttributes}">
            <td th:text="#{sessionInfo.contextAttribute(${entry.key})}"></td>
            <td th:text="${entry.value}"></td>
        </tr>
    </table>

    <h2 th:if="${debug}" th:text="#{sessionInfo.sessionStorage}"></h2>
    <table id="sessionStorageTable" class="table table-striped" th:if="${debug}">
        <tr>
            <th th:text="#{sessionInfo.key}"></th>
            <th th:text="#{sessionInfo.value}"></th>
        </tr>
    </table>

    <h2 th:if="${debug}" th:text="#{sessionInfo.localStorage}"></h2>
    <table id="localStorageTable" class="table table-striped" th:if="${debug}">
        <tr>
            <th th:text="#{sessionInfo.key}"></th>
            <th th:text="#{sessionInfo.value}"></th>
        </tr>
    </table>

    <h2 th:if="${debug}" th:text="#{sessionInfo.indexedDB}"></h2>
    <table id="indexedDBTable" class="table table-striped" th:if="${debug}">
        <tr>
            <th th:text="#{sessionInfo.key}"></th>
            <th th:text="#{sessionInfo.value}"></th>
        </tr>
    </table>


    <script th:if="${debug}">
        function displaySessionStorage() {
            let sessionStorageTable = document.getElementById('sessionStorageTable');

            for (let i = 0; i < sessionStorage.length; i++) {
                let key = sessionStorage.key(i);
                let value = sessionStorage.getItem(key);

                let row = sessionStorageTable.insertRow();
                let cellKey = row.insertCell(0);
                let cellValue = row.insertCell(1);

                cellKey.textContent = key;
                cellValue.textContent = value;
            }
        }

        window.addEventListener('load', displaySessionStorage);
    </script>

    <script th:if="${debug}">
        function displayStorage(storage, tableId) {
            let storageTable = document.getElementById(tableId);

            for (let i = 0; i < storage.length; i++) {
                let key = storage.key(i);
                let value = storage.getItem(key);

                let row = storageTable.insertRow();
                let cellKey = row.insertCell(0);
                let cellValue = row.insertCell(1);

                cellKey.textContent = key;
                cellValue.textContent = value;
            }
        }

        window.addEventListener('load', function() {
            displayStorage(sessionStorage, 'sessionStorageTable');
            displayStorage(localStorage, 'localStorageTable');
        });
    </script>

    <script th:if="${debug}">
        function displayIndexedDB() {
            let indexedDBTable = document.getElementById('indexedDBTable');

            let request = indexedDB.open('myDatabase', 1);

            request.onupgradeneeded = function(event) {
                let db = event.target.result;
                if (!db.objectStoreNames.contains('myStore')) {
                    db.createObjectStore('myStore', { keyPath: 'id' });
                }
            };

            request.onsuccess = function(event) {
                let db = event.target.result;
                let transaction = db.transaction('myStore', 'readonly');
                let objectStore = transaction.objectStore('myStore');

                objectStore.openCursor().onsuccess = function(event) {
                    let cursor = event.target.result;
                    if (cursor) {
                        let row = indexedDBTable.insertRow();
                        let cellKey = row.insertCell(0);
                        let cellValue = row.insertCell(1);

                        cellKey.textContent = cursor.key;
                        cellValue.textContent = JSON.stringify(cursor.value);

                        cursor.continue();
                    }
                };
            };

            request.onerror = function(event) {
                console.error('IndexedDB error:', event.target.errorCode);
            };
        }

        window.addEventListener('load', function() {
            displayIndexedDB();
        });
    </script>


</section>
</body>
</html>
