<!DOCTYPE html>
<html lang="en" th:lang="${#locale.language}"
      xmlns:layout="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:attr="data-bs-theme=${uiTheme == 'dark' ? 'dark' : 'light'}">

    <head>

        <title>SweetCherry</title>

        <div th:replace="~{common/meta :: headerMeta}"></div>

        <div th:replace="~{common/meta :: headerCssLibraries}"></div>

        <section layout:fragment="pageSpecificCssStyles"></section>

    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>

    <body>


        <div th:replace="~{common/header :: header}"></div>

        <section layout:fragment="content"></section>

        <div th:replace="~{common/footer :: footer}"></div>

        <div th:replace="~{common/footer :: footerJsLibraries}"></div>

        <section layout:fragment="pageSpecificJsScripts"></section>

        <th:block th:replace="~{common/sessionViewGuard :: sessionViewGuard}"></th:block>

    </body>

</html>
