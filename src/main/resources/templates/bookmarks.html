<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{_layout}">

<head>
    <title>Bookmarks</title>
    <section layout:fragment="pageSpecificCssStyles">

        <link rel="stylesheet" th:href="@{/css/bookmarks/bookmarks.css}"/>

    </section>

</head>
<body>
<section layout:fragment="content">

    <p th:if="${!#lists.isEmpty(missingBookmarkIds)}" class="alert alert-warning">
        <span th:text="#{bookmarks.missingNodes}">Bookmarks for missing nodes:</span>
        <span th:text="${missingBookmarkIds}">IDs</span>
    </p>

    <div th:if="${canWriteBookmarks == true and !#lists.isEmpty(missingBookmarkIds)}" sec:authorize="hasRole('ADMIN')">
        <div th:each="id : ${missingBookmarkIds}" class="d-flex gap-2 align-items-center mb-1"><span th:text="${id}"></span><th:block th:replace="~{common/bookmarkRemoveFragment :: remove(${id})}"></th:block></div>
    </div>
    <th:block th:if="${#lists.isEmpty(bookmarks)}">

        <p th:text="#{bookmarks.emptyHelp}"></p>





    </th:block>


    <th:block th:if="${!#lists.isEmpty(bookmarks)}">


        <h1 th:text="#{bookmarks.heading}"></h1>

        <table class="bookmarks-table table table-bordered border-success table-sm">
            <thead>
            <tr>
                <th scope="col" class="bookmark-sequence" th:text="#{bookmarks.grid.th.sequence}">Sequence</th>

                <th scope="col" class="bookmark-date" th:text="#{bookmarks.grid.th.lastModifiedDate}">LAst Modified Date</th>
                <!--  <th scope="col" class="col-1" th:text="#{bookmarks.grid.th.icon}">Icon</th> -->

                <!-- <th scope="col" class="col-1" th:text="#{bookmarks.grid.th.nodeId}">Node Id</th> -->

                <th scope="col" th:text="#{bookmarks.grid.th.nodeName}">Node Name</th>

                <!-- <th scope="col" class="col-2" th:text="#{bookmarks.grid.th.tags}">Tags</th> -->

            </tr>
            </thead>
            <tbody>
            <tr th:each="bookmark:${bookmarks}">
                <td th:text="${bookmark.sequence}"></td>

                <td th:text="${#dates.format(new java.util.Date(bookmark.node.lastSaveTimestamp * 1000), 'yyyy-MM-dd')}"
                    th:title="${bookmark.node.lastSaveTimestamp + ', ' + #dates.format(new java.util.Date(bookmark.node.lastSaveTimestamp * 1000), 'yyyy-MM-dd HH:mm:ss')}"
                    class="text-center"
                ></td>

                <!-- <td><a th:href="@{/nodes/{nodeId}(nodeId=${bookmark.nodeId})}" th:text="${bookmark.nodeId}"></a></td> -->


                <td>
                    <div class="bookmark-entry">
                    <div class="bookmark-remove" th:if="${canWriteBookmarks == true}" sec:authorize="hasRole('ADMIN')"><th:block th:replace="~{common/bookmarkRemoveFragment :: remove(${bookmark.nodeId})}"></th:block></div>
                    <div class="bookmark-details">


                    <th:block>
                        <a th:href="@{/nodes/{id}(id=${bookmark.nodeId},_tenantView=${tenantViewToken})}">

                            <img th:src="@{/img/icons/__${bookmark.node.nodeIcon.iconName}__.svg}"
                                 th:alt="${'/img/icons/' + bookmark.node.nodeIcon.iconName}" class="iconcss"
                                 th:title="${bookmark.node.nodeIcon.iconName}"/>
                        </a>

                        <span th:text="${bookmark.node.name}"
                              th:style="${'color:' + bookmark.node.titleColorAsHtmlHex + ';'}"
                              th:class="${bookmark.node.boldnessBit ? 'boldTitle' : ''}">
                        </span>
                        &nbsp;-&nbsp;(id:&nbsp;
                        <a th:href="@{/nodes/{id}(id=${bookmark.nodeId},_tenantView=${tenantViewToken})}">
                            <span th:text="${bookmark.nodeId}"></span>
                        </a>
                        &nbsp;)

                        <span th:unless="${#strings.isEmpty(bookmark.node.tags)}"
                              th:text="${' - (tags: ' + bookmark.node.tags + ')'}"></span>
                    </th:block>


                    <th:block th:if="${bookmarkPaths[bookmark.nodeId]}" class="breadcrumbs">

                        <a th:href="@{/rootnode(_tenantView=${tenantViewToken})}">Kök</a>
                        <span th:each="entry : ${bookmarkPaths[bookmark.nodeId]}">
                        <span>/</span>
                        <a th:href="@{/nodes/{id}(id=${entry.key},_tenantView=${tenantViewToken})}" th:text="${entry.value}"></a>
                        </span>

                    </th:block>

                    </div></div>
                </td>


                <!-- <td th:text="${bookmark.node.tags}"></td> -->

            </tr>
            </tbody>
        </table>

    </th:block>

</section>
<section layout:fragment="pageSpecificJsScripts"><script th:src="@{/js/node/confirmNodeCreation.js}"></script></section>
</body>
</html>
