<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{security.error.title}">Request failed</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
        main { max-width: 40rem; margin: 10vh auto; }
        code { overflow-wrap: anywhere; }
    </style>
</head>
<body>
<main>
    <h1><span th:text="${status}">500</span> <span th:text="${error}">Request failed</span></h1>
    <p th:text="#{security.error.message}">The request could not be completed. You can return to the home page.</p>
    <p><span th:text="#{security.error.reference}">Reference</span>: <code th:text="${errorId}"></code></p>
    <a th:href="@{/}" th:text="#{security.error.home}">Home page</a>
</main>
</body>
</html>
