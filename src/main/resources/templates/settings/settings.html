<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}">
<head><title th:text="#{settings.otherInfo}">Other Information</title></head>
<body><section layout:fragment="content">
<h1 th:text="#{settings.otherInfo}"></h1>
<p th:text="#{settings.configurationFile}"></p>
<p><span th:text="#{settings.requestAddress}"></span> <code th:text="${requestAddress}"></code></p>
<p th:text="#{settings.portOverview}"></p>
<p><a href="https://github.com/turkerozturk/SweetCherry/blob/main/documentation/tr/settings.md" target="_blank" rel="noopener noreferrer" th:text="#{settings.guide}"></a></p>
<div class="table-responsive"><table class="table table-sm">
<thead><tr><th th:text="#{settings.tableColumnHeader.valueLabel}"></th><th th:text="#{settings.tableColumnHeader.currentValue}"></th><th th:text="#{settings.explanation}"></th></tr></thead>
<tbody><tr th:each="item : ${configurationValues}"><td><code th:text="${item.key}"></code></td><td th:text="${item.value}"></td><td th:text="${#messages.msg('settings.explain.' + item.key)}"></td></tr></tbody>
</table></div>
<p th:text="#{settings.highlighterDescription}"></p>
<p th:text="#{settings.astronomyTimezoneDescription}"></p>
<p th:text="#{settings.tenantConfiguration}"></p>
<h2>SSL / TLS</h2>
<p th:text="#{settings.sslGuidance}"></p>
<ul><li><code>server.ssl.certificate</code>, <code>server.ssl.certificate-private-key</code></li>
<li><code>server.ssl.key-store</code>, <code>server.ssl.key-store-type</code>, <code>server.ssl.key-alias</code></li>
<li><code>server.ssl.key-store-password</code>, <code>server.ssl.key-password</code></li>
<li><code>server.ssl.trust-store</code>, <code>server.ssl.trust-store-type</code>, <code>server.ssl.trust-store-password</code></li></ul>
</section></body></html>
