<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><th:block th:fragment="event(entry)"><button type="button" class="cal-entry" th:style="|color:${entry.color};font-weight:${entry.bold ? 'bold' : 'normal'}|" th:title="|${entry.name} [${entry.id}]|" th:attr="data-id=${entry.id},data-content-id=${entry.contentId},data-name=${entry.name},data-local=${entry.local},data-created=${entry.created},data-modified=${entry.modified},data-shared=${entry.shared},data-read-only=${entry.readOnly}"><time th:text="${entry.time}"></time><img th:src="@{/img/ctbicons/{icon}.png(icon=${entry.icon})}" width="16" height="16" alt="" loading="lazy"><span th:text="${entry.name.isEmpty() ? #messages.msg('tags.unnamed') : entry.name}"></span><small th:if="${entry.shared}" th:aria-label="#{tags.shared}">↗</small></button></th:block></body></html>
