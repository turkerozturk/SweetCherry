<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{_layout}">
<head><title th:text="#{calendar.title}"></title><section layout:fragment="pageSpecificCssStyles"><link rel="stylesheet" th:href="@{/css/calendar/calendar.css}"><link rel="stylesheet" th:href="@{/css/node/tags.css}"></section></head>
<body><section layout:fragment="content" id="nodeCalendar" class="container-fluid p-2 cal-page" th:attr="data-editable=${calendarEditable}">
<h1 th:text="${calendar.mode == 'month' ? #messages.msg('calendar.month') : #messages.msg('calendar.week')}"></h1>
<p class="cal-help"><span th:text="#{calendar.help}"></span> <span th:text="#{calendar.zone(${calendar.zone})}"></span></p>
<nav class="cal-toolbar" th:aria-label="#{calendar.navigation}">
<a th:if="${calendar.canPrevious}" class="btn btn-sm btn-outline-primary" th:href="@{/nodes/calendar/{mode}(mode=${calendar.mode},date=${calendar.previous},tag=${calendar.tags},match=${calendar.match},_tenantView=${tenantViewToken})}" th:text="#{calendar.previous}"></a>
<strong th:text="${calendar.title}"></strong>
<a th:if="${calendar.canNext}" class="btn btn-sm btn-outline-primary" th:href="@{/nodes/calendar/{mode}(mode=${calendar.mode},date=${calendar.next},tag=${calendar.tags},match=${calendar.match},_tenantView=${tenantViewToken})}" th:text="#{calendar.next}"></a>
<a class="btn btn-sm btn-outline-secondary" th:href="@{/nodes/calendar/{mode}(mode=${calendar.mode},tag=${calendar.tags},match=${calendar.match},_tenantView=${tenantViewToken})}" th:text="#{calendar.today}"></a>
<a class="btn btn-sm btn-outline-secondary" th:href="@{/nodes/calendar/week(date=${calendar.anchor},tag=${calendar.tags},match=${calendar.match},_tenantView=${tenantViewToken})}" th:text="#{calendar.week}"></a>
<a class="btn btn-sm btn-outline-secondary" th:href="@{/nodes/calendar/month(date=${calendar.anchor},tag=${calendar.tags},match=${calendar.match},_tenantView=${tenantViewToken})}" th:text="#{calendar.month}"></a>
</nav>
<form class="cal-filters" method="get" th:action="@{/nodes/calendar/{mode}(mode=${calendar.mode})}"><input type="hidden" name="_tenantView" th:value="${tenantViewToken}">
<label><span th:text="#{calendar.goDate}"></span><input class="form-control form-control-sm" type="date" name="date" min="0001-01-01" max="9999-12-31" th:value="${calendar.anchor}" required></label>
<details><summary th:text="#{calendar.tags}"></summary><div data-tag-browser>
<label for="calendarTagFilter" th:text="#{tags.filter}"></label><input id="calendarTagFilter" type="search" class="form-control form-control-sm" data-tag-filter>
<div class="tag-choice-list" data-tag-list><label class="tag-choice" th:each="tag : ${calendarTags}"><input type="checkbox" name="tag" th:value="${tag}" th:checked="${calendar.tags.contains(tag)}"><span data-tag-label th:text="${tag}"></span></label></div><div data-tag-summary class="tag-summary"></div></div>
<label><span th:text="#{tags.match}"></span><select name="match" class="form-select form-select-sm"><option value="any" th:selected="${calendar.match == 'any'}" th:text="#{tags.any}"></option><option value="all" th:selected="${calendar.match == 'all'}" th:text="#{tags.all}"></option></select></label></details>
<button type="submit" class="btn btn-sm btn-primary" th:text="#{tags.show}"></button><a class="btn btn-sm btn-outline-secondary" th:href="@{/nodes/calendar/{mode}(mode=${calendar.mode},date=${calendar.anchor},_tenantView=${tenantViewToken})}" th:text="#{tags.reset}"></a>
</form>
<p th:if="${invalidCalendarDate}" class="alert alert-warning" th:text="#{calendar.invalidDate}"></p>
<p th:if="${calendar.truncated}" class="alert alert-warning" th:text="#{calendar.truncated(${calendar.count})}"></p>
<p class="cal-count" th:text="#{calendar.count(${calendar.count})}"></p>
<div th:if="${calendar.mode == 'month'}" class="cal-month" th:aria-label="#{calendar.month}">
<div class="cal-weekday" th:each="day : ${calendar.days.subList(0,7)}" th:text="${day.weekday}"></div>
<section class="cal-day" th:each="day : ${calendar.days}" th:classappend="${(day.today ? 'cal-today ' : '') + (!day.currentMonth ? 'cal-other' : '')}">
<h2 th:text="${day.label}"></h2><div class="cal-day-items"><th:block th:each="entry : ${day.entries}"><th:block th:replace="~{calendar/event :: event(${entry})}"></th:block></th:block></div></section></div>
<div th:if="${calendar.mode == 'week'}" class="cal-week-scroll"><table class="cal-week"><thead><tr><th th:text="#{calendar.time}"></th><th th:each="day : ${calendar.days}" th:classappend="${day.today ? 'cal-today' : ''}"><span th:text="${day.weekday}"></span> <span th:text="${day.label}"></span></th></tr></thead>
<tbody><tr th:each="hour : ${calendar.hours}"><th scope="row" th:text="${hour.label}"></th><td th:each="cell : ${hour.cells}"><div class="cal-hour-items"><th:block th:each="entry : ${cell}"><th:block th:replace="~{calendar/event :: event(${entry})}"></th:block></th:block></div></td></tr></tbody></table></div>
<div th:if="${calendar.mode == 'week'}" class="cal-agenda"><section class="cal-day" th:each="day : ${calendar.days}" th:classappend="${day.today ? 'cal-today' : ''}"><h2 th:text="${day.label}"></h2><div class="cal-day-items"><th:block th:each="entry : ${day.entries}"><th:block th:replace="~{calendar/event :: event(${entry})}"></th:block></th:block></div></section></div>
<dialog id="calendarDialog" class="cal-dialog" aria-labelledby="calendarDialogTitle">
<header><h2 id="calendarDialogTitle"></h2><button type="button" id="calendarClose" th:text="#{calendar.close}"></button></header>
<p id="calendarEntryId"></p><p id="calendarShared" hidden th:text="#{calendar.shared}"></p><p id="calendarLocked" hidden th:text="#{calendar.readOnly}"></p>
<p id="calendarDates"></p>
<form id="calendarCreatedForm" th:action="@{/nodes/calendar/0/created}" method="post">
<input type="hidden" name="_tenantView" th:value="${tenantViewToken}"><input type="hidden" name="expectedCreated"><input type="hidden" name="expectedModified">
<label for="calendarCreated" th:text="#{calendar.created}"></label><input id="calendarCreated" name="local" type="datetime-local" min="0001-01-01T00:00" max="9999-12-31T23:59" step="60" required>
<small th:text="#{calendar.editHelp}"></small><button type="submit" th:text="#{calendar.saveDate}"></button></form>
<div class="cal-dialog-actions"><button type="button" id="calendarShowContent" th:text="#{calendar.showContent}"></button><a id="calendarOpenNode" target="_blank" rel="noopener noreferrer" th:text="#{calendar.openNode}"></a><a id="calendarOpenTree" target="_blank" rel="noopener noreferrer" th:text="#{calendar.openTree}"></a></div>
<p id="calendarStatus" role="status" aria-live="polite"></p><div id="calendarContent" class="cal-content" hidden></div>
</dialog>
</section>

<section layout:fragment="pageSpecificJsScripts"><script th:inline="javascript">
window.calendarConfig={base:/*[[@{/nodes/calendar/}]]*/'/nodes/calendar/',node:/*[[@{/nodes/}]]*/'/nodes/',tree:/*[[@{/tree}]]*/'/tree',token:/*[[${tenantViewToken}]]*/'',zone:/*[[${calendar.zone}]]*/'UTC',messages:{loading:/*[[#{calendar.loading}]]*/'',failed:/*[[#{calendar.failed}]]*/'',saved:/*[[#{calendar.saved}]]*/'',saving:/*[[#{calendar.saving}]]*/'',invalidDate:/*[[#{calendar.invalidDate}]]*/'',conflict:/*[[#{calendar.conflict}]]*/'',readOnly:/*[[#{calendar.readOnly}]]*/'',missingNode:/*[[#{calendar.missingNode}]]*/'',largeContent:/*[[#{calendar.largeContent}]]*/'',created:/*[[#{calendar.created}]]*/'',modified:/*[[#{calendar.modified}]]*/''}};
</script><script defer th:src="@{/js/node/tags.js}"></script><script defer th:src="@{/js/calendar/calendar.js}"></script></section>
</body></html>
