ctbBackup.details=Dosya, doğrulama değeri ve kayıt sayıları
ctbBackup.restoreHelp=Yedeği incelemek veya geri dönmek için ayrı çalışma kopyası açın. Sihirbaz salt okunur başlar; ayarlarını onaylayarak yükleyin. Bu ilk sürüm açık veritabanı dosyasının üzerine yazmaz.
ctbBackup.workingCopy=Bu dosya doğrulanmış yedeğin ayrı çalışma kopyasıdır. Saklanan yedek ve asıl veritabanı değişmedi. Varsayılan seçim salt okunurdur. İptal ederseniz kopya working-copies klasöründe kalır.
ctbBackup.limits=Yalnız SQLite CTB desteklenir. Tüm bağlantılar için aynı anda tek yedekleme çalışır. Otomatik zamanlama ve saklama kuralı açıkça yapılandırılmalıdır. Farklı disk/cihazda ek kopya saklayın. Uygulama ayarları, giriş bilgileri ve dışarıya linklenmiş dosyalar yedeklenmez.
