ctbBackup.title=CTB yedekleri
ctbBackup.intro=Seçili SQLite CTB’nin resim, ek, kod kutusu, tablo, paylaşımlı düğüm ve yer işaretleriyle birlikte tutarlı tam yedeğini oluşturur. Salt okunur bağlantılar desteklenir. Editörde kaydedilmemiş değişiklikler dahil değildir.
