ctbBackup.error.failed=SQLite yedeklemesi başarısız. Boş disk alanını, kaynak dosyayı ve veritabanını kilitleyen diğer programları kontrol edip yeniden deneyin.
ctbBackup.error.interrupted=Yedekleme yarıda kesildi; tamamlanmış yedek sunulmadı. Yeniden başlattıktan sonra tekrar deneyin.
