settings.explain.server.port=Ana sunucu portu. Yerel server.ssl.enabled true olduğunda HTTPS kullanır.
settings.explain.server.http.port=Ek, şifrelenmemiş HTTP dinleme portu; genellikle localhost veya proxy arkasındaki bağlantı için kullanılır.
settings.explain.server.ssl.enabled=TLS işlemini SweetCherry içinde açar. TLS proxy tarafından sağlanıyorsa false kalabilir.
settings.explain.server.forward-headers-strategy=Açıkça tanımlanan güvenilir proxy düzeninde none bırakılır. Rastgele forwarded başlıklarına güvenilmemelidir.
settings.explain.server.servlet.session.timeout=Boşta kalan login oturumunun süresi. Yeni istek boşta kalma sayacını yeniler; toplam login süresi sınırı değildir.
settings.explain.myapp.security.proxy-https-enabled=HTTPS işaretini yalnız tanımlı güvenilir TCP bağlantısından kabul eder; HTTPS dinleme portu açmaz.
settings.explain.myapp.security.proxy-https-port=Güvenilir proxy tarafından sunulan dış HTTPS portu, genellikle 443. Uygulamanın dinleme portu değildir.
settings.explain.myapp.security.hsts-enabled=Tarayıcıya HTTPS kullanmaya devam etmesini bildirir. Güvenilir HTTPS alan adı için açılır; yerel HTTP veya self-signed denemeleri için değil.
settings.explain.myapp.login.trusted-proxy-address=Güvenilir proxy bağlantısının tam IP adresi. Boş ise doğrudan bağlantı kullanılır; proxy özel istemci/protokol başlıklarını kendisi yazmalıdır.
settings.explain.myapp.openWebBrowserOnStartup=Başlangıçta tarayıcıyı otomatik açar. Windows kontrol penceresinde ayrıca tarayıcı düğmesi bulunur.
settings.explain.myapp.debug=Uygulamanın debug özellikleri. Normal kullanımda false bırakılır; Spring log seviyesinden ayrıdır.
settings.explain.myapp.syntax-highlighting.enabled=Kod düğümleri ve codebox için tarayıcıda yerel highlight.js kullanır; Pygments veya Jython yoktur.
settings.explain.myapp.exportingFolderName=Üretilen dışa aktarma dosyalarının klasörü; mutlak değilse uygulamanın çalışma klasörüne göredir.
settings.explain.astronomy.enabled=Tanımlı konum için isteğe bağlı, çevrimdışı güneş/ay bilgisini gösterir.
settings.explain.astronomy.latitude=Tanımlı enlem; cihaz GPS bilgisi otomatik alınmaz.
settings.explain.astronomy.longitude=Tanımlı boylam; cihaz GPS bilgisi otomatik alınmaz.
settings.explain.astronomy.timezone=Europe/Istanbul gibi IANA zaman dilimi; yaz saati kurallarını da dikkate alır.

tenant.selectionMissing=Bu veri kaynağı artık mevcut değil. Güncel listeden bir kaynak seçin. Önceki seçiminiz hâlâ geçerliyse korunmuştur.
