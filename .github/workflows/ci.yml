name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Java 17 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for JavaScript tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test JavaScript
        shell: bash
        run: node --test src/test/js/*.test.cjs

      - name: Test release resource verification
        run: python -m unittest discover -s packaging -p "test_*.py"

      - name: Test local launcher XML with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: .\packaging\windows\test-launcher-config.ps1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          check-latest: true
          java-version: "17"
          cache: maven

      - name: Verify patched Java runtime
        run: python packaging/verify-java-runtime.py

      - name: Test bundled runtime policy
        if: runner.os == 'Windows'
        shell: powershell
        run: .\packaging\windows\test-runtime-policy.ps1

      - name: Test and package on Linux
        if: runner.os != 'Windows'
        run: sh ./mvnw --batch-mode clean package

      - name: Test and package on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode clean package

      - name: Verify runnable distribution
        shell: bash
        run: |
          test -f release/SweetCherry/SweetCherry.jar
          test -f release/SweetCherry/run.bat
          test -f release/SweetCherry/run.sh
          test -f release/SweetCherry/run.command
          test -f release/SweetCherry/LICENSE
          test -f release/SweetCherry/README.md
          test -f release/SweetCherry/CHANGELOG.md
          test -f release/SweetCherry/SECURITY.md
          test -f release/SweetCherry/documentation/tr/setup-and-run.md
          test -f release/SweetCherry/CTBDATA/demo.ctb
          test -f release/SweetCherry/allTenants/demo.txt
          test -d release/SweetCherry/exportedFiles

      - name: Verify offline viewer resources in packaged JAR
        run: python packaging/verify-viewer-resources.py --clean
