name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Java 17 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package on Linux
        if: runner.os != 'Windows'
        run: sh ./mvnw --batch-mode clean package

      - name: Test and package on Windows
        if: runner.os == 'Windows'
        run: .\mvnw.cmd --batch-mode clean package

      - name: Verify runnable distribution
        shell: bash
        run: |
          test -f release/SweetCherry/SweetCherry.jar
          test -f release/SweetCherry/run.bat
          test -f release/SweetCherry/run.sh
          test -f release/SweetCherry/run.command
          test -f release/SweetCherry/LICENSE
          test -f release/SweetCherry/README.md
          test -f release/SweetCherry/CHANGELOG.md
          test -f release/SweetCherry/documentation/tr/setup-and-run.md
          test -f release/SweetCherry/CTBDATA/demo.ctb
          test -f release/SweetCherry/allTenants/demo.txt
          test -d release/SweetCherry/exportedFiles
