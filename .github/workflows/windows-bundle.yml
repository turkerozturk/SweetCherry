name: Portable distribution (Windows builder)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and prepare the existing distribution
        shell: pwsh
        run: |
          .\mvnw.cmd --batch-mode clean package
          if ($LASTEXITCODE -ne 0) { throw 'Maven package failed.' }
      - name: Download and verify Java 17 JRE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'sweetcherry-tools'
          New-Item $tools -ItemType Directory -Force | Out-Null
          trap {
            Write-Host ($_ | Format-List * -Force | Out-String)
            Write-Host $_.ScriptStackTrace
            throw $_
          }
          Write-Host 'Reading Temurin runtime metadata.'
          $metadata = @(Invoke-RestMethod 'https://api.adoptium.net/v3/assets/latest/17/hotspot?architecture=x64&image_type=jre&os=windows&vendor=eclipse')
          if ($metadata.Count -ne 1) { throw 'Expected one Temurin Windows x64 JRE.' }
          $package = $metadata[0].binary.package
          if ($package.link -notlike 'https://github.com/adoptium/temurin17-binaries/releases/download/*') { throw 'Unexpected runtime download origin.' }
          $archive = Join-Path $tools 'runtime.zip'
          Write-Host 'Downloading and verifying Temurin runtime.'
          Invoke-WebRequest $package.link -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $package.checksum) { throw 'Runtime checksum mismatch.' }
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'This Windows runner needs Inno Setup 6 installed.' }
          "SC_ISCC=$iscc" >> $env:GITHUB_ENV
          "SC_RUNTIME_ARCHIVE=$archive" >> $env:GITHUB_ENV
          "SC_RUNTIME_SHA256=$($package.checksum)" >> $env:GITHUB_ENV
          "SC_RUNTIME_VERSION=$($metadata[0].release_name)" >> $env:GITHUB_ENV
      - name: Build Windows setup and all-OS ZIP
        shell: pwsh
        run: |
          ./packaging/windows/build-bundle.ps1 -IsccPath $env:SC_ISCC -RuntimeArchive $env:SC_RUNTIME_ARCHIVE -RuntimeSha256 $env:SC_RUNTIME_SHA256 -RuntimeVersion $env:SC_RUNTIME_VERSION
      - name: Verify Java-free ZIP and build metadata
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem dist/windows/sweetcherry_*_all_os_portable.zip)
          if ($zip.Count -ne 1) { throw 'Expected one Java-free ZIP.' }
          $verify = Join-Path $env:RUNNER_TEMP 'sweetcherry-portable-check'
          Expand-Archive $zip[0].FullName $verify
          $portable = Join-Path $verify 'SweetCherry'
          if (Test-Path "$portable/runtime") { throw 'Portable ZIP contains Java.' }
          if (!(Test-Path 'release/SweetCherry/runtime/bin/java.exe')) { throw 'Setup runtime was removed.' }
          $info = Get-Content "$portable/build-info.json" -Raw | ConvertFrom-Json
          $setupInfo = Get-Content 'release/SweetCherry/build-info.json' -Raw | ConvertFrom-Json
          if ($info.packageRuntimeIncluded -ne $false -or $setupInfo.packageRuntimeIncluded -ne $true) { throw 'Incorrect runtime metadata.' }
          Get-ChildItem release/SweetCherry -File -Recurse -Force | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path 'release/SweetCherry').Path, $_.FullName)
            if ($relative -ne 'build-info.json' -and $relative -notmatch '^runtime[\\/]') {
              $copy = Join-Path $portable $relative
              if (!(Test-Path $copy) -or (Get-FileHash $_.FullName).Hash -ne (Get-FileHash $copy).Hash) { throw "Portable file changed/missing: $relative" }
            }
          }
      - name: Test installer and launcher without system Java
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem dist/windows/sweetcherry_*_all_os_portable_with_java_and_setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer.' }
          ./packaging/windows/smoke-test.ps1 -InstallerPath $installer[0].FullName
      - uses: actions/upload-artifact@v4
        with:
          name: sweetcherry-release-assets
          path: |
            dist/windows/sweetcherry_*_all_os_portable_with_java_and_setup.exe
            dist/windows/sweetcherry_*_all_os_portable.zip
            dist/windows/sweetcherry-*-third_party_licences.zip
            dist/windows/sha256sums.txt
          if-no-files-found: error
          retention-days: 14
